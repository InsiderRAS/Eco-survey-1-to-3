<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSIDER RAS Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>:root{--bg:#f6f5f1;--surf:#fff;--fg:#1c2230;--mut:#5d6677;--line:#dcdad2;--acc:#1f3a6e;--acc2:#c9892b;--accfg:#fff;--good:#1d7a4d;--goodbg:#e3f3ea;--bad:#b3392f;--badbg:#fbe8e5;--warn:#9a6a10;--warnbg:#fbf1dc;--sel:#e8eefb;--ft:'Inter','Noto Sans Devanagari',system-ui,sans-serif;--fd:'Space Grotesk','Noto Sans Devanagari',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--surf:#1a2030;--fg:#e8eaf0;--mut:#9aa3b5;--line:#2b3347;--acc:#8fb0f0;--acc2:#e0a84a;--accfg:#0f1626;--good:#5fd093;--goodbg:#15301f;--bad:#f08a80;--badbg:#38191a;--warn:#e6b45a;--warnbg:#33290f;--sel:#212c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--surf:#1a2030;--fg:#e8eaf0;--mut:#9aa3b5;--line:#2b3347;--acc:#8fb0f0;--acc2:#e0a84a;--accfg:#0f1626;--good:#5fd093;--goodbg:#15301f;--bad:#f08a80;--badbg:#38191a;--warn:#e6b45a;--warnbg:#33290f;--sel:#212c47;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ft);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:8px;background:var(--acc);color:var(--accfg);font:700 17px var(--fd);letter-spacing:.02em}
.bn{font:700 18px var(--fd);letter-spacing:.08em}
.bs{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
h1{font:600 clamp(22px,4.5vw,34px)/1.2 var(--fd);margin:18px 0 20px;text-wrap:balance;max-width:20em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surf)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--acc);color:var(--accfg)}
.seg.sm button{padding:5px 10px;font-size:13px}
.cfg{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.cfgrow{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.cfgblk{min-width:0}
.lab{font:600 12px var(--ft);text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:8px;display:block}
.lab.sp{margin-top:14px}
.sm{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.modes{display:grid;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px}
.mode span{font-size:13px;color:var(--mut)}
.mode.on{border-color:var(--acc);background:var(--sel)}
input[type=number]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-top:5px solid var(--tone);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.cn{font:600 12px var(--ft);text-transform:uppercase;letter-spacing:.1em;color:var(--tone)}
.card h2{font:600 20px/1.25 var(--fd);margin:2px 0;text-wrap:balance}
.cm{font-size:13px;color:var(--mut)}
.cbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1.5px solid var(--line);background:var(--surf);padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.on{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.btn.full{width:100%;margin-top:12px}
.foot{font-size:12.5px;color:var(--mut);text-align:center;margin-top:24px}
.lnk{border:0;background:none;color:var(--acc);font-weight:600;padding:4px 0;font-size:14px}
.tbar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:6px 0 10px}
.tt{display:flex;flex-direction:column;min-width:0;flex:1}
.tt b{font:600 15px var(--fd)}.tt span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tr{display:flex;align-items:center;gap:10px}
.tm{font:700 15px var(--fd);font-variant-numeric:tabular-nums;background:var(--surf);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.tm.warn{color:var(--bad);border-color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog div{height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:8px 0 12px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.side{position:sticky;top:12px}
.palm{display:none}
.palbtn{display:none}
.pal{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.ph{font:600 12px var(--ft);text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:10px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pb{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.pb.s{border-color:var(--bad)}
.pb.a{background:var(--good);border-color:var(--good);color:#fff}
.pb.m::after{content:'';position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--acc2)}
.pb.c{outline:2.5px solid var(--acc);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin-top:12px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.d{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line);display:inline-block}
.d.a{background:var(--good);border-color:var(--good)}.d.s{border-color:var(--bad)}.d.m{background:var(--acc2);border-radius:50%;border-color:var(--acc2)}.d.c{border:2px solid var(--acc)}
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.qcard.rv{margin-bottom:14px}
.qcard.rv.c{border-left:5px solid var(--good)}.qcard.rv.w{border-left:5px solid var(--bad)}.qcard.rv.u{border-left:5px solid var(--line)}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qn{font:700 15px var(--fd)}
.tag,.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);letter-spacing:.04em}
.badge.c{background:var(--goodbg);color:var(--good);border-color:var(--good)}.badge.w{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.badge.m{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.stem{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}
.stmt{margin:0 0 6px 4px;font-size:15.5px;overflow-wrap:anywhere}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 12px}
.lcol{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.lh{font:700 11px var(--ft);text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:6px}
.li{margin:0 0 6px;font-size:14.5px;overflow-wrap:anywhere}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;align-items:flex-start;min-width:0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--sel)}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:inherit}
.lt{font-weight:700;color:var(--acc);flex:none;min-width:24px}
.ot{overflow-wrap:anywhere;min-width:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.nav .btn:last-child{margin-left:auto}
.fb{padding:9px 12px;border-radius:9px;font-weight:600;margin:6px 0;font-size:14px}
.fb.ok{background:var(--goodbg);color:var(--good)}.fb.no{background:var(--badbg);color:var(--bad)}
.expl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14.5px}
.eh{font:700 12px var(--ft);text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.expl ul{margin:6px 0 8px;padding-left:20px}.expl li{margin-bottom:4px;overflow-wrap:anywhere}
.ins{margin:6px 0;padding:8px 10px;background:var(--warnbg);border-radius:8px;overflow-wrap:anywhere}
.src{margin:6px 0 0;font-size:12.5px;color:var(--mut)}
.yr{font-size:13px;color:var(--mut);margin:0 0 6px}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--surf);border-radius:14px;padding:22px;max-width:400px;width:100%;border:1px solid var(--line)}
.mbox h3{font:600 20px var(--fd);margin:0 0 8px}
.mb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.rs{display:grid;grid-template-columns:200px 1fr;gap:16px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;margin:8px 0 14px;align-items:center}
.big{text-align:center;background:var(--acc);color:var(--accfg);border-radius:12px;padding:18px 8px}
.bv{font:700 44px/1 var(--fd);font-variant-numeric:tabular-nums}.bl{font-size:13px;margin-top:6px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sv{font:700 22px var(--fd);font-variant-numeric:tabular-nums}.sl{font-size:12px;color:var(--mut)}
.stat.g .sv{color:var(--good)}.stat.r .sv{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.rh{font:600 22px var(--fd);margin:24px 0 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
@media (max-width:820px){
 .cfgrow{grid-template-columns:1fr}
 .tgrid{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .palbtn{display:inline-block}
 .palm{display:block;margin-bottom:12px}
 .pg{grid-template-columns:repeat(8,1fr)}
 .rs{grid-template-columns:1fr}
}
@media (max-width:520px){
 .lists{grid-template-columns:1fr}
 .nav .btn{flex:1 1 auto}.nav .btn:last-child{margin-left:0}
 .pg{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>const DATA={"1":[{"n":1,"t":"Data-based","g":"RAS + UPSC","ans":1,"q":["As per the Economic Review 2025-26, what was the share of Agriculture and allied sectors in Rajasthan's Gross Value Added (GVA) at current prices in 2025-26 (AE), and how does it compare with 2011-12?"],"o":["25.33 per cent, down from 28.56 per cent in 2011-12","25.74 per cent, down from 28.56 per cent in 2011-12","27.13 per cent, down from 28.56 per cent in 2011-12","28.56 per cent, up from 25.74 per cent in 2011-12"],"e":["The Review states the sector contributed 25.74% of GVA at current prices in 2025-26, against 28.56% in 2011-12. The share has fallen as services have grown.","(a) is the constant (2011-12) price share (25.33%) from the Key Indicators table. (c) is the 2024-25 current-price share (27.13%). (d) reverses the direction of change."],"i":"Examiners often swap constant-price and current-price figures, or the years. Always check the price-basis qualifier.","s":"Chapter 1, p. 3; Key Indicators, p. vi (rows 3 and 4).","hq":["आर्थिक समीक्षा 2025-26 के अनुसार, 2025-26 (अग्रिम अनुमान) में चालू कीमतों पर राजस्थान के सकल मूल्य वर्धन (GVA) में कृषि एवं संबद्ध क्षेत्रों का हिस्सा कितना था, और 2011-12 की तुलना में यह कैसा है?"],"ho":["25.33 प्रतिशत, 2011-12 के 28.56 प्रतिशत से कम","25.74 प्रतिशत, 2011-12 के 28.56 प्रतिशत से कम","27.13 प्रतिशत, 2011-12 के 28.56 प्रतिशत से कम","28.56 प्रतिशत, 2011-12 के 25.74 प्रतिशत से अधिक"],"he":["समीक्षा के अनुसार चालू कीमतों पर 2025-26 में इस क्षेत्र का GVA में योगदान 25.74% रहा, जबकि 2011-12 में यह 28.56% था। सेवा क्षेत्र की वृद्धि के साथ यह हिस्सा घटा है।","(a) मुख्य संकेतक तालिका का स्थिर (2011-12) कीमतों पर हिस्सा (25.33%) है। (c) 2024-25 का चालू कीमत हिस्सा (27.13%) है। (d) परिवर्तन की दिशा को उलट देता है।"],"hi":"परीक्षक प्रायः स्थिर और चालू कीमतों के आँकड़े या वर्ष आपस में बदल देते हैं। कीमत-आधार का विशेषण हमेशा जाँचें।","hs":"अध्याय 1, पृ. 3; प्रमुख संकेतक, पृ. vi (rows 3 और 4)."},{"n":2,"t":"Multi-statement","g":"UPSC","ans":0,"q":["Consider the following statements regarding Agriculture and allied sectors in Rajasthan:","1. Between 2021-22 and 2025-26, GVA grew at a CAGR of 3.82% at constant (2011-12) prices and 8.10% at current prices.","2. The gap between the two CAGRs mainly reflects the effect of price changes rather than a real expansion of output.","3. The growth rate of GVA in 2025-26 (AE) at constant prices is 3.47%.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"e":["Statement 1: Correct. GVA rose from ₹1.92 lakh crore to ₹2.23 lakh crore at constant prices (3.82% CAGR) and from ₹3.23 lakh crore to ₹4.41 lakh crore at current prices (8.10% CAGR) between 2021-22 and 2025-26.","Statement 2: Correct. A general economics point: constant-price figures remove inflation, so the gap between the two growth rates is roughly the price (deflator) effect.","Statement 3: Incorrect. 3.47% is the growth at current prices. At constant prices, 2025-26 (AE) growth is only 0.22%."],"i":"The trap is attaching the right number to the wrong price basis. This is the core real/nominal distinction between constant and current prices.","s":"Chapter 1, pp. 2-4 (Figure 1.2).","hq":["राजस्थान के कृषि एवं संबद्ध क्षेत्रों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. 2021-22 से 2025-26 के बीच GVA स्थिर (2011-12) कीमतों पर 3.82% और चालू कीमतों पर 8.10% की चक्रवृद्धि वार्षिक दर (CAGR) से बढ़ा।","2. दोनों CAGR के बीच का अंतर मुख्यतः उत्पादन के वास्तविक विस्तार के बजाय कीमतों में परिवर्तन के प्रभाव को दर्शाता है।","3. स्थिर कीमतों पर 2025-26 (अग्रिम अनुमान) में GVA की वृद्धि दर 3.47% है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"he":["कथन 1: सही। 2021-22 से 2025-26 के बीच GVA स्थिर कीमतों पर ₹1.92 लाख करोड़ से ₹2.23 लाख करोड़ (CAGR 3.82%) और चालू कीमतों पर ₹3.23 लाख करोड़ से ₹4.41 लाख करोड़ (CAGR 8.10%) हुआ।","कथन 2: सही। एक सामान्य अर्थशास्त्रीय बिंदु: स्थिर कीमतों के आँकड़े मुद्रास्फीति को हटा देते हैं, इसलिए दोनों वृद्धि दरों का अंतर मोटे तौर पर कीमत (अपस्फीतिक) प्रभाव है।","कथन 3: गलत। 3.47% चालू कीमतों पर वृद्धि है। स्थिर कीमतों पर 2025-26 (अग्रिम अनुमान) की वृद्धि केवल 0.22% है।"],"hi":"जाल यह है कि सही संख्या को गलत कीमत-आधार से जोड़ दिया जाता है। यह स्थिर और चालू कीमतों (वास्तविक/मौद्रिक) के अंतर की मूल अवधारणा है।","hs":"अध्याय 1, पृ. 2-4 (चित्र 1.2)."},{"n":3,"t":"Incorrect statement","g":"RAS + UPSC","ans":2,"q":["Which of the following statements regarding the composition of Rajasthan's Agriculture and allied GVA at current prices in 2025-26 (AE) is NOT correct?"],"o":["The GVA of the livestock sector (₹2.17 lakh crore) is higher than that of the crop sector (₹1.88 lakh crore).","Fishing contributes less than one per cent of the Agriculture and allied GVA.","Crops form the largest component, accounting for about half of the total.","Forestry and logging contribute about 7.49 per cent."],"e":["Livestock is the largest component at 49.35%, followed by crops at 42.61%, forestry and logging at 7.49% and fishing at 0.54% (total GVA ₹4.41 lakh crore). So (c) is wrong.","(a), (b) and (d) are all stated in the Review. The Review notes that livestock GVA is \"even higher than the crop sector\"."],"i":"Many candidates assume crops dominate agriculture. Rajasthan's livestock-led structure, which buffers rainfall volatility, is a standard Rajasthan-specific twist.","s":"Chapter 1, pp. 3-5 (Figure 1.3).","hq":["2025-26 (अग्रिम अनुमान) में चालू कीमतों पर राजस्थान के कृषि एवं संबद्ध GVA की संरचना के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["पशुपालन क्षेत्र का GVA (₹2.17 लाख करोड़) फसल क्षेत्र (₹1.88 लाख करोड़) से अधिक है।","मत्स्य पालन का योगदान कृषि एवं संबद्ध GVA के एक प्रतिशत से कम है।","फसलें सबसे बड़ा घटक हैं, जो कुल का लगभग आधा हैं।","वानिकी और लॉगिंग का योगदान लगभग 7.49 प्रतिशत है।"],"he":["पशुपालन सबसे बड़ा घटक है (49.35%), उसके बाद फसलें (42.61%), वानिकी और लॉगिंग (7.49%) तथा मत्स्य पालन (0.54%) हैं (कुल GVA ₹4.41 लाख करोड़)। अतः (c) गलत है।","(a), (b) और (d) समीक्षा में उल्लिखित हैं। समीक्षा में कहा गया है कि पशुपालन का GVA फसल क्षेत्र से भी अधिक है।"],"hi":"अनेक अभ्यर्थी मानते हैं कि कृषि में फसलें हावी हैं। राजस्थान की पशुपालन-प्रधान संरचना, जो वर्षा की अस्थिरता से बचाव करती है, राजस्थान-विशिष्ट मानक बिंदु है।","hs":"अध्याय 1, पृ. 3-5 (चित्र 1.3)."},{"n":4,"t":"Match the following","g":"RAS","ans":3,"q":["Match List I (sub-sector) with List II (estimated growth at constant 2011-12 prices, 2025-26) and select the correct answer using the code below.","A. Crops","B. Livestock","C. Forestry and Logging","D. Fishing","1. −5.01%","2. 5.20%","3. 2.67%","4. 0.87%"],"o":["A-2, B-1, C-3, D-4","A-1, B-2, C-4, D-3","A-4, B-3, C-2, D-1","A-1, B-2, C-3, D-4"],"e":["Crops contract by 5.01%, livestock grows 5.20%, forestry and logging 2.67% and fishing 0.87%.","Livestock and the other allied sectors cushion the crop decline, which is why the overall sector grows by only 0.22%."],"i":"Match-the-following with growth rates rewards remembering the sign and the rank, not just the decimals.","s":"Chapter 1, p. 4.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (उप-क्षेत्र) का सूची II (2025-26 में स्थिर 2011-12 कीमतों पर अनुमानित वृद्धि) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. फसलें","B. पशुपालन","C. वानिकी और लॉगिंग","D. मत्स्य पालन","1. −5.01%","2. 5.20%","3. 2.67%","4. 0.87%"],"ho":["A-2, B-1, C-3, D-4","A-1, B-2, C-4, D-3","A-4, B-3, C-2, D-1","A-1, B-2, C-3, D-4"],"he":["फसलों में 5.01% की गिरावट है, पशुपालन में 5.20%, वानिकी और लॉगिंग में 2.67% और मत्स्य पालन में 0.87% की वृद्धि है।","पशुपालन और अन्य संबद्ध क्षेत्र फसलों की गिरावट की भरपाई करते हैं, इसीलिए समग्र क्षेत्र की वृद्धि केवल 0.22% है।"],"hi":"वृद्धि दरों वाले मिलान प्रश्नों में केवल दशमलव नहीं, चिह्न और क्रम याद रखना उपयोगी है।","hs":"अध्याय 1, पृ. 4."},{"n":5,"t":"Multi-statement","g":"RAS","ans":2,"q":["Consider the following statements based on the Agriculture Census 2015-16 (compared with 2010-11) for Rajasthan:","1. The number of operational land holdings rose by 11.14 per cent to 76.55 lakh.","2. The total area under operational holdings increased, even though the average holding size fell.","3. The number of large holdings (above 10 hectares) declined by 11.14 per cent.","4. The Review attributes the rise in fragmentation, \"probably\", to the splitting of joint families.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Correct. Holdings rose from 68.88 lakh to 76.55 lakh (+11.14%).","Statement 2: Incorrect. Total area decreased by 1.24%, from 211.36 lakh ha to 208.73 lakh ha.","Statement 3: Correct. Large holdings fell by 11.14%. The same figure also appears as total holdings growth, so read the subject carefully.","Statement 4: Correct, as stated in the Review."],"i":"Examiners exploit repeated numbers (11.14% twice, with opposite signs). Average holding size fell from 3.07 ha to 2.73 ha, a decline of 11.07%.","s":"Chapter 1, p. 6; Table 1.1, p. 7.","hq":["कृषि जनगणना 2015-16 (2010-11 की तुलना में) के आधार पर राजस्थान के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. परिचालित जोतों की संख्या 11.14 प्रतिशत बढ़कर 76.55 लाख हो गई।","2. औसत जोत आकार घटने के बावजूद परिचालित जोतों का कुल क्षेत्रफल बढ़ा।","3. बड़ी जोतों (10 हेक्टेयर से अधिक) की संख्या में 11.14 प्रतिशत की कमी आई।","4. समीक्षा विखंडन में वृद्धि का कारण, \"संभवतः\", संयुक्त परिवारों के विभाजन को बताती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","केवल 1, 3 और 4","1, 2, 3 और 4"],"he":["कथन 1: सही। जोतें 68.88 लाख से बढ़कर 76.55 लाख (+11.14%) हुईं।","कथन 2: गलत। कुल क्षेत्रफल 1.24% घटा, 211.36 लाख हेक्टेयर से 208.73 लाख हेक्टेयर।","कथन 3: सही। बड़ी जोतें 11.14% घटीं। यही आँकड़ा कुल जोतों की वृद्धि के रूप में भी आता है, इसलिए विषय ध्यान से पढ़ें।","कथन 4: सही, जैसा समीक्षा में कहा गया है।"],"hi":"परीक्षक दोहराई गई संख्याओं (11.14% दो बार, विपरीत चिह्नों के साथ) का लाभ उठाते हैं। औसत जोत आकार 3.07 हेक्टेयर से घटकर 2.73 हेक्टेयर हुआ, यानी 11.07% की कमी।","hs":"अध्याय 1, पृ. 6; तालिका 1.1, पृ. 7."},{"n":6,"t":"Analytical","g":"UPSC","ans":1,"q":["Between the Agriculture Censuses of 2010-11 and 2015-16, Rajasthan saw more marginal, small and semi-medium holdings, fewer large holdings, and a fall in average holding size. Which of the following is the most valid inference?"],"o":["Land consolidation has taken place, improving the viability of farming.","Subdivision of holdings has increased fragmentation, which may constrain mechanisation and economies of scale.","Large farmers have expanded their operated area at the cost of marginal farmers.","The declining average size shows that cultivated area has expanded sharply."],"e":["Marginal holdings grew by 22.30% and their area by 19.79%. Large holdings fell by 11.14% and their area by 13.20%. This is subdivision, not consolidation, so (a) and (c) are wrong.","(d) is wrong because total operated area fell by 1.24%. Average size fell because the number of holdings rose while area did not."],"i":"UPSC often asks for the inference a table supports, not the table's numbers. Check that the inference matches the direction of change.","s":"Chapter 1, p. 6; Table 1.1, p. 7.","hq":["कृषि जनगणना 2010-11 और 2015-16 के बीच राजस्थान में सीमांत, लघु और अर्ध-मध्यम जोतें बढ़ीं, बड़ी जोतें घटीं और औसत जोत आकार घटा। निम्नलिखित में से कौन-सा निष्कर्ष सबसे उपयुक्त है?"],"ho":["भूमि चकबंदी हुई है, जिससे खेती की व्यवहार्यता बढ़ी है।","जोतों के उप-विभाजन से विखंडन बढ़ा है, जो यंत्रीकरण और पैमाने की मितव्ययिता में बाधक हो सकता है।","बड़े किसानों ने सीमांत किसानों की कीमत पर अपना परिचालित क्षेत्र बढ़ाया है।","औसत आकार का घटना दर्शाता है कि खेती योग्य क्षेत्र में तेज़ वृद्धि हुई है।"],"he":["सीमांत जोतें 22.30% और उनका क्षेत्र 19.79% बढ़ा। बड़ी जोतें 11.14% और उनका क्षेत्र 13.20% घटा। यह उप-विभाजन है, चकबंदी नहीं, अतः (a) और (c) गलत हैं।","(d) गलत है क्योंकि कुल परिचालित क्षेत्र 1.24% घटा। औसत आकार इसलिए घटा कि जोतों की संख्या बढ़ी जबकि क्षेत्र नहीं बढ़ा।"],"hi":"UPSC प्रायः तालिका की संख्याओं के बजाय उस निष्कर्ष को पूछता है जिसे तालिका समर्थन देती है। जाँचें कि निष्कर्ष परिवर्तन की दिशा से मेल खाता है।","hs":"अध्याय 1, पृ. 6; तालिका 1.1, पृ. 7."},{"n":7,"t":"Multi-statement","g":"RAS","ans":3,"q":["Consider the following statements regarding female operational land holdings in Rajasthan (Agriculture Census 2015-16):","1. The number of female operational holdings rose from 5.46 lakh to 7.75 lakh, a growth of 41.94 per cent.","2. The area under female holdings rose by 24.44 per cent to 16.55 lakh hectares.","3. Marginal holdings account for nearly half of all female holdings by number (about 49.55 per cent, computed from Table 1.1).","4. The number of female holdings grew more slowly than that of male holdings.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 2, 3 and 4","1, 2 and 3 only"],"e":["Statements 1 and 2: Correct, directly stated in the Review.","Statement 3: Correct. 384 ÷ 775 = 49.55%. Note that Figure 1.8 labels this share as \"area\", but the arithmetic matches the number of holdings (see data flag in the Summary pages).","Statement 4: Incorrect. Female holdings grew 41.94%, while male holdings grew only 8.48%."],"i":"The growth in female holdings (+41.94%) is a likely RAS data-comparison question. The female versus male growth comparison is the usual trap.","s":"Chapter 1, p. 6; Table 1.1, p. 7.","hq":["राजस्थान में महिला परिचालित जोतों (कृषि जनगणना 2015-16) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. महिला परिचालित जोतों की संख्या 5.46 लाख से बढ़कर 7.75 लाख हो गई, यानी 41.94 प्रतिशत की वृद्धि।","2. महिला जोतों के अंतर्गत क्षेत्र 24.44 प्रतिशत बढ़कर 16.55 लाख हेक्टेयर हो गया।","3. सीमांत जोतें संख्या के आधार पर सभी महिला जोतों का लगभग आधा हैं (लगभग 49.55 प्रतिशत, तालिका 1.1 से गणना की गई)।","4. महिला जोतों की संख्या पुरुष जोतों की तुलना में धीमी गति से बढ़ी।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","1, 2, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 1 और 2: सही, समीक्षा में सीधे उल्लिखित।","कथन 3: सही। 384 ÷ 775 = 49.55%। ध्यान दें कि चित्र 1.8 इस हिस्से को \"क्षेत्र\" कहता है, पर गणित जोतों की संख्या से मेल खाता है (सारांश पृष्ठों में डेटा फ्लैग देखें)।","कथन 4: गलत। महिला जोतें 41.94% बढ़ीं, जबकि पुरुष जोतें केवल 8.48% बढ़ीं।"],"hi":"महिला जोतों की वृद्धि (+41.94%) RAS का संभावित डेटा-तुलना प्रश्न है। महिला बनाम पुरुष वृद्धि की तुलना सामान्य जाल है।","hs":"अध्याय 1, पृ. 6; तालिका 1.1, पृ. 7."},{"n":8,"t":"Match the following","g":"RAS","ans":0,"q":["Match the agro-climatic zone (List I) with the districts covered (List II) and select the correct answer using the code below.","A. Irrigated North Western Plain (I-B)","B. Humid Southern Plains (IV-B)","C. Humid South Eastern Plain (V)","D. Flood-prone Eastern Plain (III-B)","1. Kota, Baran, Bundi, Jhalawar","2. Sriganganagar and Hanumangarh","3. Banswara, Dungarpur, Pratapgarh, Salumber","4. Alwar, Deeg, Bharatpur, Dholpur, Karauli, Sawai Madhopur"],"o":["A-2, B-3, C-1, D-4","A-2, B-1, C-3, D-4","A-4, B-3, C-1, D-2","A-3, B-2, C-4, D-1"],"e":["Table 1.2 divides Rajasthan into 10 agro-climatic zones.","Zone I-B (cotton and guar in kharif) covers Sriganganagar and Hanumangarh. Zone IV-B (maize and paddy) covers the southern tribal districts. Zone V (jowar and soyabean) covers the Hadoti districts. Zone III-B covers the flood-prone eastern districts."],"i":"RAS often tests zone-to-district-to-crop links. The Review also notes the North-Western region covers 61% of the state (desert or semi-desert) and the South-Eastern region 39%.","s":"Chapter 1, p. 6; Table 1.2, p. 8.","m":[1,4,4],"h":["List I (Zone)","List II (Districts)"],"hq":["सूची I (कृषि-जलवायु क्षेत्र) का सूची II (शामिल जिले) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. सिंचित उत्तर-पश्चिमी मैदान (I-B)","B. आर्द्र दक्षिणी मैदान (IV-B)","C. आर्द्र दक्षिण-पूर्वी मैदान (V)","D. बाढ़-प्रवण पूर्वी मैदान (III-B)","1. कोटा, बारां, बूंदी, झालावाड़","2. श्रीगंगानगर और हनुमानगढ़","3. बाँसवाड़ा, डूंगरपुर, प्रतापगढ़, सलूंबर","4. अलवर, डीग, भरतपुर, धौलपुर, करौली, सवाई माधोपुर"],"ho":["A-2, B-3, C-1, D-4","A-2, B-1, C-3, D-4","A-4, B-3, C-1, D-2","A-3, B-2, C-4, D-1"],"he":["तालिका 1.2 राजस्थान को 10 कृषि-जलवायु क्षेत्रों में बाँटती है।","क्षेत्र I-B (खरीफ में कपास और ग्वार) में श्रीगंगानगर और हनुमानगढ़ आते हैं। क्षेत्र IV-B (मक्का और धान) में दक्षिणी जनजातीय जिले, क्षेत्र V (ज्वार और सोयाबीन) में हाड़ौती के जिले और क्षेत्र III-B में बाढ़-प्रवण पूर्वी जिले आते हैं।"],"hi":"RAS में क्षेत्र-जिला-फसल संबंध प्रायः पूछे जाते हैं। समीक्षा यह भी बताती है कि उत्तर-पश्चिमी क्षेत्र राज्य के 61% (मरुस्थलीय या अर्ध-मरुस्थलीय) और दक्षिण-पूर्वी क्षेत्र 39% भाग में है।","hs":"अध्याय 1, पृ. 6; तालिका 1.2, पृ. 8."},{"n":9,"t":"Multi-statement","g":"RAS + UPSC","ans":3,"q":["Consider the following statements regarding crop production in Rajasthan in 2025-26 (Advance Estimates) compared with 2024-25 (Final):","1. Total foodgrain production is expected to be 283.98 lakh tonnes, a decline of 8.28 per cent.","2. Kharif foodgrain production is expected to fall sharply (21.61 per cent), while rabi foodgrain production falls only marginally (0.49 per cent).","3. Pulses production is estimated to rise in both kharif and rabi seasons.","4. Total oilseeds production is expected to decline.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","1, 2 and 4 only","2, 3 and 4 only","1, 2 and 3 only"],"e":["Statements 1 and 2: Correct (foodgrains 309.62 to 283.98; kharif 114.24 to 89.55; rabi 195.38 to 194.43 lakh tonnes).","Statement 3: Correct. Kharif pulses are up 2.34% (to 20.52 lakh t) and rabi pulses up 22.34% (to 26.61 lakh t).","Statement 4: Incorrect. Oilseeds are expected to rise 7.18% to 100.46 lakh tonnes."],"i":"Remember the pattern: cereals fall, pulses and oilseeds rise. Note the Review's phrasing: \"Advance Estimates\" for 2025-26 and \"Final\" for 2024-25.","s":"Chapter 1, p. 9; Table 1.3.","hq":["2024-25 (अंतिम) की तुलना में 2025-26 (अग्रिम अनुमान) में राजस्थान में फसल उत्पादन के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. कुल खाद्यान्न उत्पादन 283.98 लाख टन होने की संभावना है, जो 8.28 प्रतिशत की गिरावट है।","2. खरीफ खाद्यान्न उत्पादन में तेज़ गिरावट (21.61 प्रतिशत) और रबी खाद्यान्न उत्पादन में केवल मामूली गिरावट (0.49 प्रतिशत) अपेक्षित है।","3. दालों का उत्पादन खरीफ और रबी दोनों मौसमों में बढ़ने का अनुमान है।","4. कुल तिलहन उत्पादन में गिरावट अपेक्षित है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 1, 2 और 4","केवल 2, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 1 और 2: सही (खाद्यान्न 309.62 से 283.98; खरीफ 114.24 से 89.55; रबी 195.38 से 194.43 लाख टन)।","कथन 3: सही। खरीफ दालें 2.34% बढ़कर 20.52 लाख टन और रबी दालें 22.34% बढ़कर 26.61 लाख टन हो गई हैं।","कथन 4: गलत। तिलहन 7.18% बढ़कर 100.46 लाख टन होने की संभावना है।"],"hi":"पैटर्न याद रखें: अनाज घटते हैं, दालें और तिलहन बढ़ते हैं। समीक्षा की शब्दावली पर ध्यान दें: 2025-26 के लिए \"अग्रिम अनुमान\" और 2024-25 के लिए \"अंतिम\"।","hs":"अध्याय 1, पृ. 9; तालिका 1.3."},{"n":10,"t":"Incorrect statement","g":"RAS","ans":3,"q":["Which of the following statements about crop production estimates for 2025-26 (AE) is NOT correct?"],"o":["Kharif cereals production is expected to fall by 26.71 per cent.","Total oilseeds production is estimated at 100.46 lakh tonnes.","Cotton (lint) production is estimated at 17.94 lakh bales, up marginally by 0.34 per cent.","Sugarcane production is expected to increase compared with the previous year."],"e":["Sugarcane is estimated at 3.61 lakh tonnes against 4.65 lakh tonnes, a decrease of 22.37%. The other statements are correct.","Cotton production is measured in lakh bales, and each bale is 170 kg."],"i":"Rajasthan is not a major sugarcane state (area only 0.05 lakh ha). The Review's footnote on bale weight (170 kg) is a classic factual question.","s":"Chapter 1, pp. 9-10; Table 1.3.","hq":["2025-26 (अग्रिम अनुमान) के फसल उत्पादन अनुमानों के बारे में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["खरीफ अनाज उत्पादन में 26.71 प्रतिशत की गिरावट अपेक्षित है।","कुल तिलहन उत्पादन का अनुमान 100.46 लाख टन है।","कपास (रुई) का उत्पादन 17.94 लाख गाँठ अनुमानित है, जो 0.34 प्रतिशत की मामूली वृद्धि है।","पिछले वर्ष की तुलना में गन्ने का उत्पादन बढ़ने की संभावना है।"],"he":["गन्ना 4.65 लाख टन के मुकाबले 3.61 लाख टन अनुमानित है, यानी 22.37% की कमी। अन्य कथन सही हैं।","कपास का उत्पादन लाख गाँठ में मापा जाता है और प्रत्येक गाँठ 170 किग्रा की होती है।"],"hi":"राजस्थान प्रमुख गन्ना राज्य नहीं है (क्षेत्र केवल 0.05 लाख हेक्टेयर)। गाँठ के वज़न (170 किग्रा) वाली समीक्षा की पाद-टिप्पणी एक क्लासिक तथ्यात्मक प्रश्न है।","hs":"अध्याय 1, पृ. 9-10; तालिका 1.3."},{"n":11,"t":"Data / application","g":"UPSC","ans":2,"q":["Using Table 1.3 (2024-25, Final: foodgrains area 159.61 lakh hectares, production 309.62 lakh tonnes), the productivity of foodgrains in Rajasthan, in kg per hectare, is closest to:"],"o":["1,628","2,222","1,940","1,486"],"e":["Productivity = production ÷ area = 309.62 lakh t ÷ 159.61 lakh ha ≈ 1.94 t/ha = 1,940 kg/ha. This matches Table 1.4.","(a) 1,628 is the 2023-24 figure (240.93 ÷ 148.02). (d) 1,486 is the 2021-22 figure. (b) is a distractor."],"i":"Productivity is output per unit of area. Table 1.4 also shows pulses at 773 kg/ha and cereals at 2,537 kg/ha in 2024-25.","s":"Chapter 1, pp. 9-10; Tables 1.3 and 1.4.","hq":["तालिका 1.3 (2024-25, अंतिम: खाद्यान्न क्षेत्र 159.61 लाख हेक्टेयर, उत्पादन 309.62 लाख टन) का उपयोग करते हुए, राजस्थान में खाद्यान्न की उत्पादकता (किग्रा प्रति हेक्टेयर) लगभग कितनी है?"],"ho":["1,628","2,222","1,940","1,486"],"he":["उत्पादकता = उत्पादन ÷ क्षेत्र = 309.62 लाख टन ÷ 159.61 लाख हेक्टेयर ≈ 1.94 टन/हेक्टेयर = 1,940 किग्रा/हेक्टेयर। यह तालिका 1.4 से मेल खाता है।","(a) 1,628 वर्ष 2023-24 का आँकड़ा है (240.93 ÷ 148.02)। (d) 1,486 वर्ष 2021-22 का आँकड़ा है। (b) भ्रामक विकल्प है।"],"hi":"उत्पादकता प्रति इकाई क्षेत्र उत्पादन है। तालिका 1.4 में 2024-25 में दालें 773 किग्रा/हेक्टेयर और अनाज 2,537 किग्रा/हेक्टेयर भी दर्शाया गया है।","hs":"अध्याय 1, पृ. 9-10; तालिका 1.3 और 1.4."},{"n":12,"t":"Assertion and Reason","g":"UPSC","ans":0,"q":["Assertion (A): In 2025-26 (AE), Rajasthan's Agriculture and allied GVA at constant prices is estimated to grow by only 0.22 per cent, even though the crop sector is estimated to contract by 5.01 per cent.","Reason (R): The livestock sector (growth 5.20 per cent) and forestry and logging (2.67 per cent) offset much of the decline in crops."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["The overall growth of 0.22% and the sub-sector growth rates (crops −5.01%, livestock 5.20%, forestry 2.67%, fishing 0.87%) are all stated in the Review.","Positive growth in livestock and forestry pulls the aggregate close to zero despite the crop contraction."],"i":"The Review calls livestock an \"insulating factor\" against drought and famine in arid regions.","s":"Chapter 1, pp. 3-4, 19.","hq":["अभिकथन (A): 2025-26 (अग्रिम अनुमान) में राजस्थान के कृषि एवं संबद्ध GVA में स्थिर कीमतों पर केवल 0.22 प्रतिशत की वृद्धि अनुमानित है, जबकि फसल क्षेत्र में 5.01 प्रतिशत की गिरावट अनुमानित है।","कारण (R): पशुपालन क्षेत्र (वृद्धि 5.20 प्रतिशत) और वानिकी एवं लॉगिंग (2.67 प्रतिशत) फसलों की गिरावट की काफी हद तक भरपाई करते हैं।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["समग्र वृद्धि 0.22% और उप-क्षेत्रों की वृद्धि दरें (फसलें −5.01%, पशुपालन 5.20%, वानिकी 2.67%, मत्स्य पालन 0.87%) सभी समीक्षा में उल्लिखित हैं।","पशुपालन और वानिकी की सकारात्मक वृद्धि फसलों की गिरावट के बावजूद समग्र वृद्धि को शून्य के पास खींच लेती है।"],"hi":"समीक्षा पशुपालन को शुष्क क्षेत्रों में सूखे और अकाल के विरुद्ध एक \"रोधक कारक\" कहती है।","hs":"अध्याय 1, पृ. 3-4, 19."},{"n":13,"t":"Multi-statement","g":"RAS + UPSC","ans":3,"q":["Consider the following statements regarding Rajasthan's position in the production of major crops in 2023-24:","1. Rajasthan ranked first in Bajra, Rapeseed and Mustard, total oilseeds, coarse cereals and Guar.","2. Rajasthan contributed 88.80 per cent of the country's Guar production.","3. Rajasthan ranked second in Groundnut production.","4. Rajasthan ranked second in Gram production.","Which of the statements given above is/are correct?"],"o":["1 and 4 only","2, 3 and 4 only","1, 2, 3 and 4","1, 2 and 3 only"],"e":["Statements 1-3: Correct (Gujarat is first in groundnut).","Statement 4: Incorrect. In gram, Rajasthan is third, after Madhya Pradesh and Maharashtra. It is also third in total pulses and soyabean.","Other shares from Table 1.5: Rapeseed and Mustard 43.43%, Bajra 41.34%, total oilseeds 23.61%, coarse cereals 14.21%, Groundnut 19.91%, Gram 17.39%."],"i":"This table is the most predictable source of rank and percentage questions. Source cited in the Review: Agriculture Statistics at a Glance 2024 (DoA&FW, Government of India).","s":"Chapter 1, p. 10; Table 1.5.","hq":["2023-24 में प्रमुख फसलों के उत्पादन में राजस्थान की स्थिति के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राजस्थान बाजरा, रेपसीड एवं सरसों, कुल तिलहन, मोटे अनाज और ग्वार में प्रथम स्थान पर रहा।","2. राजस्थान ने देश के ग्वार उत्पादन में 88.80 प्रतिशत योगदान दिया।","3. राजस्थान मूँगफली उत्पादन में दूसरे स्थान पर रहा।","4. राजस्थान चना उत्पादन में दूसरे स्थान पर रहा।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 4","केवल 2, 3 और 4","1, 2, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 1-3: सही (मूँगफली में गुजरात प्रथम है)।","कथन 4: गलत। चने में राजस्थान मध्य प्रदेश और महाराष्ट्र के बाद तीसरे स्थान पर है। कुल दालों और सोयाबीन में भी यह तीसरे स्थान पर है।","तालिका 1.5 के अन्य हिस्से: रेपसीड एवं सरसों 43.43%, बाजरा 41.34%, कुल तिलहन 23.61%, मोटे अनाज 14.21%, मूँगफली 19.91%, चना 17.39%।"],"hi":"यह तालिका रैंक और प्रतिशत वाले प्रश्नों का सबसे संभावित स्रोत है। समीक्षा में उद्धृत स्रोत: कृषि सांख्यिकी एक नज़र में 2024 (कृषि एवं किसान कल्याण विभाग, भारत सरकार)।","hs":"अध्याय 1, पृ. 10; तालिका 1.5."},{"n":14,"t":"Multi-statement","g":"RAS","ans":0,"q":["Consider the following statements regarding seeds, soil health and organic inputs in Rajasthan:","1. Mukhyamantri Beej Swavalamban Yojana enables farmers to produce quality seeds on their own fields for their own use, covering varieties up to 10 years old.","2. Under this scheme, 1.12 lakh quintals of seed were distributed against a target of 1.13 lakh quintals in 2025-26.","3. Goverdhan Jaivik Uravark Yojana provides assistance up to ₹10,000 per farmer, to 50 farmers per block, to produce vermi-compost using cattle waste.","4. Seed minikits are distributed to farmers at subsidised prices.","Which of the statements given above is/are correct?"],"o":["1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 2, 3 and 4"],"e":["Statements 1-3: Correct. For Goverdhan Jaivik Uravark Yojana, 1.02 lakh online applications were received on the Rajkisan portal, with 54,940 administrative and 10,814 financial approvals up to December 2025.","Statement 4: Incorrect. Minikits (31.50 lakh in 2025-26) are distributed free of cost to popularise new varieties."],"i":"\"Free of cost\" versus \"subsidised\" is a frequent scheme trap.","s":"Chapter 1, p. 12; Table 1.7, p. 17.","hq":["राजस्थान में बीज, मृदा स्वास्थ्य और जैविक आदानों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. मुख्यमंत्री बीज स्वावलंबन योजना किसानों को अपने खेतों पर अपने उपयोग हेतु गुणवत्तापूर्ण बीज उत्पादन में सक्षम बनाती है, जिसमें 10 वर्ष तक पुरानी किस्में शामिल हैं।","2. इस योजना के अंतर्गत 2025-26 में 1.13 लाख क्विंटल के लक्ष्य के विरुद्ध 1.12 लाख क्विंटल बीज वितरित किया गया।","3. गोवर्धन जैविक उर्वरक योजना पशु अपशिष्ट से वर्मी-कम्पोस्ट बनाने के लिए प्रति ब्लॉक 50 किसानों को प्रति किसान ₹10,000 तक सहायता देती है।","4. बीज मिनीकिट किसानों को रियायती दरों पर वितरित किए जाते हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 3","केवल 2, 3 और 4","केवल 1 और 4","1, 2, 3 और 4"],"he":["कथन 1-3: सही। गोवर्धन जैविक उर्वरक योजना के लिए राजकिसान पोर्टल पर 1.02 लाख ऑनलाइन आवेदन प्राप्त हुए, और दिसंबर 2025 तक 54,940 प्रशासनिक तथा 10,814 वित्तीय स्वीकृतियाँ दी गईं।","कथन 4: गलत। मिनीकिट (2025-26 में 31.50 लाख) नई किस्मों को लोकप्रिय बनाने के लिए निःशुल्क वितरित किए जाते हैं।"],"hi":"\"निःशुल्क\" बनाम \"रियायती\" योजनाओं में बार-बार आने वाला जाल है।","hs":"अध्याय 1, पृ. 12; तालिका 1.7, पृ. 17."},{"n":15,"t":"Match the following","g":"RAS","ans":2,"q":["Match the initiative (List I) with its description (List II) and select the correct answer using the code below.","A. Namo Drone Didi Yojana","B. Agri Clinics","C. Goverdhan Jaivik Uravark Yojana","D. Pashu Sakhi and Krishi Sakhi","1. Assistance up to ₹10,000 for vermi-compost from cattle waste","2. Additional 3% interest subvention to women SHGs for 1,070 agricultural drones","3. SHG members working as Pashu Sakhi (37,369) and Krishi Sakhi (36,787)","4. Expert services for soil testing, crop information and pest/disease treatment at district headquarters"],"o":["A-4, B-2, C-1, D-3","A-2, B-1, C-4, D-3","A-2, B-4, C-1, D-3","A-3, B-4, C-2, D-1"],"e":["Namo Drone Didi: the additional 3% interest subvention is provided by the Government of India. Drones are used for spraying nano urea and pesticides.","Agri Clinics are being set up at all district headquarters: 20 in 2024-25 and 13 more under way in 2025-26.","Pashu Sakhi and Krishi Sakhi are Rajeevika (NRLM) SHG members."],"i":"Numbers like 1,070 (drones) and 3% (subvention) are favourite fact-picks. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 1: Transforming Agri-Food Systems","s":"Chapter 1, p. 12.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (पहल) का सूची II (विवरण) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. नमो ड्रोन दीदी योजना","B. कृषि क्लिनिक","C. गोवर्धन जैविक उर्वरक योजना","D. पशु सखी और कृषि सखी","1. पशु अपशिष्ट से वर्मी-कम्पोस्ट के लिए ₹10,000 तक सहायता","2. 1,070 कृषि ड्रोन के लिए महिला स्वयं सहायता समूहों को 3% अतिरिक्त ब्याज अनुदान","3. पशु सखी (37,369) और कृषि सखी (36,787) के रूप में कार्यरत SHG सदस्य","4. जिला मुख्यालयों पर मृदा परीक्षण, फसल जानकारी और कीट/रोग उपचार की विशेषज्ञ सेवाएँ"],"ho":["A-4, B-2, C-1, D-3","A-2, B-1, C-4, D-3","A-2, B-4, C-1, D-3","A-3, B-4, C-2, D-1"],"he":["नमो ड्रोन दीदी: 3% अतिरिक्त ब्याज अनुदान भारत सरकार द्वारा दिया जाता है। ड्रोन का उपयोग नैनो यूरिया और कीटनाशकों के छिड़काव में होता है।","कृषि क्लिनिक सभी जिला मुख्यालयों पर स्थापित किए जा रहे हैं: 2024-25 में 20 और 2025-26 में 13 और प्रगति पर।","पशु सखी और कृषि सखी राजीविका (NRLM) के SHG सदस्य हैं।"],"hi":"1,070 (ड्रोन) और 3% (ब्याज अनुदान) जैसी संख्याएँ पसंदीदा तथ्य-प्रश्न हैं।","hs":"अध्याय 1, पृ. 12."},{"n":16,"t":"Multi-statement","g":"RAS","ans":1,"q":["Consider the following statements regarding the cooperative credit structure of Rajasthan:","1. There are 42,858 registered cooperative societies, including 9,086 Primary Agricultural Credit Societies (PACS).","2. 29 Central Co-operative Banks provide short-term agricultural loans, while 36 Primary Land Development Banks provide long-term agricultural loans.","3. In 2025-26 (up to December), CCBs distributed short-term crop loans of ₹18,085.89 crore against a total target of ₹25,000 crore.","4. Long-term loans by Primary Land Development Banks in the same period exceeded their target.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","1, 2 and 3 only","3 and 4 only","1, 2, 3 and 4"],"e":["Statements 1-3: Correct as given in the Review.","Statement 4: Incorrect. Long-term loans were ₹95.13 crore against a target of ₹209 crore, well short of target.","Short-term crop loans reached about 30.45 lakh farmers."],"i":"The Review's \"up to December\" figures are part-year. Do not compare part-year achievements with full-year figures.","s":"Chapter 1, pp. 12-13.","hq":["राजस्थान की सहकारी ऋण संरचना के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. 42,858 पंजीकृत सहकारी समितियाँ हैं, जिनमें 9,086 प्राथमिक कृषि ऋण समितियाँ (PACS) शामिल हैं।","2. 29 केंद्रीय सहकारी बैंक अल्पकालिक कृषि ऋण देते हैं, जबकि 36 प्राथमिक भूमि विकास बैंक दीर्घकालिक कृषि ऋण देते हैं।","3. 2025-26 (दिसंबर तक) में CCB ने ₹25,000 करोड़ के कुल लक्ष्य के विरुद्ध ₹18,085.89 करोड़ के अल्पकालिक फसली ऋण वितरित किए।","4. इसी अवधि में प्राथमिक भूमि विकास बैंकों द्वारा दीर्घकालिक ऋण उनके लक्ष्य से अधिक रहे।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 1, 2 और 3","केवल 3 और 4","1, 2, 3 और 4"],"he":["कथन 1-3: सही, जैसा समीक्षा में दिया गया है।","कथन 4: गलत। दीर्घकालिक ऋण ₹209 करोड़ के लक्ष्य के विरुद्ध ₹95.13 करोड़ रहे, यानी लक्ष्य से काफ़ी कम।","अल्पकालिक फसली ऋण लगभग 30.45 लाख किसानों तक पहुँचे।"],"hi":"समीक्षा के \"दिसंबर तक\" के आँकड़े आंशिक वर्ष के हैं। आंशिक वर्ष की उपलब्धि की तुलना पूरे वर्ष के आँकड़ों से न करें।","hs":"अध्याय 1, पृ. 12-13."},{"n":17,"t":"Pairs (count correct)","g":"UPSC","ans":2,"q":["Consider the following pairs of schemes with their features, as described in the Economic Review. How many of the pairs are correctly matched?","1. Sahkar Kisan Kalyan Yojana: CCB loans up to ₹10 lakh for agriculture and allied purposes.","2. Agricultural Produce Pledge Loan Scheme: loans against pledged produce at 3 per cent interest.","3. Self-Employment Credit Card Scheme: loans up to ₹50,000 for non-agricultural activities with a five-year tenure.","4. Rajasthan Rural Livelihood Loan Scheme: loans restricted to large farmers for crop cultivation."],"o":["Only one","Only two","Only three","All four"],"e":["Pairs 1-3 are correct. The Self-Employment Credit Card Scheme is sponsored by the National Bank (NABARD).","Pair 4: Incorrect. The scheme serves rural artisans, families earning from non-agricultural activities and family members of small and marginal farmers, via cooperative banks. In 2025-26 (up to December), ₹122.04 crore was disbursed to 13,801 beneficiaries."],"i":"The count-the-correct-pairs format is a UPSC favourite. Check every pair independently.","s":"Chapter 1, p. 13.","hq":["निम्नलिखित योजनाओं और उनकी विशेषताओं के युग्मों पर विचार कीजिए, जैसा आर्थिक समीक्षा में वर्णित है। कितने युग्म सही सुमेलित हैं?","1. सहकार किसान कल्याण योजना: कृषि और संबद्ध उद्देश्यों के लिए CCB से ₹10 लाख तक का ऋण।","2. कृषि उपज गिरवी ऋण योजना: गिरवी रखी उपज पर 3 प्रतिशत ब्याज पर ऋण।","3. स्वरोजगार क्रेडिट कार्ड योजना: गैर-कृषि गतिविधियों के लिए पाँच वर्ष की अवधि के साथ ₹50,000 तक का ऋण।","4. राजस्थान ग्रामीण आजीविका ऋण योजना: फसल खेती के लिए केवल बड़े किसानों तक सीमित ऋण।"],"ho":["केवल एक","केवल दो","केवल तीन","सभी चार"],"he":["युग्म 1-3 सही हैं। स्वरोजगार क्रेडिट कार्ड योजना राष्ट्रीय बैंक (नाबार्ड) द्वारा प्रायोजित है।","युग्म 4: गलत। यह योजना सहकारी बैंकों के माध्यम से ग्रामीण कारीगरों, गैर-कृषि गतिविधियों से आय अर्जित करने वाले परिवारों और छोटे व सीमांत किसानों के परिवारजनों के लिए है। 2025-26 (दिसंबर तक) में 13,801 लाभार्थियों को ₹122.04 करोड़ वितरित किए गए।"],"hi":"सही युग्म गिनने वाला प्रारूप UPSC का पसंदीदा है। प्रत्येक युग्म को स्वतंत्र रूप से जाँचें।","hs":"अध्याय 1, पृ. 13."},{"n":18,"t":"Multi-statement","g":"UPSC","ans":3,"q":["Consider the following statements regarding the Agriculture Infrastructure Fund (AIF) as described in the Economic Review:","1. AIF of ₹1 lakh crore was announced on 15 May 2020 to create farm-gate infrastructure.","2. An interest subsidy of 3 per cent per annum is given on loans up to ₹5 crore.","3. AIF has been linked with PACS as Multi Service Centres (MSC).","4. As of 31 December 2025, 4,900 projects worth ₹4,212.54 crore were approved in Rajasthan, with ₹2,793.08 crore disbursed for 4,427 projects.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 3 only","1, 2, 3 and 4","1, 3 and 4 only"],"e":["Statement 2: Incorrect. The interest subsidy of 3% per annum applies to loans up to ₹2 crore, not ₹5 crore.","Statements 1, 3 and 4 are as stated in the Review. Note that the project count for disbursement (4,427) is lower than the approved count (4,900)."],"i":"Pay attention to the monetary ceiling (₹2 crore) and to the two different project counts.","s":"Chapter 1, p. 13.","hq":["आर्थिक समीक्षा में वर्णित कृषि अवसंरचना कोष (AIF) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. फार्म-गेट अवसंरचना के निर्माण हेतु ₹1 लाख करोड़ का AIF 15 मई 2020 को घोषित किया गया।","2. ₹5 करोड़ तक के ऋणों पर प्रति वर्ष 3 प्रतिशत ब्याज अनुदान दिया जाता है।","3. AIF को PACS से बहु-सेवा केंद्रों (MSC) के रूप में जोड़ा गया है।","4. 31 दिसंबर 2025 तक राजस्थान में ₹4,212.54 करोड़ की 4,900 परियोजनाएँ स्वीकृत की गईं, जिनमें 4,427 परियोजनाओं के लिए ₹2,793.08 करोड़ वितरित किए गए।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 3","1, 2, 3 और 4","केवल 1, 3 और 4"],"he":["कथन 2: गलत। प्रति वर्ष 3% का ब्याज अनुदान ₹2 करोड़ तक के ऋणों पर लागू है, ₹5 करोड़ पर नहीं।","कथन 1, 3 और 4 समीक्षा में उल्लिखित हैं। ध्यान दें कि वितरण वाली परियोजनाओं की संख्या (4,427) स्वीकृत संख्या (4,900) से कम है।"],"hi":"मौद्रिक सीमा (₹2 करोड़) और परियोजनाओं की दो अलग-अलग संख्याओं पर ध्यान दें।","hs":"अध्याय 1, पृ. 13."},{"n":19,"t":"Data-based","g":"RAS + UPSC","ans":1,"q":["Up to September 2025, 61.83 lakh Cooperative Kisan Credit Cards (KCCs) were issued in Rajasthan, of which 43.95 lakh were active. The share of active cards is approximately:"],"o":["61 per cent","71 per cent","81 per cent","51 per cent"],"e":["43.95 ÷ 61.83 ≈ 0.711, so about 71%."],"i":"Simple ratio questions test careful reading of \"issued\" versus \"active\".","s":"Chapter 1, p. 13.","hq":["सितंबर 2025 तक राजस्थान में 61.83 लाख सहकारी किसान क्रेडिट कार्ड (KCC) जारी किए गए, जिनमें से 43.95 लाख सक्रिय थे। सक्रिय कार्डों का हिस्सा लगभग कितना है?"],"ho":["61 प्रतिशत","71 प्रतिशत","81 प्रतिशत","51 प्रतिशत"],"he":["43.95 ÷ 61.83 ≈ 0.711, यानी लगभग 71%।"],"hi":"सरल अनुपात वाले प्रश्न \"जारी\" बनाम \"सक्रिय\" को ध्यान से पढ़ने की परीक्षा लेते हैं।","hs":"अध्याय 1, पृ. 13."},{"n":20,"t":"Direct factual","g":"RAS + UPSC","ans":0,"q":["Under the Pradhan Mantri Fasal Bima Yojana (PMFBY), which of the following correctly gives the farmer premium rates for Kharif crops, Rabi crops and commercial/horticultural crops respectively, as per the Economic Review?"],"o":["2 per cent, 1.5 per cent and 5 per cent","1.5 per cent, 2 per cent and 5 per cent","2 per cent, 1.5 per cent and 3 per cent","1.5 per cent, 1.5 per cent and 5 per cent"],"e":["PMFBY has been implemented since Kharif 2016. Farmer premiums are 2% (Kharif), 1.5% (Rabi) and 5% (commercial/horticultural crops).","A State-funded scheme operates for premium subsidy and for incentives to primary workers conducting crop cutting experiments.","Claims of about ₹6,206.61 crore were disbursed from 15 December 2023 to 31 December 2025."],"i":"The Kharif/Rabi order is the standard swap trap. The claim figure is tied to a specific reference period, so quote the dates.","s":"Chapter 1, p. 14.","hq":["प्रधानमंत्री फसल बीमा योजना (PMFBY) के अंतर्गत, आर्थिक समीक्षा के अनुसार खरीफ फसलों, रबी फसलों और वाणिज्यिक/बागवानी फसलों के लिए किसान प्रीमियम दरें क्रमशः क्या हैं?"],"ho":["2 प्रतिशत, 1.5 प्रतिशत और 5 प्रतिशत","1.5 प्रतिशत, 2 प्रतिशत और 5 प्रतिशत","2 प्रतिशत, 1.5 प्रतिशत और 3 प्रतिशत","1.5 प्रतिशत, 1.5 प्रतिशत और 5 प्रतिशत"],"he":["PMFBY खरीफ 2016 से लागू है। किसान प्रीमियम 2% (खरीफ), 1.5% (रबी) और 5% (वाणिज्यिक/बागवानी फसलें) है।","प्रीमियम सब्सिडी तथा फसल कटाई प्रयोग करने वाले प्राथमिक कार्यकर्ताओं के प्रोत्साहन के लिए एक राज्य-वित्तपोषित योजना संचालित है।","15 दिसंबर 2023 से 31 दिसंबर 2025 के बीच लगभग ₹6,206.61 करोड़ के दावों का वितरण किया गया।"],"hi":"खरीफ/रबी का क्रम मानक अदला-बदली का जाल है। दावों का आँकड़ा एक विशिष्ट संदर्भ अवधि से जुड़ा है, इसलिए तिथियाँ उद्धृत करें।","hs":"अध्याय 1, पृ. 14."},{"n":21,"t":"Multi-statement","g":"RAS","ans":2,"q":["Consider the following statements regarding the Rajasthan State Warehousing Corporation (RSWC):","1. Rajasthan State Warehousing Corporation is the nodal agency that develops and manages warehouses for scientific storage of agricultural commodities.","2. It has 97 warehouses in 36 districts with a total storage capacity of 17.25 lakh metric tonnes (up to December 2025).","3. Storage charge rebates are 70 per cent for SC/ST farmers, 60 per cent for farmer producer organisations, 30 per cent for general farmers and 10 per cent for cooperative societies.","4. The average utilisation of RSWC warehouses was highest in 2022-23.","Which of the statements given above is/are correct?"],"o":["1 and 4 only","2, 3 and 4 only","1, 2 and 3 only","1, 2, 3 and 4"],"e":["Statements 1-3: Correct. RSWC is the nodal agency; it runs 97 warehouses in 36 districts (17.25 lakh MT up to December 2025). The Review calls the rebate structure the highest among all State Warehousing Corporations and the Central Warehousing Corporation.","Statement 4: Incorrect. Utilisation was lowest in 2022-23 (38%) and highest in 2021-22 (70%). It has since recovered: 44% (2023-24), 47% (2024-25) and 48% (2025-26, up to December)."],"i":"Table 1.8 is a natural source for trend questions. The sharp drop from 70% to 38% while capacity rose (14.71 to 15.98 lakh MT) shows that utilisation depends on stock inflow, not just capacity.","s":"Chapter 1, pp. 17-18; Table 1.8.","hq":["राजस्थान राज्य भंडारण निगम (RSWC) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राजस्थान राज्य भंडारण निगम कृषि जिंसों के वैज्ञानिक भंडारण हेतु गोदामों का विकास और प्रबंधन करने वाली नोडल एजेंसी है।","2. इसके 36 जिलों में 97 गोदाम हैं, जिनकी कुल भंडारण क्षमता 17.25 लाख मीट्रिक टन है (दिसंबर 2025 तक)।","3. भंडारण शुल्क में छूट SC/ST किसानों के लिए 70 प्रतिशत, किसान उत्पादक संगठनों के लिए 60 प्रतिशत, सामान्य किसानों के लिए 30 प्रतिशत और सहकारी समितियों के लिए 10 प्रतिशत है।","4. RSWC गोदामों का औसत उपयोग 2022-23 में सर्वाधिक था।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 4","केवल 2, 3 और 4","केवल 1, 2 और 3","1, 2, 3 और 4"],"he":["कथन 1-3: सही। RSWC नोडल एजेंसी है; यह 36 जिलों में 97 गोदाम चलाता है (दिसंबर 2025 तक 17.25 लाख मीट्रिक टन)। समीक्षा इस छूट संरचना को सभी राज्य भंडारण निगमों और केंद्रीय भंडारण निगम में सर्वोच्च बताती है।","कथन 4: गलत। उपयोग 2022-23 में सबसे कम (38%) और 2021-22 में सबसे अधिक (70%) था। तब से यह सुधरा है: 44% (2023-24), 47% (2024-25) और 48% (2025-26, दिसंबर तक)।"],"hi":"तालिका 1.8 प्रवृत्ति वाले प्रश्नों का स्वाभाविक स्रोत है। क्षमता बढ़ने (14.71 से 15.98 लाख मीट्रिक टन) के बावजूद उपयोग का 70% से 38% पर गिरना दर्शाता है कि उपयोग केवल क्षमता पर नहीं, माल की आवक पर निर्भर करता है।","hs":"अध्याय 1, पृ. 17-18; तालिका 1.8."},{"n":22,"t":"Multi-statement","g":"RAS + UPSC","ans":1,"q":["Consider the following statements regarding the PM Formalisation of Micro Food Processing Enterprises (PM-FME) scheme in Rajasthan:","1. The scheme is operated by the Ministry of Food Processing, Government of India, with the grant borne by the Centre and State in the ratio 60:40.","2. It provides a maximum grant of ₹10 lakh at the rate of 35 per cent for individual category applicants.","3. The grant is adjusted in the loan account after a lock-in period of 5 years.","4. The scheme was proposed for 2020-21 to 2024-25 and has been extended up to 2025-26.","Which of the statements given above is/are correct?"],"o":["1 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The grant is adjusted in the loan account after a 3-year lock-in period, not 5.","Statements 1, 2 and 4: Correct. The grant is shared 60:40 by Centre and State. The maximum is ₹10 lakh at 35% for individual applicants.","In 2025-26 (up to December), 2,048 individual applications were received, 1,518 approved and submitted to banks, and 414 sanctioned with a subsidy of ₹23.54 crore. 8 incubation centres across 8 districts were approved with ₹23.11 crore."],"i":"Food processing links agriculture to the \"agri-food system\" theme. Funding ratios (60:40) and the lock-in period are common fact-picks.","s":"Chapter 1, p. 18.","hq":["राजस्थान में प्रधानमंत्री सूक्ष्म खाद्य प्रसंस्करण उद्यम औपचारिकरण (PM-FME) योजना के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. यह योजना भारत सरकार के खाद्य प्रसंस्करण मंत्रालय द्वारा संचालित है, जिसमें अनुदान का भार केंद्र और राज्य 60:40 के अनुपात में वहन करते हैं।","2. व्यक्तिगत श्रेणी के आवेदकों के लिए यह 35 प्रतिशत की दर से अधिकतम ₹10 लाख का अनुदान देती है।","3. अनुदान 5 वर्ष की लॉक-इन अवधि के बाद ऋण खाते में समायोजित किया जाता है।","4. योजना 2020-21 से 2024-25 के लिए प्रस्तावित थी और 2025-26 तक बढ़ा दी गई है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 3","केवल 1, 2 और 4","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 3: गलत। अनुदान 5 वर्ष नहीं, बल्कि 3 वर्ष की लॉक-इन अवधि के बाद ऋण खाते में समायोजित होता है।","कथन 1, 2 और 4: सही। अनुदान केंद्र और राज्य के बीच 60:40 में बँटा है। व्यक्तिगत आवेदकों के लिए अधिकतम ₹10 लाख 35% की दर से है।","2025-26 (दिसंबर तक) में 2,048 व्यक्तिगत आवेदन प्राप्त हुए, 1,518 स्वीकृत होकर बैंकों को भेजे गए और 414 को ₹23.54 करोड़ की सब्सिडी के साथ स्वीकृति मिली। 8 जिलों में 8 इन्क्यूबेशन केंद्र ₹23.11 करोड़ से स्वीकृत किए गए।"],"hi":"खाद्य प्रसंस्करण कृषि को \"कृषि-खाद्य प्रणाली\" विषय से जोड़ता है। वित्तपोषण अनुपात (60:40) और लॉक-इन अवधि सामान्य तथ्य-प्रश्न हैं।","hs":"अध्याय 1, पृ. 18."},{"n":23,"t":"Match the following","g":"RAS","ans":3,"q":["Match the agricultural marketing initiative (List I) with the correct description (List II) and select the correct answer using the code below.","A. Krishak Uphar Yojana","B. Raj Spice App","C. CONFED","D. National Cooperative Spice Fair 2025","1. Apex institution in the consumer cooperative sector","2. Coupon of ₹10,000 value on sale of produce through e-NAM","3. Launched at Rajasthan Masala Conclave 2025 by the Rajasthan State Agricultural Marketing Board","4. Organised at Jawahar Kala Kendra, Jaipur, 9-18 May 2025"],"o":["A-2, B-4, C-1, D-3","A-1, B-3, C-2, D-4","A-4, B-3, C-1, D-2","A-2, B-3, C-1, D-4"],"e":["Krishak Uphar Yojana works through the e-NAM portal: a ₹10,000 coupon and further coupons at multiples of that sale value. In 2025-26 (up to December), prizes worth ₹1.38 crore were distributed through 798 lotteries.","Raj Spice App was launched by the Chief Minister at the Rajasthan Masala Conclave 2025 (8 September 2025, Birla Auditorium, Jaipur). Around 4,000 traders had registered.","CONFED is the apex institution in the consumer cooperative sector (38 wholesale bhandars, 33 working at district level).","National Cooperative Spice Fair 2025 ran from 9 to 18 May 2025 at Jawahar Kala Kendra, Jaipur."],"i":"Event, venue and date combinations (Jawahar Kala Kendra, Birla Auditorium) are favourite Rajasthan GK crossovers.","s":"Chapter 1, p. 19.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (कृषि विपणन पहल) का सूची II (सही विवरण) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. कृषक उपहार योजना","B. राज स्पाइस ऐप","C. कॉन्फेड (CONFED)","D. राष्ट्रीय सहकारी मसाला मेला 2025","1. उपभोक्ता सहकारी क्षेत्र की शीर्ष संस्था","2. e-NAM के माध्यम से उपज की बिक्री पर ₹10,000 मूल्य का कूपन","3. राजस्थान राज्य कृषि विपणन बोर्ड द्वारा राजस्थान मसाला कॉन्क्लेव 2025 में शुरू किया गया","4. जवाहर कला केंद्र, जयपुर में 9-18 मई 2025 को आयोजित"],"ho":["A-2, B-4, C-1, D-3","A-1, B-3, C-2, D-4","A-4, B-3, C-1, D-2","A-2, B-3, C-1, D-4"],"he":["कृषक उपहार योजना e-NAM पोर्टल के माध्यम से चलती है: ₹10,000 का कूपन और बिक्री मूल्य के गुणकों पर अतिरिक्त कूपन। 2025-26 (दिसंबर तक) में 798 लॉटरियों के माध्यम से ₹1.38 करोड़ के पुरस्कार वितरित किए गए।","राज स्पाइस ऐप मुख्यमंत्री द्वारा राजस्थान मसाला कॉन्क्लेव 2025 (8 सितंबर 2025, बिड़ला सभागार, जयपुर) में शुरू किया गया। लगभग 4,000 व्यापारी पंजीकृत हुए।","कॉन्फेड उपभोक्ता सहकारी क्षेत्र की शीर्ष संस्था है (38 थोक भंडार, जिनमें 33 जिला स्तर पर कार्यरत)।","राष्ट्रीय सहकारी मसाला मेला 2025 जवाहर कला केंद्र, जयपुर में 9 से 18 मई 2025 तक चला।"],"hi":"आयोजन, स्थल और तिथि के संयोजन (जवाहर कला केंद्र, बिड़ला सभागार) राजस्थान GK के पसंदीदा क्रॉसओवर हैं।","hs":"अध्याय 1, पृ. 19."},{"n":24,"t":"Multi-statement","g":"UPSC","ans":3,"q":["Consider the following statements regarding horticulture and related schemes in Rajasthan, 2025-26:","1. The National Horticulture Mission is implemented in 41 districts with a budget estimate of ₹124.76 crore, of which ₹74.86 crore is the Central share.","2. The Central and State shares under NHM follow a 60:40 pattern.","3. The National Bamboo Mission is a fully launched scheme with nurseries already established across the State.","4. RKVY includes date palm cultivation and strengthens centres of excellence at places such as Jhalawar, Dholpur and Nanta (Kota).","Which of the statements given above is/are correct?"],"o":["1 and 3 only","2 and 3 only","3 and 4 only","1, 2 and 4 only"],"e":["Statement 1: Correct. NHM operates in 41 districts with a budget estimate of ₹124.76 crore (₹74.86 crore Central, ₹49.90 crore State).","Statement 2: Correct (computed): 74.86 ÷ 124.76 = 60%, so the pattern is 60:40.","Statement 3: Incorrect. The Review says the National Bamboo Mission is a Centrally Sponsored Scheme that is yet to be launched. The Centre approved an Annual Action Plan of ₹93.28 lakh and ₹100 lakh is provided in 2025-26.","Statement 4: Correct. RKVY covers date palm cultivation, vegetable clusters in urban areas and centres of excellence at Jhalawar, Dholpur, Tonk, Bundi, Chittorgarh, Sawai Madhopur, Bassi (Jaipur) and Nanta (Kota)."],"i":"Watch for \"yet to be launched\" versus \"launched\". The Review also gives horticulture's total State-plan estimate (₹1,918.67 crore) against ₹523.13 crore utilised up to December 2025.","s":"Chapter 1, p. 14.","hq":["2025-26 में राजस्थान में बागवानी और संबंधित योजनाओं के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राष्ट्रीय बागवानी मिशन 41 जिलों में ₹124.76 करोड़ के बजट अनुमान के साथ लागू है, जिसमें ₹74.86 करोड़ केंद्रीय हिस्सा है।","2. NHM के अंतर्गत केंद्र और राज्य का हिस्सा 60:40 के पैटर्न पर है।","3. राष्ट्रीय बाँस मिशन पूर्ण रूप से शुरू हो चुकी योजना है, जिसकी नर्सरियाँ राज्य भर में पहले ही स्थापित हो चुकी हैं।","4. RKVY में खजूर की खेती शामिल है और यह झालावाड़, धौलपुर तथा नाँता (कोटा) जैसे स्थानों पर उत्कृष्टता केंद्रों को मज़बूत करती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 3","केवल 2 और 3","केवल 3 और 4","केवल 1, 2 और 4"],"he":["कथन 1: सही। NHM 41 जिलों में ₹124.76 करोड़ के बजट अनुमान के साथ संचालित है (₹74.86 करोड़ केंद्र, ₹49.90 करोड़ राज्य)।","कथन 2: सही (गणना): 74.86 ÷ 124.76 = 60%, अतः पैटर्न 60:40 है।","कथन 3: गलत। समीक्षा के अनुसार राष्ट्रीय बाँस मिशन एक केंद्र प्रायोजित योजना है जो अभी शुरू होनी है। केंद्र ने ₹93.28 लाख की वार्षिक कार्य योजना स्वीकृत की और 2025-26 में ₹100 लाख का प्रावधान है।","कथन 4: सही। RKVY में खजूर की खेती, शहरी क्षेत्रों में सब्ज़ी क्लस्टर और झालावाड़, धौलपुर, टोंक, बूंदी, चित्तौड़गढ़, सवाई माधोपुर, बस्सी (जयपुर) तथा नाँता (कोटा) में उत्कृष्टता केंद्र शामिल हैं।"],"hi":"\"अभी शुरू होनी है\" बनाम \"शुरू हो चुकी\" पर ध्यान दें। समीक्षा बागवानी के लिए कुल राज्य-योजना अनुमान (₹1,918.67 करोड़) और दिसंबर 2025 तक व्यय (₹523.13 करोड़) भी देती है।","hs":"अध्याय 1, पृ. 14."},{"n":25,"t":"Multi-statement","g":"UPSC","ans":1,"q":["Consider the following statements regarding the National Food Security and Nutrition Mission (NFSNM) and pulses in Rajasthan:","1. NFSNM was launched in the State as a Centrally Sponsored Scheme from Rabi 2007-08.","2. From Rabi 2025-26, the Government of India merged NFSNM for Pulses into the \"Mission for Aatmanirbharta in Pulses\".","3. The new mission covers 2025-26 to 2030-31 and focuses on tur, urad and masoor, with 100 per cent procurement by NCCF and NAFED.","4. Maize and barley are included in the Nutri-cereals (Shri Anna) category under NFSNM.","Which of the statements given above is/are correct?"],"o":["1, 2 and 4 only","1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 4: Incorrect. Under NFSNM, maize and barley are coarse cereals (from 2018-19), while bajra and sorghum are Nutri-cereals (Shri Anna).","Statements 1-3: Correct. The pulses component was merged into the new mission from Rabi 2025-26. The mission seeks to raise tur, urad and masoor output, with 100% procurement by NCCF and NAFED, and other pulses procured under PSS norms through PM-AASHA."],"i":"Which grain falls in which NFSNM category is a classic classification trap.","s":"Chapter 1, p. 15.","hq":["राजस्थान में राष्ट्रीय खाद्य सुरक्षा एवं पोषण मिशन (NFSNM) और दालों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. NFSNM राज्य में रबी 2007-08 से केंद्र प्रायोजित योजना के रूप में शुरू किया गया।","2. रबी 2025-26 से भारत सरकार ने दालों हेतु NFSNM को \"दलहन में आत्मनिर्भरता मिशन\" में मिला दिया।","3. नया मिशन 2025-26 से 2030-31 तक के लिए है और तुअर, उड़द तथा मसूर पर केंद्रित है, जिसमें NCCF और NAFED द्वारा 100 प्रतिशत खरीद की जाती है।","4. NFSNM के अंतर्गत मक्का और जौ पोषक अनाज (श्री अन्न) श्रेणी में शामिल हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 4","केवल 1, 2 और 3","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 4: गलत। NFSNM के अंतर्गत मक्का और जौ मोटे अनाज (2018-19 से) हैं, जबकि बाजरा और ज्वार पोषक अनाज (श्री अन्न) हैं।","कथन 1-3: सही। दलहन घटक रबी 2025-26 से नए मिशन में मिला दिया गया। मिशन तुअर, उड़द और मसूर का उत्पादन बढ़ाने पर केंद्रित है, जिसमें NCCF और NAFED द्वारा 100% खरीद होती है, तथा अन्य दालें PM-AASHA के माध्यम से PSS मानदंडों पर खरीदी जाती हैं।"],"hi":"NFSNM की किस श्रेणी में कौन-सा अनाज आता है, यह क्लासिक वर्गीकरण जाल है।","hs":"अध्याय 1, पृ. 15."},{"n":26,"t":"Incorrect statement","g":"RAS","ans":2,"q":["Which of the following statements regarding agricultural missions in Rajasthan is NOT correct?"],"o":["The funding pattern of the National Mission on Edible Oil-Oilseed is GoI:GoR :: 60:40.","Purchase of breeder seed under the National Mission on Edible Oil-Oilseed gets 100 per cent central assistance.","All 2,000 clusters under the National Mission on Natural Farming are formed under Central share, covering 2.50 lakh farmers.","Paramparagat Krishi Vikas Yojana promotes organic farming through a cluster approach and PGS-India certification."],"e":["Of the 2,000 NMNF clusters, 1,800 are Central and 200 are State. The mission was launched in 2025-26 and covers 2.50 lakh farmers and 1 lakh hectares.","(a), (b) and (d) are as stated in the Review. Expenditure up to December 2025: oilseed mission ₹105.73 crore against ₹125 crore; PKVY only ₹4.20 crore against ₹42.07 crore."],"i":"NMNF is a 2025-26 launch, so it is a likely \"current\" question. Learn the 1,800/200 split.","s":"Chapter 1, p. 16.","hq":["राजस्थान में कृषि मिशनों के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["राष्ट्रीय खाद्य तेल-तिलहन मिशन का वित्तपोषण पैटर्न भारत सरकार:राजस्थान सरकार :: 60:40 है।","राष्ट्रीय खाद्य तेल-तिलहन मिशन के अंतर्गत प्रजनक बीज की खरीद पर 100 प्रतिशत केंद्रीय सहायता मिलती है।","राष्ट्रीय प्राकृतिक खेती मिशन के अंतर्गत सभी 2,000 क्लस्टर केंद्रीय हिस्से से बनाए गए हैं, जिनमें 2.50 लाख किसान शामिल हैं।","परंपरागत कृषि विकास योजना क्लस्टर दृष्टिकोण और PGS-India प्रमाणन के माध्यम से जैविक खेती को बढ़ावा देती है।"],"he":["NMNF के 2,000 क्लस्टरों में से 1,800 केंद्रीय और 200 राज्य के हैं। मिशन 2025-26 में शुरू हुआ और इसमें 2.50 लाख किसान तथा 1 लाख हेक्टेयर शामिल हैं।","(a), (b) और (d) समीक्षा के अनुसार हैं। दिसंबर 2025 तक व्यय: तिलहन मिशन ₹125 करोड़ के विरुद्ध ₹105.73 करोड़; PKVY केवल ₹42.07 करोड़ के विरुद्ध ₹4.20 करोड़।"],"hi":"NMNF 2025-26 की शुरुआत है, इसलिए यह \"समसामयिक\" प्रश्न बन सकता है। 1,800/200 का विभाजन याद करें।","hs":"अध्याय 1, पृ. 16."},{"n":27,"t":"Multi-statement","g":"UPSC","ans":2,"q":["Consider the following statements regarding the Pradhan Mantri Dhan-Dhanya Krishi Yojana (PMDDKY):","1. The scheme is to be implemented for a period of six years starting 2025-26.","2. It integrates key schemes from 11 ministries and departments.","3. It targets the overall agricultural development of the country's 100 Aspirational Agricultural Districts.","4. The districts selected from Rajasthan include Barmer, Jaisalmer, Pali and Kota.","Which of the statements given above is/are correct?"],"o":["1, 3 and 4 only","2 and 4 only","1, 2 and 3 only","1, 2, 3 and 4"],"e":["Statement 4: Incorrect. The eight districts selected from Rajasthan are Barmer, Jaisalmer, Pali, Nagaur, Jodhpur, Bikaner, Churu and Jalore. Kota is not among them.","Statements 1-3: Correct. It was announced for 2025-26, runs for six years, integrates key schemes from 11 ministries and departments, and targets 100 Aspirational Agricultural Districts."],"i":"The selected districts are mostly in the arid and semi-arid west. This is a typical UPSC \"scheme design\" question.","s":"Chapter 1, p. 16.","hq":["प्रधानमंत्री धन-धान्य कृषि योजना (PMDDKY) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. यह योजना 2025-26 से शुरू होकर छह वर्ष की अवधि के लिए लागू की जाएगी।","2. यह 11 मंत्रालयों और विभागों की प्रमुख योजनाओं को एकीकृत करती है।","3. यह देश के 100 आकांक्षी कृषि जिलों के समग्र कृषि विकास को लक्षित करती है।","4. राजस्थान से चयनित जिलों में बाड़मेर, जैसलमेर, पाली और कोटा शामिल हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 3 और 4","केवल 2 और 4","केवल 1, 2 और 3","1, 2, 3 और 4"],"he":["कथन 4: गलत। राजस्थान से चयनित आठ जिले बाड़मेर, जैसलमेर, पाली, नागौर, जोधपुर, बीकानेर, चूरू और जालोर हैं। कोटा इनमें नहीं है।","कथन 1-3: सही। इसे 2025-26 के लिए घोषित किया गया, यह छह वर्ष चलेगी, 11 मंत्रालयों और विभागों की प्रमुख योजनाओं को एकीकृत करती है तथा 100 आकांक्षी कृषि जिलों को लक्षित करती है।"],"hi":"चयनित जिले अधिकांशतः शुष्क और अर्ध-शुष्क पश्चिमी भाग में हैं। यह UPSC का विशिष्ट \"योजना डिज़ाइन\" प्रश्न है।","hs":"अध्याय 1, पृ. 16."},{"n":28,"t":"Multi-statement","g":"RAS + UPSC","ans":0,"q":["Consider the following statements regarding livestock in Rajasthan:","1. According to the Livestock Census 2019, Rajasthan has 568.01 lakh livestock, about 10.60 per cent of the country's livestock.","2. Rajasthan accounts for 84.43 per cent of the country's camels.","3. In 2023-24, Rajasthan contributed 47.53 per cent of the country's milk and 14.51 per cent of its wool.","4. Among the species listed in the Review, Rajasthan's national share is the highest for camels.","Which of the statements given above is/are correct?"],"o":["1, 2 and 4 only","1 and 3 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The shares are reversed: Rajasthan contributed 14.51% of milk and 47.53% of wool.","Statements 1, 2 and 4: Correct. Livestock Census 2019: 568.01 lakh animals and 146.23 lakh poultry birds. Species shares: cattle 7.24%, buffaloes 12.47%, goats 14.00%, sheep 10.64% and camels 84.43%."],"i":"\"Highest share\" questions on camel (84.43%) and wool (47.53%) are recurring. Note the large wool share (47.53%) versus the milk share (14.51%).","s":"Chapter 1, p. 20.","hq":["राजस्थान में पशुधन के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. पशुधन गणना 2019 के अनुसार राजस्थान में 568.01 लाख पशुधन है, जो देश के पशुधन का लगभग 10.60 प्रतिशत है।","2. राजस्थान देश के 84.43 प्रतिशत ऊँटों का हिस्सेदार है।","3. 2023-24 में राजस्थान ने देश के दूध में 47.53 प्रतिशत और ऊन में 14.51 प्रतिशत का योगदान दिया।","4. समीक्षा में सूचीबद्ध प्रजातियों में राजस्थान का राष्ट्रीय हिस्सा ऊँटों में सर्वाधिक है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 4","केवल 1 और 3","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 3: गलत। हिस्से उलटे हैं: राजस्थान ने दूध में 14.51% और ऊन में 47.53% का योगदान दिया।","कथन 1, 2 और 4: सही। पशुधन गणना 2019: 568.01 लाख पशु और 146.23 लाख मुर्गी-पक्षी। प्रजातिवार हिस्से: गाय-बैल 7.24%, भैंस 12.47%, बकरी 14.00%, भेड़ 10.64% और ऊँट 84.43%।"],"hi":"ऊँट (84.43%) और ऊन (47.53%) पर \"सर्वाधिक हिस्से\" वाले प्रश्न बार-बार आते हैं। ऊन के बड़े हिस्से (47.53%) बनाम दूध के हिस्से (14.51%) पर ध्यान दें।","hs":"अध्याय 1, पृ. 20."},{"n":29,"t":"Match the following","g":"RAS","ans":0,"q":["Match the livestock initiative (List I) with its feature (List II) and select the correct answer using the code below.","A. 1962 Call Centre mobile veterinary service","B. Camel Conservation and Development Mission","C. Livestock Free Health Scheme","D. FMD prevention programme (5th phase)","1. Free medicines raised from 138 to 200","2. Doorstep service modelled on Medical Emergency Service 108","3. Support for newborn camel calves (todies)","4. Free vaccination of 1.86 crore cattle and buffalo"],"o":["A-2, B-3, C-1, D-4","A-3, B-2, C-1, D-4","A-2, B-1, C-3, D-4","A-4, B-3, C-1, D-2"],"e":["1962 Call Centre: 536 mobile veterinary vehicles, modelled on Medical Emergency Service 108. In 2025-26, more than 15.30 lakh owners benefited with 59.82 lakh animals treated.","Camel Conservation and Development Mission: 25,364 newborn todies supported with ₹17 crore, benefiting 9,379 rearers.","Livestock Free Health Scheme: free medicines increased from 138 to 200.","FMD prevention (5th phase): 1.86 crore cattle and buffalo vaccinated free. In 2025-26, 108.30 lakh cattle were also vaccinated against Lumpy Skin Disease."],"i":"The 1962 mobile veterinary service is a good \"recent initiatives\" pick. Pair the number (1962) with the model (108).","s":"Chapter 1, p. 21.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (पशुधन पहल) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. 1962 कॉल सेंटर मोबाइल पशु चिकित्सा सेवा","B. ऊँट संरक्षण एवं विकास मिशन","C. पशुधन निःशुल्क स्वास्थ्य योजना","D. खुरपका-मुँहपका रोग (FMD) रोकथाम कार्यक्रम (5वाँ चरण)","1. निःशुल्क दवाइयाँ 138 से बढ़ाकर 200","2. चिकित्सा आपातकालीन सेवा 108 की तर्ज़ पर घर-द्वार सेवा","3. नवजात ऊँट बच्चों (टोडियों) के लिए सहायता","4. 1.86 करोड़ गोवंश और भैंसों का निःशुल्क टीकाकरण"],"ho":["A-2, B-3, C-1, D-4","A-3, B-2, C-1, D-4","A-2, B-1, C-3, D-4","A-4, B-3, C-1, D-2"],"he":["1962 कॉल सेंटर: 536 मोबाइल पशु चिकित्सा वाहन, जो चिकित्सा आपातकालीन सेवा 108 की तर्ज़ पर हैं। 2025-26 में 15.30 लाख से अधिक पशुपालक लाभान्वित हुए और 59.82 लाख पशुओं का उपचार हुआ।","ऊँट संरक्षण एवं विकास मिशन: ₹17 करोड़ से 25,364 नवजात टोडियों को सहायता, जिससे 9,379 पालकों को लाभ हुआ।","पशुधन निःशुल्क स्वास्थ्य योजना: निःशुल्क दवाइयाँ 138 से बढ़ाकर 200 की गईं।","FMD रोकथाम (5वाँ चरण): 1.86 करोड़ गोवंश और भैंसों का निःशुल्क टीकाकरण। 2025-26 में 108.30 लाख गोवंश को लम्पी स्किन डिजीज़ के विरुद्ध भी टीका लगाया गया।"],"hi":"1962 मोबाइल पशु चिकित्सा सेवा \"हाल की पहलों\" का अच्छा प्रश्न है। संख्या (1962) को मॉडल (108) से जोड़कर याद करें।","hs":"अध्याय 1, पृ. 21."},{"n":30,"t":"Multi-statement","g":"RAS","ans":1,"q":["Consider the following statements regarding livestock and milk-producer insurance schemes in Rajasthan:","1. Under the Mukhyamantri Mangala Pashu Bima Yojana, the State bears 100 per cent of the premium for indigenous livestock from 1 December 2025, targeting 42 lakh animals in 2025-26.","2. Raj Saras Suraksha Kavach Bima Yojana pays ₹5 lakh for partial permanent disability.","3. Under the Saras Samuhik Arogya Bima scheme, 33,516 milk producers were insured up to December 2025 (19th phase).","4. The Mangala Pashu Bima Yojana covers only exotic breeds of cattle.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","1 and 3 only","2 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Correct. From 1 December 2025, free insurance for indigenous livestock (cow, buffalo, sheep, goat, camel) is covered with 100% of the premium borne by the State. The target is 42 lakh animals in 2025-26.","Statement 2: Incorrect. Raj Saras Suraksha Kavach Bima Yojana (9th phase, 1 Feb 2025 to 31 Jan 2026) pays ₹5 lakh for accidental death or total permanent disability and ₹2.50 lakh for partial permanent disability. 1,12,176 milk producers were insured up to December 2025.","Statement 3: Correct. 33,516 milk producers were insured up to December 2025 (19th phase).","Statement 4: Incorrect. It covers indigenous livestock, not only exotic breeds."],"i":"Separate the insurance schemes mentally: livestock insurance (Mangala Pashu Bima) versus personal accident cover for milk producers (Raj Saras Suraksha Kavach).","s":"Chapter 1, pp. 21-22.","hq":["राजस्थान में पशुधन और दुग्ध उत्पादक बीमा योजनाओं के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. मुख्यमंत्री मंगला पशु बीमा योजना के अंतर्गत 1 दिसंबर 2025 से देशी पशुधन के लिए प्रीमियम का 100 प्रतिशत राज्य वहन करता है, जिसका लक्ष्य 2025-26 में 42 लाख पशु हैं।","2. राज सरस सुरक्षा कवच बीमा योजना आंशिक स्थायी अपंगता पर ₹5 लाख देती है।","3. सरस सामूहिक आरोग्य बीमा योजना के अंतर्गत दिसंबर 2025 तक (19वाँ चरण) 33,516 दुग्ध उत्पादकों का बीमा किया गया।","4. मंगला पशु बीमा योजना केवल विदेशी नस्ल की गायों को कवर करती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 1 और 3","केवल 2 और 4","1, 2, 3 और 4"],"he":["कथन 1: सही। 1 दिसंबर 2025 से देशी पशुधन (गाय, भैंस, भेड़, बकरी, ऊँट) का निःशुल्क बीमा है, जिसमें प्रीमियम का 100% राज्य वहन करता है। 2025-26 का लक्ष्य 42 लाख पशु है।","कथन 2: गलत। राज सरस सुरक्षा कवच बीमा योजना (9वाँ चरण, 1 फरवरी 2025 से 31 जनवरी 2026) दुर्घटना में मृत्यु या पूर्ण स्थायी अपंगता पर ₹5 लाख और आंशिक स्थायी अपंगता पर ₹2.50 लाख देती है। दिसंबर 2025 तक 1,12,176 दुग्ध उत्पादकों का बीमा हुआ।","कथन 3: सही। दिसंबर 2025 तक 33,516 दुग्ध उत्पादकों का बीमा हुआ (19वाँ चरण)।","कथन 4: गलत। यह देशी पशुधन को कवर करती है, केवल विदेशी नस्लों को नहीं।"],"hi":"बीमा योजनाओं को अलग-अलग याद रखें: पशुधन बीमा (मंगला पशु बीमा) बनाम दुग्ध उत्पादकों का व्यक्तिगत दुर्घटना कवर (राज सरस सुरक्षा कवच)।","hs":"अध्याय 1, पृ. 21-22."},{"n":31,"t":"Incorrect statement","g":"RAS","ans":3,"q":["Which of the following statements regarding dairy development in Rajasthan is NOT correct?"],"o":["19,643 Dairy Cooperative Societies are affiliated with 24 District Milk Producers' Cooperative Unions and the apex body RCDF.","The installed milk processing capacity of District Milk Union plants has reached 51.40 lakh litres per day.","Under the Chief Minister Dugdh Utpadak Sambal Yojana, the grant was raised from ₹2 per litre to ₹5 per litre in 2022-23.","Average milk procurement of 30.29 lakh kg per day exceeded the target of 36.95 lakh kg per day."],"e":["Achievement (30.29 lakh kg/day) was below the target (36.
