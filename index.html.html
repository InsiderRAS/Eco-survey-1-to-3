्येक ₹325 करोड़) के लिए केंद्रीय हिस्सा 60% और राज्य हिस्सा 40% है।","कथन 4: सही। टोंक और जैसलमेर 2025-26 में प्रत्येक 50 MBBS सीटों के साथ शुरू हुए (पहले के कॉलेज: 100 सीटें)।"],"hi":"केंद्र-राज्य हिस्सेदारी बार-बार 60:40 है; इसे उलटें नहीं।","hs":"अध्याय 3, पृ. 57-58."},{"n":33,"t":"Direct factual","g":"RAS","ans":2,"q":["A Masters in Public Health (MPH) course with an intake of 25 seats was started for the academic year 2021-22 at:"],"o":["Jodhpur","Udaipur","RUHS, Jaipur","Kota"],"e":["The MPH course began at RUHS, Jaipur in 2021-22, and at Jodhpur and Udaipur in 2022-23.","Post-MBBS diploma courses in 8 specialties (381 seats) were started in government hospitals across 28 districts."],"i":"Year-wise starts of courses at different places are a typical RAS direct-fact style.","s":"Chapter 3, p. 58.","hq":["शैक्षणिक वर्ष 2021-22 के लिए 25 सीटों की प्रवेश क्षमता वाला लोक स्वास्थ्य में मास्टर्स (MPH) पाठ्यक्रम कहाँ शुरू किया गया?"],"ho":["जोधपुर","उदयपुर","RUHS, जयपुर","कोटा"],"he":["MPH पाठ्यक्रम RUHS, जयपुर में 2021-22 में और जोधपुर तथा उदयपुर में 2022-23 में शुरू हुआ।","28 जिलों के सरकारी अस्पतालों में 8 विशेषज्ञताओं के पोस्ट-MBBS डिप्लोमा पाठ्यक्रम (381 सीटें) शुरू किए गए।"],"hi":"विभिन्न स्थानों पर पाठ्यक्रमों के वर्षवार आरंभ RAS की विशिष्ट प्रत्यक्ष-तथ्य शैली हैं।","hs":"अध्याय 3, पृ. 58."},{"n":34,"t":"Multi-statement","g":"RAS","ans":1,"q":["Consider the following statements regarding Sanskrit education in Rajasthan:","1. The Directorate of Sanskrit Education was established in 1998 and the Sanskrit University in 1958.","2. Rajasthan has 2,374 institutions for Sanskrit education, of which 1,872 are in the government sector and 502 in the private sector.","3. A total of 1.56 lakh students study in these institutions.","4. The Rajasthan State Sanskrit Educational Research and Training Institute (SSIERT) is at Mahapura, Jaipur.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Incorrect. The separate Directorate for Sanskrit was established in 1958, and the Sanskrit University was founded in 1998. The statement swaps the two.","Statements 2-4: Correct. 2,374 institutions (1,872 government, 502 private) with 1.56 lakh students; SSIERT at Mahapura, Jaipur develops syllabus and textbooks for classes 1-12 and trains Sanskrit teachers."],"i":"Establishment years are swapped in the statement. Learn both (1958, 1998).","s":"Chapter 3, p. 59; Table 3.7.","hq":["राजस्थान में संस्कृत शिक्षा के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. संस्कृत शिक्षा निदेशालय की स्थापना 1998 में और संस्कृत विश्वविद्यालय की 1958 में हुई।","2. राजस्थान में संस्कृत शिक्षा की 2,374 संस्थाएँ हैं, जिनमें 1,872 सरकारी क्षेत्र में और 502 निजी क्षेत्र में हैं।","3. इन संस्थाओं में कुल 1.56 लाख विद्यार्थी पढ़ते हैं।","4. राजस्थान राज्य संस्कृत शैक्षिक अनुसंधान एवं प्रशिक्षण संस्थान (SSIERT) महापुरा, जयपुर में है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2, 3 और 4","केवल 1, 3 और 4","1, 2, 3 और 4"],"he":["कथन 1: गलत। संस्कृत के लिए पृथक निदेशालय 1958 में स्थापित हुआ और संस्कृत विश्वविद्यालय 1998 में। कथन में दोनों उलट दिए गए हैं।","कथन 2-4: सही। 2,374 संस्थाएँ (1,872 सरकारी, 502 निजी) जिनमें 1.56 लाख विद्यार्थी हैं; SSIERT महापुरा, जयपुर में कक्षा 1-12 के लिए पाठ्यक्रम और पाठ्यपुस्तकें विकसित करता है तथा संस्कृत शिक्षकों को प्रशिक्षित करता है।"],"hi":"स्थापना वर्ष कथन में उलट दिए गए हैं। दोनों (1958, 1998) सीखें।","hs":"अध्याय 3, पृ. 59; तालिका 3.7."},{"n":35,"t":"Single best answer","g":"RAS","ans":3,"q":["Which one of the following statements regarding libraries in Rajasthan is correct?"],"o":["The RFID system was first introduced in a government public library at Kota.","All 323 libraries are under the administrative control of the Department of Language and Library.","The 47 libraries run by the Department hold about 2.28 lakh books.","Savitri Bai Phule Study Centres have been established in 33 district libraries for competitive-exam aspirants."],"e":["Each Savitri Bai Phule Study Centre has a mentor for career guidance. The RFID system was first introduced at the Government Maharaja Divisional Public Library, Jaipur.","Of 323 libraries, 276 Panchayat Samiti-level libraries are under the Secondary Education Department. The 47 libraries hold 22,87,985 books (about 22.88 lakh, not 2.28 lakh)."],"i":"Spot decimal-place changes (22.88 lakh versus 2.28 lakh).","s":"Chapter 3, pp. 59-60.","hq":["राजस्थान में पुस्तकालयों के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["RFID प्रणाली पहली बार कोटा के एक सरकारी सार्वजनिक पुस्तकालय में शुरू की गई।","सभी 323 पुस्तकालय भाषा एवं पुस्तकालय विभाग के प्रशासनिक नियंत्रण में हैं।","विभाग द्वारा संचालित 47 पुस्तकालयों में लगभग 2.28 लाख पुस्तकें हैं।","प्रतियोगी परीक्षा के अभ्यर्थियों के लिए 33 जिला पुस्तकालयों में सावित्री बाई फुले अध्ययन केंद्र स्थापित किए गए हैं।"],"he":["प्रत्येक सावित्री बाई फुले अध्ययन केंद्र में करियर मार्गदर्शन हेतु एक मेंटर है। RFID प्रणाली सबसे पहले राजकीय महाराजा मंडलीय सार्वजनिक पुस्तकालय, जयपुर में शुरू हुई।","323 पुस्तकालयों में से 276 पंचायत समिति स्तर के पुस्तकालय माध्यमिक शिक्षा विभाग के अधीन हैं। 47 पुस्तकालयों में 22,87,985 पुस्तकें हैं (लगभग 22.88 लाख, 2.28 लाख नहीं)।"],"hi":"दशमलव स्थान के बदलाव पहचानें (22.88 लाख बनाम 2.28 लाख)।","hs":"अध्याय 3, पृ. 59-60."},{"n":36,"t":"Multi-statement","g":"RAS + UPSC","ans":2,"q":["Consider the following statements regarding science and technology initiatives in Rajasthan:","1. MoUs for Digital Planetariums at Jaipur and Kota were signed on 4 July 2025 at a cost of ₹13 crore each.","2. The State Remote Sensing Application Centre is at Jodhpur.","3. The Patent Information Centre at Jaipur creates awareness about Intellectual Property Rights, including patents and geographical indications.","4. Under KARYA-2025, 630 students were awarded research fellowships.","Which of the statements given above is/are correct?"],"o":["1 and 4 only","2, 3 and 4 only","2 and 3 only","1, 2, 3 and 4"],"e":["Statement 1: Incorrect. The MoUs signed on 4 July 2025 with the National Council of Science Museums are for Digital Planetariums at Jodhpur and Udaipur (₹13 crore each).","Statement 4: Incorrect. Under KARYA-2025, 63 students received research fellowships.","Statements 2 and 3: Correct. The State Remote Sensing Application Centre, Jodhpur supports mapping of soil, water, forests, agriculture and minerals, and the Patent Information Centre, Jaipur creates awareness about IPR, including patents and geographical indications."],"i":"Institution locations (Jodhpur, Jaipur) and the number 63 are typical fact-picks. State Innovation Awards (28 February 2025) carry cash prizes of ₹1,00,000, ₹51,000 and ₹21,000.","s":"Chapter 3, pp. 60-61.","hq":["राजस्थान में विज्ञान और प्रौद्योगिकी पहलों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. जयपुर और कोटा में डिजिटल तारामंडल के लिए 4 जुलाई 2025 को प्रत्येक ₹13 करोड़ की लागत से MoU हस्ताक्षरित हुए।","2. राज्य रिमोट सेंसिंग एप्लीकेशन सेंटर जोधपुर में है।","3. जयपुर स्थित पेटेंट सूचना केंद्र पेटेंट और भौगोलिक संकेतक सहित बौद्धिक संपदा अधिकारों के बारे में जागरूकता फैलाता है।","4. KARYA-2025 के अंतर्गत 630 विद्यार्थियों को अनुसंधान फेलोशिप प्रदान की गईं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 4","केवल 2, 3 और 4","केवल 2 और 3","1, 2, 3 और 4"],"he":["कथन 1: गलत। राष्ट्रीय विज्ञान संग्रहालय परिषद के साथ 4 जुलाई 2025 को हस्ताक्षरित MoU जोधपुर और उदयपुर में डिजिटल तारामंडल के लिए हैं (प्रत्येक ₹13 करोड़)।","कथन 4: गलत। KARYA-2025 के अंतर्गत 63 विद्यार्थियों को अनुसंधान फेलोशिप मिलीं।","कथन 2 और 3: सही। राज्य रिमोट सेंसिंग एप्लीकेशन सेंटर, जोधपुर मिट्टी, जल, वन, कृषि और खनिजों के मानचित्रण में सहायता करता है, और पेटेंट सूचना केंद्र, जयपुर पेटेंट और भौगोलिक संकेतक सहित IPR के बारे में जागरूकता फैलाता है।"],"hi":"संस्थाओं के स्थान (जोधपुर, जयपुर) और संख्या 63 विशिष्ट तथ्य-चयन हैं। राज्य नवाचार पुरस्कार (28 फरवरी 2025) में ₹1,00,000, ₹51,000 और ₹21,000 के नकद पुरस्कार हैं।","hs":"अध्याय 3, पृ. 60-61."},{"n":37,"t":"Data-based","g":"RAS + UPSC","ans":0,"q":["Using the budget and expenditure figures for 2025-26 (up to December) in the Review, which of the following had the highest percentage utilisation?"],"o":["Swami Vivekananda Scholarship for Academic Excellence (₹145 crore of ₹150 crore)","PM SHRI schools (₹51.81 crore of ₹434.65 crore)","Vocational education (₹205.33 crore of ₹616.88 crore)","Sanskrit education schemes (₹196.94 crore of ₹290.70 crore)"],"e":["Utilisation: PM SHRI ≈ 11.9%; vocational ≈ 33.3%; Sanskrit ≈ 67.7%; Swami Vivekananda Scholarship ≈ 96.7%.","Higher education overall: ₹786.24 crore of ₹1,552.08 crore (about 50.7%). These are part-year figures."],"i":"Compare ratios by rounding, and remember these are part-year figures.","s":"Chapter 3, pp. 51-52, 54-55, 59.","hq":["समीक्षा में दिए गए 2025-26 (दिसंबर तक) के बजट और व्यय आँकड़ों के आधार पर, निम्नलिखित में से किसका प्रतिशत उपयोग सर्वाधिक रहा?"],"ho":["शैक्षणिक उत्कृष्टता हेतु स्वामी विवेकानंद छात्रवृत्ति (₹150 करोड़ में से ₹145 करोड़)","PM SHRI विद्यालय (₹434.65 करोड़ में से ₹51.81 करोड़)","व्यावसायिक शिक्षा (₹616.88 करोड़ में से ₹205.33 करोड़)","संस्कृत शिक्षा योजनाएँ (₹290.70 करोड़ में से ₹196.94 करोड़)"],"he":["उपयोग: PM SHRI ≈ 11.9%; व्यावसायिक ≈ 33.3%; संस्कृत ≈ 67.7%; स्वामी विवेकानंद छात्रवृत्ति ≈ 96.7%।","उच्च शिक्षा कुल मिलाकर: ₹1,552.08 करोड़ में से ₹786.24 करोड़ (लगभग 50.7%)। ये आंशिक वर्ष के आँकड़े हैं।"],"hi":"पूर्णांकन करके अनुपातों की तुलना करें, और याद रखें कि ये आंशिक वर्ष के आँकड़े हैं।","hs":"अध्याय 3, पृ. 51-52, 54-55, 59."},{"n":38,"t":"Analytical","g":"UPSC","ans":0,"q":["Retention rates in Rajasthan in 2024-25 were 83.1% (primary), 78.7% (elementary), 55.9% (secondary) and 51.9% (higher secondary). Which of the following is the most valid conclusion?"],"o":["Retention falls at each successive level, with the sharpest fall between the elementary and secondary stages.","Retention rises at each higher level of schooling.","Retention is highest at the secondary level.","Retention fell at every level compared with 2023-24."],"e":["Fall between levels: 83.1 to 78.7 (−4.4), 78.7 to 55.9 (−22.8), 55.9 to 51.9 (−4.0). The sharpest drop is between elementary and secondary.","(d) is wrong: retention improved at primary (82.5 to 83.1), elementary (75.3 to 78.7) and higher secondary (48.9 to 51.9) and declined only at secondary (59.1 to 55.9). The Review calls secondary retention \"a critical area for improvement\"."],"i":"Retention is cohort-based (measured from Class 1), so it naturally falls at higher levels. Compare across years level by level.","s":"Chapter 3, p. 47; Table 3.4.","hq":["राजस्थान में 2024-25 में प्रतिधारण दरें 83.1% (प्राथमिक), 78.7% (प्रारंभिक), 55.9% (माध्यमिक) और 51.9% (उच्चतर माध्यमिक) थीं। निम्नलिखित में से सबसे उपयुक्त निष्कर्ष कौन-सा है?"],"ho":["प्रत्येक क्रमिक स्तर पर प्रतिधारण गिरता है, जिसमें सबसे तेज़ गिरावट प्रारंभिक और माध्यमिक चरणों के बीच है।","विद्यालयी शिक्षा के प्रत्येक उच्च स्तर पर प्रतिधारण बढ़ता है।","प्रतिधारण माध्यमिक स्तर पर सर्वाधिक है।","2023-24 की तुलना में प्रत्येक स्तर पर प्रतिधारण गिरा।"],"he":["स्तरों के बीच गिरावट: 83.1 से 78.7 (−4.4), 78.7 से 55.9 (−22.8), 55.9 से 51.9 (−4.0)। सबसे तेज़ गिरावट प्रारंभिक और माध्यमिक के बीच है।","(d) गलत है: प्रतिधारण प्राथमिक (82.5 से 83.1), प्रारंभिक (75.3 से 78.7) और उच्चतर माध्यमिक (48.9 से 51.9) में सुधरा और केवल माध्यमिक में घटा (59.1 से 55.9)। समीक्षा माध्यमिक प्रतिधारण को \"सुधार का एक महत्वपूर्ण क्षेत्र\" कहती है।"],"hi":"प्रतिधारण समूह-आधारित (कक्षा 1 से मापा गया) है, इसलिए यह उच्च स्तरों पर स्वाभाविक रूप से गिरता है। स्तर-दर-स्तर वर्षों की तुलना करें।","hs":"अध्याय 3, पृ. 47; तालिका 3.4."},{"n":39,"t":"Assertion and Reason","g":"UPSC","ans":2,"q":["Assertion (A): Dropout rates in Rajasthan fell at the primary, upper primary and secondary levels between 2023-24 and 2024-25.","Reason (R): The retention rate at the secondary level improved from 59.1 per cent to 55.9 per cent during the same period."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["A is correct: primary 7.6 to 3.6, upper primary 6.8 to 3.6, secondary 11.1 to 7.7.","R is false: secondary retention fell from 59.1% to 55.9%. A decline cannot be described as an improvement."],"i":"A reversed word (\"improved\" for a fall) is a standard trap in assertion-reason questions.","s":"Chapter 3, p. 47; Tables 3.4 and 3.5.","hq":["अभिकथन (A): राजस्थान में 2023-24 और 2024-25 के बीच प्राथमिक, उच्च प्राथमिक और माध्यमिक स्तरों पर ड्रॉपआउट दरें घटीं।","कारण (R): इसी अवधि में माध्यमिक स्तर पर प्रतिधारण दर 59.1 प्रतिशत से सुधरकर 55.9 प्रतिशत हो गई।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["A सही है: प्राथमिक 7.6 से 3.6, उच्च प्राथमिक 6.8 से 3.6, माध्यमिक 11.1 से 7.7।","R असत्य है: माध्यमिक प्रतिधारण 59.1% से घटकर 55.9% हुआ। गिरावट को सुधार नहीं कहा जा सकता।"],"hi":"उलटा शब्द (गिरावट के लिए \"सुधरी\") अभिकथन-कारण प्रश्नों में मानक जाल है।","hs":"अध्याय 3, पृ. 47; तालिका 3.4 और 3.5."},{"n":40,"t":"Classification","g":"RAS + UPSC","ans":1,"q":["Which one of the following education schemes in Rajasthan is NOT shared 60:40 between the Centre and the State?"],"o":["Samagra Shiksha","Mukhya Mantri Madarsa Aadhunikikaran Scheme","PM-USHA (Pradhan Mantri Uchchatar Shiksha Abhiyan)","Third-phase centrally sponsored medical colleges"],"e":["The Madarsa scheme is funded 90:10 by the State and the Madarsa Management Committee, with no Central share.","Samagra Shiksha, PM-USHA and the third-phase medical colleges are all 60:40 Centre-State schemes."],"i":"Funding-pattern classification is common in both RAS and UPSC.","s":"Chapter 3, pp. 46, 48, 55, 58.","hq":["राजस्थान में निम्नलिखित में से कौन-सी शिक्षा योजना केंद्र और राज्य के बीच 60:40 में साझा नहीं की जाती?"],"ho":["समग्र शिक्षा","मुख्यमंत्री मदरसा आधुनिकीकरण योजना","PM-USHA (प्रधानमंत्री उच्चतर शिक्षा अभियान)","तृतीय चरण के केंद्र प्रायोजित मेडिकल कॉलेज"],"he":["मदरसा योजना का वित्तपोषण राज्य और मदरसा प्रबंधन समिति द्वारा 90:10 में होता है, जिसमें कोई केंद्रीय हिस्सा नहीं है।","समग्र शिक्षा, PM-USHA और तृतीय चरण के मेडिकल कॉलेज सभी 60:40 केंद्र-राज्य योजनाएँ हैं।"],"hi":"वित्तपोषण-पैटर्न का वर्गीकरण RAS और UPSC दोनों में आम है।","hs":"अध्याय 3, पृ. 46, 48, 55, 58."}]};

const LET='ABCD';
function ls(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function fmt(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60,hh=Math.floor(m/60);return (hh?hh+':':'')+String(hh?m%60:m).padStart(hh?2:1,'0')+':'+String(x).padStart(2,'0')}

function Stem({q,lang}){
  const L=(lang==='hi'?q.hq:q.q);
  if(q.m){
    const a=q.m[1],b=q.m[2];
    return h('div',null,h('p',{className:'stem'},L[0]),
      h('div',{className:'lists'},
        h('div',{className:'lcol'},h('div',{className:'lh'},lang==='hi'?'सूची I':'List I'),L.slice(1,1+a).map((x,i)=>h('p',{key:i,className:'li'},x))),
        h('div',{className:'lcol'},h('div',{className:'lh'},lang==='hi'?'सूची II':'List II'),L.slice(1+a,1+a+b).map((x,i)=>h('p',{key:i,className:'li'},x)))));
  }
  return h('div',null,L.map((x,i)=>h('p',{key:i,className:/^(\d\.\s|[A-D]\.\s|Assertion|Reason|अभिकथन|कारण)/.test(x)?'stmt':'stem'},x)));
}
function Expl({q,lang,t}){
  const hi=lang==='hi';
  return h('div',{className:'expl'},
    h('div',{className:'eh'},t.expl),
    h('ul',null,(hi?q.he:q.e).map((x,i)=>h('li',{key:i},x))),
    h('p',{className:'ins'},h('b',null,t.insight+': '),hi?q.hi:q.i),
    h('p',{className:'src'},t.source+': '+(hi?q.hs:q.s)));
}
function Options({q,lang,sel,reveal,onPick,t}){
  const O=lang==='hi'?q.ho:q.o;
  return h('div',{className:'opts',role:'radiogroup'},O.map((o,i)=>{
    let cls='opt';
    if(sel===i)cls+=' sel';
    if(reveal){if(i===q.ans)cls+=' good';else if(sel===i)cls+=' bad';}
    return h('button',{key:i,className:cls,role:'radio','aria-checked':sel===i,onClick:()=>onPick&&onPick(i),disabled:reveal&&!onPick},
      h('span',{className:'lt'},'('+LET[i].toLowerCase()+')'),h('span',{className:'ot'},o));
  }));
}

  const num=(v,f)=>{const n=parseFloat(v);return isNaN(n)?f:n};

    h('header',{className:'hero'},
      h('div',{className:'brand'},h('span',{className:'logo'},'IR'),h('div',null,h('div',{className:'bn'},t.app),h('div',{className:'bs'},t.ed))),
      h('div',{className:'seg',role:'group','aria-label':t.lang},['en','hi'].map(l=>h('button',{key:l,className:lang===l?'on':'',onClick:()=>setLang(l)},l==='en'?'English':'हिन्दी')))),

          h('div',{className:'lab sp'},t.score),
          h('div',{className:'two'},
            h('div',null,h('label',{htmlFor:'pos',className:'sm'},t.cor),h('input',{id:'pos',type:'number',step:'0.25',value:pos,onChange:e=>setPos(num(e.target.value,1))})),
            h('div',null,h('label',{htmlFor:'neg',className:'sm'},t.neg),h('input',{id:'neg',type:'number',step:'0.25',min:0,value:neg,onChange:e=>setNeg(Math.max(0,num(e.target.value,0)))}))),

    h('div',{className:'cards'},CH.map(c=>{

        h('h2',null,lang==='hi'?c.hi:c.en),
        h('div',{className:'cm'},'40 '+t.qs+' · EN / हिन्दी'),
        h('div',{className:'cbtn'},
          h('button',{className:'btn pri',onClick:()=>start(c.id,{mode,mins,pos,neg})},t.start),
          sv&&sv.ans?h('button',{className:'btn',onClick:()=>start(c.id,sv.cfg,sv)},t.resume+' ('+Object.keys(sv.ans).length+'/40)'):null));
    })),
    h('p',{className:'foot'},t.note));
}

function Test({cid,cfg,init,lang,setLang,finish,goHome}){
  const t=T[lang];
  const Q=DATA[cid];
  const [i,setI]=useState(init?init.i:0);
  const [ans,setAns]=useState(init?init.ans:{});
  const [mk,setMk]=useState(init?init.mk:{});
  const [seen,setSeen]=useState(init?init.seen:{0:1});
  const [used,setUsed]=useState(init?init.used:0);
  const [conf,setConf]=useState(false);
  const [pal,setPal]=useState(false);
  const t0=useRef(Date.now()-(init?init.used*1000:0));
  const [now,setNow]=useState(0);
  const prac=cfg.mode==='prac';
  const total=cfg.mins*60;
  const stRef=useRef();stRef.current={i,ans,mk,seen};
  useEffect(()=>{const iv=setInterval(()=>{const u=(Date.now()-t0.current)/1000;setUsed(u);setNow(n=>n+1);if(total&&u>=total){clearInterval(iv);finish(stRef.current.ans,stRef.current.mk,Math.round(total),true)}},1000);return()=>clearInterval(iv)},[]);
  useEffect(()=>{ls('ir_prog_'+cid,{i,ans,mk,seen,used:Math.round((Date.now()-t0.current)/1000),cfg})},[i,ans,mk,seen]);
  const go=n=>{const k=Math.max(0,Math.min(Q.length-1,n));setI(k);setSeen(s=>({...s,[k]:1}));setPal(false);window.scrollTo(0,0)};
  const q=Q[i];
  const sel=ans[i];
  const revealed=prac&&sel!==undefined;
  const pick=v=>{if(revealed)return;setAns(a=>({...a,[i]:v}))};
  const clear=()=>{if(revealed)return;setAns(a=>{const b={...a};delete b[i];return b})};
  const toggleMk=()=>setMk(m=>{const b={...m};if(b[i])delete b[i];else b[i]=1;return b});
  const nAns=Object.keys(ans).length;
  const doSubmit=()=>finish(ans,mk,Math.round((Date.now()-t0.current)/1000),false);
  const ch=CH.find(c=>c.id===cid);
  const palette=h('div',{className:'pal'},
    h('div',{className:'ph'},t.palette),
    h('div',{className:'pg'},Q.map((_,k)=>{let c='pb';if(ans[k]!==undefined)c+=' a';else if(seen[k])c+=' s';if(mk[k])c+=' m';if(k===i)c+=' c';return h('button',{key:k,className:c,onClick:()=>go(k),'aria-label':t.q+' '+(k+1)},k+1)})),
    h('div',{className:'leg'},h('span',null,h('i',{className:'d a'}),t.ans),h('span',null,h('i',{className:'d s'}),t.notans),h('span',null,h('i',{className:'d m'}),t.marked),h('span',null,h('i',{className:'d c'}),t.cur)),
    h('button',{className:'btn pri full',onClick:()=>setConf(true)},t.submit));
  return h('div',{className:'wrap test'},
    h('div',{className:'tbar'},
      h('button',{className:'lnk',onClick:goHome},'← '+t.home),
      h('div',{className:'tt'},h('b',null,(lang==='hi'?ch.hi:ch.en)),h('span',null,prac?t.prac:t.exam)),
      h('div',{className:'tr'},
        total?h('div',{className:'tm'+(total-used<60?' warn':'')},fmt(total-used)+' '+t.rem):h('div',{className:'tm'},fmt(used)),
        h('div',{className:'seg sm'},['en','hi'].map(l=>h('button',{key:l,className:lang===l?'on':'',onClick:()=>setLang(l)},l==='en'?'EN':'हि'))))),
    h('div',{className:'prog'},h('div',{style:{width:(nAns/Q.length*100)+'%'}})),
    h('div',{className:'meta'},h('span',null,t.q+' '+(i+1)+' '+t.of+' '+Q.length),h('span',null,nAns+'/'+Q.length+' '+t.ans),h('button',{className:'lnk palbtn',onClick:()=>setPal(p=>!p)},t.palette+(pal?' ▴':' ▾'))),
    pal?h('div',{className:'palm'},palette):null,
    h('div',{className:'tgrid'},
      h('main',{className:'qcard'},
        h('div',{className:'qh'},h('span',{className:'qn'},t.q+' '+q.n),h('span',{className:'tag'},q.g)),
        h(Stem,{q,lang}),
        h(Options,{q,lang,sel,reveal:revealed,onPick:revealed?null:pick,t}),
        revealed?h('div',{className:'fb '+(sel===q.ans?'ok':'no')},sel===q.ans?t.correctQ:t.wrongQ+' · '+t.right+': ('+'abcd'[q.ans]+')'):null,
        revealed?h(Expl,{q,lang,t}):null,
        prac&&!revealed?h('p',{className:'hint'},t.lock):null,
        h('div',{className:'nav'},
          h('button',{className:'btn',disabled:i===0,onClick:()=>go(i-1)},'‹ '+t.prev),
          h('button',{className:'btn',onClick:clear,disabled:sel===undefined||revealed},t.clear),
          h('button',{className:'btn'+(mk[i]?' on':''),onClick:toggleMk},mk[i]?t.unmark:t.mark),
          i<Q.length-1?h('button',{className:'btn pri',onClick:()=>go(i+1)},t.next+' ›'):h('button',{className:'btn pri',onClick:()=>setConf(true)},t.submit))),
      h('aside',{className:'side'},palette)),
    conf?h('div',{className:'modal',role:'dialog','aria-modal':'true'},h('div',{className:'mbox'},
      h('h3',null,t.confirm),
      h('p',null,t.ans+': '+nAns+' · '+t.unatt+': '+(Q.length-nAns)+' · '+t.marked+': '+Object.keys(mk).length),
      h('div',{className:'mb'},h('button',{className:'btn',onClick:()=>setConf(false)},t.cancel),h('button',{className:'btn pri',onClick:doSubmit},t.yes)))):null);
}

function Result({cid,cfg,res,lang,setLang,retake,goHome}){
  const t=T[lang];
  const Q=DATA[cid];
  const [f,setF]=useState('all');
  let c=0,w=0,u=0;
  Q.forEach((q,k)=>{const a=res.ans[k];if(a===undefined)u++;else if(a===q.ans)c++;else w++});
  const score=c*cfg.pos-w*cfg.neg;
  const max=Q.length*cfg.pos;
  const att=c+w;
  const acc=att?Math.round(c/att*1000)/10:0;
  const st=k=>{const a=res.ans[k];return a===undefined?'u':a===Q[k].ans?'c':'w'};
  const list=Q.map((q,k)=>({q,k,s:st(k)})).filter(x=>f==='all'||(f==='m'?res.mk[x.k]:x.s===f));
  const ch=CH.find(x=>x.id===cid);
  const stat=(l,v,cl)=>h('div',{className:'stat '+(cl||'')},h('div',{className:'sv'},v),h('div',{className:'sl'},l));
  return h('div',{className:'wrap'},
    h('div',{className:'tbar'},h('button',{className:'lnk',onClick:goHome},'← '+t.home),h('div',{className:'tt'},h('b',null,lang==='hi'?ch.hi:ch.en),h('span',null,t.res)),
      h('div',{className:'tr'},h('div',{className:'seg sm'},['en','hi'].map(l=>h('button',{key:l,className:lang===l?'on':'',onClick:()=>setLang(l)},l==='en'?'EN':'हि'))))),
    res.timeup?h('div',{className:'fb no'},t.timeup):null,
    h('section',{className:'rs'},
      h('div',{className:'big'},h('div',{className:'bv'},String(Math.round(score*100)/100)),h('div',{className:'bl'},t.scoreL+' / '+(Math.round(max*100)/100))),
      h('div',{className:'stats'},stat(t.correct,c,'g'),stat(t.incorrect,w,'r'),stat(t.un,u),stat(t.acc,acc+'%'),stat(t.time,fmt(res.time)))),
    h('div',{className:'actions'},h('button',{className:'btn pri',onClick:retake},t.retake),h('button',{className:'btn',onClick:goHome},t.home)),
    h('h2',{className:'rh'},t.review),
    h('div',{className:'filters'},[['all',t.all+' ('+Q.length+')'],['c',t.correct+' ('+c+')'],['w',t.incorrect+' ('+w+')'],['u',t.un+' ('+u+')'],['m',t.marked+' ('+Object.keys(res.mk).length+')']].map(([k,l])=>h('button',{key:k,className:'chip'+(f===k?' on':''),onClick:()=>setF(k)},l))),
    list.map(({q,k,s})=>h('article',{key:k,className:'qcard rv '+s},
      h('div',{className:'qh'},h('span',{className:'qn'},t.q+' '+q.n),h('span',{className:'tag'},q.g),h('span',{className:'badge '+s},s==='c'?t.correctQ:s==='w'?t.wrongQ:t.skipQ),res.mk[k]?h('span',{className:'badge m'},t.markedF):null),
      h(Stem,{q,lang}),
      h(Options,{q,lang,sel:res.ans[k],reveal:true,onPick:null,t}),
      h('p',{className:'yr'},t.yours+': '+(res.ans[k]===undefined?'—':'('+'abcd'[res.ans[k]]+')')+'  ·  '+t.right+': ('+'abcd'[q.ans]+')'),
      h(Expl,{q,lang,t}))));
}

function App(){
  const [lang,setLang]=useState(()=>ls('ir_lang')||'en');
  const [scr,setScr]=useState({s:'home'});
  useEffect(()=>{ls('ir_lang',lang)},[lang]);
  useEffect(()=>{document.documentElement.lang=lang},[lang]);
  const home=()=>setScr({s:'home'});
  if(scr.s==='home')return h(Home,{lang,setLang,start:(cid,cfg,init)=>{if(!init)ls('ir_prog_'+cid,null);setScr({s:'test',cid,cfg,init,key:Date.now()})}});
  if(scr.s==='test')return h(Test,{key:scr.key,cid:scr.cid,cfg:scr.cfg,init:scr.init,lang,setLang,goHome:home,finish:(ans,mk,time,timeup)=>{ls('ir_prog_'+scr.cid,null);setScr({s:'res',cid:scr.cid,cfg:scr.cfg,res:{ans,mk,time,timeup}})}});
  return h(Result,{cid:scr.cid,cfg:scr.cfg,res:scr.res,lang,setLang,goHome:home,retake:()=>{ls('ir_prog_'+scr.cid,null);setScr({s:'test',cid:scr.cid,cfg:scr.cfg,init:null,key:Date.now()})}});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
