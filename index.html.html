 Ambulance: 173.57 ÷ 224.77 ≈ 77.2%. 104 Janani Express ≈ 55.1%; NUHM ≈ 29.4%; Mobile Medical Service ≈ 8.6%.","These are part-year figures, so they show progress to date, not final spending."],"i":"Utilisation percentages test quick arithmetic; compare with rough fractions (173/225 is close to 0.77).","s":"Chapter 2, pp. 40-41.","hq":["समीक्षा में दिए गए 2025-26 (दिसंबर तक) के बजट और व्यय आँकड़ों के आधार पर, निम्नलिखित में से किसका प्रतिशत उपयोग सर्वाधिक रहा?"],"ho":["104 जननी एक्सप्रेस (₹100.24 करोड़ में से ₹55.24 करोड़)","मोबाइल मेडिकल सेवा (₹87.08 करोड़ में से ₹7.45 करोड़)","राष्ट्रीय शहरी स्वास्थ्य मिशन (₹198.01 करोड़ में से ₹58.25 करोड़)","108 एम्बुलेंस सेवा योजना (₹224.77 करोड़ में से ₹173.57 करोड़)"],"he":["108 एम्बुलेंस: 173.57 ÷ 224.77 ≈ 77.2%। 104 जननी एक्सप्रेस ≈ 55.1%; NUHM ≈ 29.4%; मोबाइल मेडिकल सेवा ≈ 8.6%।","ये आंशिक वर्ष के आँकड़े हैं, इसलिए ये अब तक की प्रगति दर्शाते हैं, अंतिम व्यय नहीं।"],"hi":"उपयोग प्रतिशत के प्रश्न त्वरित अंकगणित की परीक्षा लेते हैं; मोटे भिन्नों से तुलना करें (173/225 लगभग 0.77 के पास)।","hs":"अध्याय 2, पृ. 40-41."},{"n":31,"t":"Single best answer","g":"RAS","ans":1,"q":["Which one of the following statements regarding the Mobile Medical Service Scheme is correct?"],"o":["10,714 camps were targeted but 14,340 camps were held in 2025-26 (up to December).","The scheme started in 2008-09 and 28 Mobile Medical Vehicles are operational.","Expenditure of ₹7.45 crore exceeded half of the ₹87.08 crore provision.","The scheme is intended mainly for urban slums."],"e":["The scheme aims to provide services in desert, tribal and inaccessible areas without PHC/CHC/sub-centre or private facilities, through 20 free camps monthly. It treated 6.01 lakh patients in 10,714 camps against a target of 14,340.","(b) reverses the target and achievement; (c) spending was only about 8.6% of the provision; (d) misstates the target area."],"i":"Target versus achievement reversal is a classic trap.","s":"Chapter 2, p. 40.","hq":["मोबाइल मेडिकल सेवा योजना के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["10,714 शिविरों का लक्ष्य था, परंतु 2025-26 (दिसंबर तक) में 14,340 शिविर लगाए गए।","योजना 2008-09 में शुरू हुई और 28 मोबाइल मेडिकल वाहन संचालित हैं।","₹7.45 करोड़ का व्यय ₹87.08 करोड़ के प्रावधान के आधे से अधिक रहा।","योजना मुख्यतः शहरी झुग्गियों के लिए है।"],"he":["योजना का उद्देश्य मरुस्थलीय, जनजातीय और दुर्गम क्षेत्रों में, जहाँ PHC/CHC/उप-केंद्र या निजी सुविधाएँ नहीं हैं, प्रतिमाह 20 निःशुल्क शिविरों के माध्यम से सेवाएँ देना है। इसने 14,340 के लक्ष्य के विरुद्ध 10,714 शिविरों में 6.01 लाख रोगियों का उपचार किया।","(a) में लक्ष्य और उपलब्धि उलट दिए गए हैं; (c) में व्यय प्रावधान का केवल लगभग 8.6% था; (d) में लक्षित क्षेत्र गलत बताया गया है।"],"hi":"लक्ष्य बनाम उपलब्धि का उलटना एक क्लासिक जाल है।","hs":"अध्याय 2, पृ. 40."},{"n":32,"t":"Assertion and Reason","g":"UPSC","ans":1,"q":["Assertion (A): Rajasthan's full immunisation coverage rose from 54.8 per cent (NFHS-4) to 80.4 per cent (NFHS-5), exceeding the national figure in NFHS-5.","Reason (R): In NFHS-4, Rajasthan's full immunisation coverage was lower than India's."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["A is correct: 80.4% versus India's 76.4% in NFHS-5.","R is also correct: 54.8% versus 62.0% in NFHS-4. But R only describes the earlier position; it does not explain why coverage rose. Note that full immunisation here refers to children aged 12-23 months based on card or mother's recall."],"i":"Two true statements do not make an explanation. Ask whether R answers \"why\".","s":"Chapter 2, p. 29; Table 2.1.","hq":["अभिकथन (A): राजस्थान में पूर्ण टीकाकरण कवरेज 54.8 प्रतिशत (NFHS-4) से बढ़कर 80.4 प्रतिशत (NFHS-5) हो गया, जो NFHS-5 में राष्ट्रीय आँकड़े से अधिक है।","कारण (R): NFHS-4 में राजस्थान का पूर्ण टीकाकरण कवरेज भारत से कम था।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["A सही है: NFHS-5 में 80.4% बनाम भारत का 76.4%।","R भी सही है: NFHS-4 में 54.8% बनाम 62.0%। परंतु R केवल पहले की स्थिति बताता है; यह नहीं बताता कि कवरेज क्यों बढ़ा। ध्यान दें कि यहाँ पूर्ण टीकाकरण का तात्पर्य 12-23 माह के बच्चों से है, जो कार्ड या माँ की याददाश्त पर आधारित है।"],"hi":"दो सही कथन मिलकर व्याख्या नहीं बनाते। पूछें कि क्या R \"क्यों\" का उत्तर देता है।","hs":"अध्याय 2, पृ. 29; तालिका 2.1."},{"n":33,"t":"Single best answer","g":"RAS","ans":2,"q":["Which one of the following statements regarding telemedicine and urban health in Rajasthan is correct?"],"o":["e-Sanjeevani HWC is a portal launched by the Government of Rajasthan.","The National Urban Health Mission operates 286 Urban Community Health Centres.","e-Sanjeevani uses a hub-and-spoke model with tiered consultation from PHC to CHC, District Hospital and Medical College.","Only 17 Urban Primary Health Centres are operational."],"e":["e-Sanjeevani HWC portal was initiated by the Government of India; teleconsultations in the State reached 20.33 lakh (up to December 2025).","NUHM operates 17 UCHCs, 286 UPHCs and 638 UAAMs (Table 2.7), so (c) and (d) swap the numbers. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 2: Health and Well-being"],"i":"Know the three urban facility counts as a set.","s":"Chapter 2, p. 41; Table 2.7.","hq":["राजस्थान में टेलीमेडिसिन और शहरी स्वास्थ्य के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["e-संजीवनी HWC राजस्थान सरकार द्वारा शुरू किया गया पोर्टल है।","राष्ट्रीय शहरी स्वास्थ्य मिशन 286 शहरी सामुदायिक स्वास्थ्य केंद्र संचालित करता है।","e-संजीवनी हब-एंड-स्पोक मॉडल का उपयोग करता है, जिसमें PHC से CHC, जिला अस्पताल और मेडिकल कॉलेज तक श्रेणीबद्ध परामर्श होता है।","केवल 17 शहरी प्राथमिक स्वास्थ्य केंद्र संचालित हैं।"],"he":["e-संजीवनी HWC पोर्टल भारत सरकार द्वारा शुरू किया गया; राज्य में टेली-परामर्श 20.33 लाख तक पहुँचे (दिसंबर 2025 तक)।","NUHM 17 UCHC, 286 UPHC और 638 UAAM संचालित करता है (तालिका 2.7), इसलिए (b) और (d) में संख्याएँ आपस में बदली हुई हैं।"],"hi":"तीनों शहरी सुविधाओं की संख्याएँ एक समूह के रूप में याद रखें।","hs":"अध्याय 2, पृ. 41; तालिका 2.7."},{"n":34,"t":"Chronology","g":"RAS","ans":3,"q":["Arrange the following health initiatives in chronological order of their launch/enactment as stated in the Economic Review (earliest first):","A. 108 Ambulance Service Yojana launched","B. Silicosis Policy","C. Rajasthan Right to Healthcare Act","D. Ayushman Vay Vandan Scheme launched","Select the correct chronological order (earliest to latest)."],"o":["A-B-D-C","B-A-C-D","A-C-B-D","A-B-C-D"],"e":["108 Ambulance Service Yojana (September 2008); Silicosis Policy (2019); Rajasthan Right to Healthcare Act (2023); Ayushman Vay Vandan Scheme (29 October 2024).","Mission Madhuhari followed on 29 November 2024."],"i":"One anchor year per scheme is enough to solve chronology questions.","s":"Chapter 2, pp. 27, 34-36, 40.","hq":["निम्नलिखित स्वास्थ्य पहलों को आर्थिक समीक्षा में बताए अनुसार उनके आरंभ/अधिनियमन के कालक्रम (प्राचीनतम पहले) में व्यवस्थित कीजिए:","A. 108 एम्बुलेंस सेवा योजना का शुभारंभ","B. सिलिकोसिस नीति","C. राजस्थान स्वास्थ्य का अधिकार अधिनियम","D. आयुष्मान वय वंदन योजना का शुभारंभ","सही कालक्रम (प्राचीनतम से नवीनतम) चुनिए।"],"ho":["A-B-D-C","B-A-C-D","A-C-B-D","A-B-C-D"],"he":["108 एम्बुलेंस सेवा योजना (सितंबर 2008); सिलिकोसिस नीति (2019); राजस्थान स्वास्थ्य का अधिकार अधिनियम (2023); आयुष्मान वय वंदन योजना (29 अक्टूबर 2024)।","मिशन मधुहारी इसके बाद 29 नवंबर 2024 को शुरू हुआ।"],"hi":"कालक्रम के प्रश्न हल करने के लिए प्रत्येक योजना का एक आधार वर्ष पर्याप्त है।","hs":"अध्याय 2, पृ. 27, 34-36, 40."},{"n":35,"t":"Direct factual","g":"RAS","ans":1,"q":["The Mukhyamantri Bal Sambal Yojana provides relief to children suffering from:"],"o":["Type 1 diabetes","Rare diseases","Thalassaemia","Congenital heart disease"],"e":["The scheme (\"Chief Minister's Ayushman Child Support Scheme\") supports children with rare diseases: 224 children were certified and ₹65 lakh spent.","Type 1 diabetes is covered by Mission Madhuhari."],"i":"Near-identical scheme purposes are a standard distractor set.","s":"Chapter 2, p. 34.","hq":["मुख्यमंत्री बाल संबल योजना किन रोगों से पीड़ित बच्चों को राहत प्रदान करती है?"],"ho":["टाइप 1 मधुमेह","दुर्लभ रोग","थैलेसीमिया","जन्मजात हृदय रोग"],"he":["योजना (\"मुख्यमंत्री आयुष्मान बाल सहायता योजना\") दुर्लभ रोगों वाले बच्चों की सहायता करती है: 224 बच्चे प्रमाणित और ₹65 लाख व्यय।","टाइप 1 मधुमेह मिशन मधुहारी के अंतर्गत आता है।"],"hi":"लगभग मिलते-जुलते योजना-उद्देश्य एक मानक भ्रामक विकल्प-समूह होते हैं।","hs":"अध्याय 2, पृ. 34."},{"n":36,"t":"Single best answer","g":"RAS","ans":0,"q":["Which one of the following statements regarding the National AIDS Control Programme in Rajasthan (up to December 2025) is correct?"],"o":["The State has 255 blood banks, of which 190 are private.","The State has 53 Anti-Retroviral Therapy (ART) Centres.","Of 28.60 lakh individuals tested, 55,220 were HIV-positive.","Only government blood banks operate in the State."],"e":["Blood banks: 58 State Government + 7 Central Government + 190 private = 255.","The 53 refers to STI clinics; ART centres number 28 (plus 8 PPP, 21 link ART and 17 Care Support Centres). HIV-positive cases were 5,522, not 55,220."],"i":"STI clinics versus ART centres is the usual number swap.","s":"Chapter 2, p. 37.","hq":["राष्ट्रीय एड्स नियंत्रण कार्यक्रम (दिसंबर 2025 तक) के संबंध में राजस्थान में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["राज्य में 255 ब्लड बैंक हैं, जिनमें से 190 निजी हैं।","राज्य में 53 एंटी-रेट्रोवायरल थेरेपी (ART) केंद्र हैं।","28.60 लाख परीक्षित व्यक्तियों में से 55,220 HIV-पॉज़िटिव थे।","राज्य में केवल सरकारी ब्लड बैंक संचालित हैं।"],"he":["ब्लड बैंक: 58 राज्य सरकार + 7 केंद्र सरकार + 190 निजी = 255।","53 की संख्या STI क्लिनिकों की है; ART केंद्र 28 हैं (साथ में 8 PPP, 21 लिंक ART और 17 केयर सपोर्ट सेंटर)। HIV-पॉज़िटिव मामले 55,220 नहीं, 5,522 थे।"],"hi":"STI क्लिनिक बनाम ART केंद्र सामान्य संख्या-अदला-बदली का जाल है।","hs":"अध्याय 2, पृ. 37."},{"n":37,"t":"Single best answer","g":"RAS","ans":2,"q":["Which one of the following approvals announced for 2025-26 is correctly stated?"],"o":["Sub-District Hospital Ramganj Mandi (Kota) approved for upgradation to a Satellite Hospital.","CHC Sunel (Jhalawar) approved for upgradation to a 150-bedded District Hospital.","CHC Deeg approved for upgradation to a 150-bedded District Hospital.","78 Primary Health Centres approved for upgradation to Community Health Centres."],"e":["CHC Deeg to a 150-bed District Hospital is correct.","Ramganj Mandi SDH goes to District Hospital; CHC Sunel goes to a 75-bedded Satellite Hospital; and 78 Sub-Health Centres go to PHCs (34 PHCs to CHCs; 17 CHCs to SDHs)."],"i":"Upgradation questions test the exact from-to level. Know the ladder: SHC to PHC to CHC to SDH to DH.","s":"Chapter 2, pp. 36-37.","hq":["2025-26 के लिए घोषित निम्नलिखित स्वीकृतियों में से कौन-सी सही रूप से बताई गई है?"],"ho":["उप-जिला अस्पताल रामगंज मंडी (कोटा) को सैटेलाइट अस्पताल में क्रमोन्नत करने की स्वीकृति।","CHC सुनेल (झालावाड़) को 150 बिस्तर वाले जिला अस्पताल में क्रमोन्नत करने की स्वीकृति।","CHC डीग को 150 बिस्तर वाले जिला अस्पताल में क्रमोन्नत करने की स्वीकृति।","78 प्राथमिक स्वास्थ्य केंद्रों को सामुदायिक स्वास्थ्य केंद्रों में क्रमोन्नत करने की स्वीकृति।"],"he":["CHC डीग का 150 बिस्तर वाले जिला अस्पताल में क्रमोन्नयन सही है।","रामगंज मंडी SDH को जिला अस्पताल बनाया जाना है; CHC सुनेल को 75 बिस्तर वाला सैटेलाइट अस्पताल बनाया जाना है; और 78 उप स्वास्थ्य केंद्रों को PHC बनाया जाना है (34 PHC से CHC; 17 CHC से SDH)।"],"hi":"क्रमोन्नयन के प्रश्न सटीक \"से-तक\" स्तर की परीक्षा लेते हैं। सीढ़ी याद रखें: SHC से PHC से CHC से SDH से DH।","hs":"अध्याय 2, पृ. 36-37."},{"n":38,"t":"Direct factual","g":"RAS","ans":3,"q":["Registration of beneficiaries under the Rajasthan Government Health Scheme (RGHS) is done through:"],"o":["Bhamashah card","SSO ID","ABHA ID","Jan Aadhaar"],"e":["RGHS registration is through Jan Aadhaar, allowing cashless OPD/IPD at government and more than 741 empanelled private hospitals, CONFED medical stores and 3,748 private empanelled pharma stores in the State (and more than 39 hospitals outside the State).","About 13.65 lakh families are covered. Expenditure was ₹2,440.69 crore for 92.76 lakh claims (2025-26, up to December)."],"i":"Administrative identifiers (Jan Aadhaar versus ABHA) are standard RAS questions.","s":"Chapter 2, p. 34.","hq":["राजस्थान गवर्नमेंट हेल्थ स्कीम (RGHS) के अंतर्गत लाभार्थियों का पंजीकरण किसके माध्यम से होता है?"],"ho":["भामाशाह कार्ड","SSO आईडी","ABHA आईडी","जन आधार"],"he":["RGHS पंजीकरण जन आधार के माध्यम से होता है, जिससे सरकारी और 741 से अधिक सूचीबद्ध निजी अस्पतालों, कॉन्फेड मेडिकल स्टोरों और राज्य में 3,748 निजी सूचीबद्ध फार्मा स्टोरों (तथा राज्य के बाहर 39 से अधिक अस्पतालों) में कैशलेस OPD/IPD संभव है।","लगभग 13.65 लाख परिवार शामिल हैं। 2025-26 (दिसंबर तक) 92.76 लाख दावों पर ₹2,440.69 करोड़ व्यय हुआ।"],"hi":"प्रशासनिक पहचानकर्ता (जन आधार बनाम ABHA) RAS के मानक प्रश्न हैं।","hs":"अध्याय 2, पृ. 34."},{"n":39,"t":"Multi-statement","g":"RAS + UPSC","ans":1,"q":["Consider the following statements based on Figure 2.4 (Health Programme Achievements, 2025-26):","1. The number of tuberculosis patients under treatment (1.67 lakh) exceeded the target of 1.60 lakh.","2. Blood samples examined for vector-borne diseases (119.04 lakh) exceeded the target of 110.12 lakh.","3. Cataract operations performed (2.88 lakh) exceeded the target of 4.50 lakh.","4. Under leprosy eradication, more than 90 per cent of the target for patients cured (1,164) was achieved.","Which of the statements given above is/are correct?"],"o":["1 and 3 only","1 and 2 only","2 and 4 only","3 and 4 only"],"e":["Statement 1: Correct. TB: 1.67 lakh under treatment against a target of 1.60 lakh.","Statement 2: Correct. Vector-borne diseases: 119.04 lakh blood samples against a target of 110.12 lakh.","Statement 3: Incorrect. Cataract operations: 2.88 lakh against a target of 4.50 lakh (about 64%).","Statement 4: Incorrect. Leprosy: 854 patients cured of a target of 1,164 (about 73%), well below 90%."],"i":"Read \"against target\" values carefully. Two programmes exceeded their targets, two fell short.","s":"Chapter 2, p. 42; Figure 2.4.","hq":["चित्र 2.4 (स्वास्थ्य कार्यक्रम उपलब्धियाँ, 2025-26) पर आधारित निम्नलिखित कथनों पर विचार कीजिए:","1. उपचाराधीन क्षय रोग रोगियों की संख्या (1.67 लाख) 1.60 लाख के लक्ष्य से अधिक रही।","2. वेक्टर-जनित रोगों के लिए जाँचे गए रक्त नमूने (119.04 लाख) 110.12 लाख के लक्ष्य से अधिक रहे।","3. की गई मोतियाबिंद शल्य क्रियाएँ (2.88 लाख) 4.50 लाख के लक्ष्य से अधिक रहीं।","4. कुष्ठ उन्मूलन के अंतर्गत ठीक हुए रोगियों (1,164) के लक्ष्य की 90 प्रतिशत से अधिक उपलब्धि हासिल हुई।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 3","केवल 1 और 2","केवल 2 और 4","केवल 3 और 4"],"he":["कथन 1: सही। टीबी: 1.60 लाख के लक्ष्य के विरुद्ध 1.67 लाख उपचाराधीन।","कथन 2: सही। वेक्टर-जनित रोग: 110.12 लाख के लक्ष्य के विरुद्ध 119.04 लाख रक्त नमूने।","कथन 3: गलत। मोतियाबिंद शल्य क्रियाएँ: 4.50 लाख के लक्ष्य के विरुद्ध 2.88 लाख (लगभग 64%)।","कथन 4: गलत। कुष्ठ: 1,164 के लक्ष्य में से 854 रोगी ठीक हुए (लगभग 73%), जो 90% से काफ़ी कम है।"],"hi":"\"लक्ष्य के विरुद्ध\" मानों को ध्यान से पढ़ें। दो कार्यक्रमों ने लक्ष्य पार किया, दो पीछे रहे।","hs":"अध्याय 2, पृ. 42; चित्र 2.4."},{"n":40,"t":"Multi-statement","g":"RAS","ans":2,"q":["Consider the following statements regarding national health programmes in Rajasthan (2025-26, up to December):","1. Under the National Mental Health Programme, OPD facilities were extended to 2.10 lakh new patients and 3.41 lakh follow-up patients.","2. 645 camps were organised under the NMHP, treating 15,069 patients.","3. The National Programme for Prevention and Control of Deafness (NPPCD) organised 6,095 camps.","4. The 60-day Tobacco-Free Youth Campaign 3.0 was organised under the National Tobacco Control Programme.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2, 3 and 4 only","1, 2 and 4 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The 6,095 camps belong to the National Oral Health Programme. NPPCD organised 1,554 camps (61,625 patients examined; 6.09 lakh treated).","Statements 1, 2 and 4: Correct. NMHP: 2.10 lakh new and 3.41 lakh follow-up OPD patients; 645 camps and 15,069 patients treated. NTCP: 60-day Tobacco-Free Youth Campaign 3.0 (₹211.95 lakh spent of ₹931.40 lakh)."],"i":"Programmes with similar names (NPPCD, NOHP, NPPCF) are easy to mix. Learn one number per programme.","s":"Chapter 2, p. 35.","hq":["राजस्थान में राष्ट्रीय स्वास्थ्य कार्यक्रमों (2025-26, दिसंबर तक) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राष्ट्रीय मानसिक स्वास्थ्य कार्यक्रम के अंतर्गत 2.10 लाख नए रोगियों और 3.41 लाख अनुवर्ती रोगियों तक OPD सुविधाएँ पहुँचाई गईं।","2. NMHP के अंतर्गत 645 शिविर आयोजित हुए, जिनमें 15,069 रोगियों का उपचार हुआ।","3. बधिरता की रोकथाम एवं नियंत्रण हेतु राष्ट्रीय कार्यक्रम (NPPCD) ने 6,095 शिविर आयोजित किए।","4. राष्ट्रीय तंबाकू नियंत्रण कार्यक्रम के अंतर्गत 60 दिन का तंबाकू-मुक्त युवा अभियान 3.0 आयोजित हुआ।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2, 3 और 4","केवल 1, 2 और 4","1, 2, 3 और 4"],"he":["कथन 3: गलत। 6,095 शिविर राष्ट्रीय मुख स्वास्थ्य कार्यक्रम के हैं। NPPCD ने 1,554 शिविर आयोजित किए (61,625 रोगियों की जाँच; 6.09 लाख का उपचार)।","कथन 1, 2 और 4: सही। NMHP: 2.10 लाख नए और 3.41 लाख अनुवर्ती OPD रोगी; 645 शिविर और 15,069 रोगियों का उपचार। NTCP: 60 दिन का तंबाकू-मुक्त युवा अभियान 3.0 (₹931.40 लाख में से ₹211.95 लाख व्यय)।"],"hi":"मिलते-जुलते नाम वाले कार्यक्रम (NPPCD, NOHP, NPPCF) आसानी से गड्डमड्ड हो जाते हैं। प्रत्येक कार्यक्रम के लिए एक संख्या याद रखें।","hs":"अध्याय 2, पृ. 35."}],"3":[{"n":1,"t":"Multi-statement","g":"RAS + UPSC","ans":2,"q":["Consider the following statements regarding the Gross Enrolment Ratio (GER) in Rajasthan in 2024-25 compared with 2023-24 (UDISE+):","1. Primary GER decreased by 6.8 percentage points.","2. Upper primary GER increased by 1.2 percentage points.","3. Higher secondary GER increased by 4.1 percentage points.","4. Secondary GER decreased compared with 2023-24.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 2 and 3 only","1, 2, 3 and 4"],"e":["Statement 1: Correct. Primary GER fell by 6.8 points (95.1 to 88.3).","Statement 2: Correct. Upper primary GER rose by 1.2 points (90.9 to 92.1).","Statement 3: Correct. Higher secondary GER rose by 4.1 points (62.0 to 66.1).","Statement 4: Incorrect. Secondary GER rose from 80.2 to 82.2. Elementary GER (classes 1-8) fell from 93.6 to 89.7."],"i":"Only primary (and hence elementary) GER fell; the three later levels rose. GER can exceed 100 because it counts all enrolled children, whatever their age.","s":"Chapter 3, p. 46; Table 3.1.","hq":["राजस्थान में 2023-24 की तुलना में 2024-25 में सकल नामांकन अनुपात (GER) (UDISE+) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. प्राथमिक GER में 6.8 प्रतिशत अंकों की कमी आई।","2. उच्च प्राथमिक GER में 1.2 प्रतिशत अंकों की वृद्धि हुई।","3. उच्चतर माध्यमिक GER में 4.1 प्रतिशत अंकों की वृद्धि हुई।","4. 2023-24 की तुलना में माध्यमिक GER घटा।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","केवल 1, 2 और 3","1, 2, 3 और 4"],"he":["कथन 1: सही। प्राथमिक GER 6.8 अंक गिरा (95.1 से 88.3)।","कथन 2: सही। उच्च प्राथमिक GER 1.2 अंक बढ़ा (90.9 से 92.1)।","कथन 3: सही। उच्चतर माध्यमिक GER 4.1 अंक बढ़ा (62.0 से 66.1)।","कथन 4: गलत। माध्यमिक GER 80.2 से बढ़कर 82.2 हुआ। प्रारंभिक (कक्षा 1-8) GER 93.6 से घटकर 89.7 हुआ।"],"hi":"केवल प्राथमिक (और इसलिए प्रारंभिक) GER गिरा; आगे के तीनों स्तरों में वृद्धि हुई। GER 100 से अधिक हो सकता है क्योंकि यह आयु की परवाह किए बिना सभी नामांकित बच्चों को गिनता है।","hs":"अध्याय 3, पृ. 46; तालिका 3.1."},{"n":2,"t":"Match the following","g":"UPSC","ans":0,"q":["Match the education indicator (List I) with its definition (List II), as given in the Economic Review, and select the correct answer using the code below.","A. Gross Enrolment Ratio","B. Transition rate","C. Retention rate","D. Dropout rate","1. Share of students moving from the last grade of one level to the first grade of the next","2. Total enrolment at a level, whatever the age, as a percentage of the official age-group population","3. Percentage of a first-grade cohort expected to reach the last grade of the level","4. Share of a cohort no longer enrolled at any grade in the following year"],"o":["A-2, B-1, C-3, D-4","A-1, B-2, C-3, D-4","A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4"],"e":["GER: total enrolment at a level, regardless of age, as a percentage of the population of the official age-group for that level.","Transition rate: proportion of students moving from the final grade of one level to the first grade of the next.","Retention rate: percentage of a first-grade cohort expected to reach the last grade of the level.","Dropout rate: proportion of a cohort in a level that is no longer enrolled at any grade the following year."],"i":"UPSC often tests the precise meaning of education indicators. GER is not a measure of age-appropriate enrolment (that is NER).","s":"Chapter 3, p. 47 (footnotes).","m":[1,4,4],"h":["List I","List II"],"hq":["शिक्षा संकेतक (सूची I) का उसकी परिभाषा (सूची II) से, जैसा आर्थिक समीक्षा में दिया गया है, मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. सकल नामांकन अनुपात","B. संक्रमण दर","C. प्रतिधारण दर","D. ड्रॉपआउट दर","1. एक स्तर की अंतिम कक्षा से अगले स्तर की प्रथम कक्षा में जाने वाले विद्यार्थियों का हिस्सा","2. किसी स्तर पर आयु की परवाह किए बिना कुल नामांकन, उस स्तर की आधिकारिक आयु-वर्ग की जनसंख्या के प्रतिशत के रूप में","3. प्रथम कक्षा के समूह का वह प्रतिशत जिसके उस स्तर की अंतिम कक्षा तक पहुँचने की अपेक्षा है","4. समूह का वह हिस्सा जो अगले वर्ष किसी भी कक्षा में नामांकित नहीं रहता"],"ho":["A-2, B-1, C-3, D-4","A-1, B-2, C-3, D-4","A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4"],"he":["GER: किसी स्तर पर आयु की परवाह किए बिना कुल नामांकन, उस स्तर के आधिकारिक आयु-वर्ग की जनसंख्या के प्रतिशत के रूप में।","संक्रमण दर: एक स्तर की अंतिम कक्षा से अगले स्तर की प्रथम कक्षा में जाने वाले विद्यार्थियों का अनुपात।","प्रतिधारण दर: प्रथम कक्षा के समूह का वह प्रतिशत जिसके उस स्तर की अंतिम कक्षा तक पहुँचने की अपेक्षा है।","ड्रॉपआउट दर: किसी स्तर में समूह का वह अनुपात जो अगले वर्ष किसी भी कक्षा में नामांकित नहीं है।"],"hi":"UPSC अक्सर शिक्षा संकेतकों के सटीक अर्थ परखता है। GER आयु-उपयुक्त नामांकन का माप नहीं है (वह NER है)।","hs":"अध्याय 3, पृ. 47 (पाद-टिप्पणी)."},{"n":3,"t":"Incorrect statement","g":"RAS + UPSC","ans":3,"q":["Which of the following statements regarding transition and dropout rates in Rajasthan (2023-24 to 2024-25) is NOT correct?"],"o":["Transition from Primary to Upper Primary (class 5 to 6) rose from 90.7 to 93.8.","Transition from Upper Primary to Secondary (class 8 to 9) rose from 87.6 to 90.2.","Transition from Secondary to Higher Secondary (class 10 to 11) rose from 82.6 to 88.2.","The dropout rate at the primary level increased from 3.6 to 7.6."],"e":["The primary dropout rate fell from 7.6 (2023-24) to 3.6 (2024-25), so (d) reverses the direction.","Other dropout rates also fell: upper primary 6.8 to 3.6 and secondary 11.1 to 7.7. The secondary level still has the highest dropout rate."],"i":"Reversed year order is a simple but effective trap. Check which year each number belongs to.","s":"Chapter 3, p. 47; Tables 3.3 and 3.5.","hq":["राजस्थान में संक्रमण और ड्रॉपआउट दरों (2023-24 से 2024-25) के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["प्राथमिक से उच्च प्राथमिक (कक्षा 5 से 6) में संक्रमण 90.7 से बढ़कर 93.8 हो गया।","उच्च प्राथमिक से माध्यमिक (कक्षा 8 से 9) में संक्रमण 87.6 से बढ़कर 90.2 हो गया।","माध्यमिक से उच्चतर माध्यमिक (कक्षा 10 से 11) में संक्रमण 82.6 से बढ़कर 88.2 हो गया।","प्राथमिक स्तर पर ड्रॉपआउट दर 3.6 से बढ़कर 7.6 हो गई।"],"he":["प्राथमिक ड्रॉपआउट दर 7.6 (2023-24) से घटकर 3.6 (2024-25) हो गई, इसलिए (d) दिशा को उलट देता है।","अन्य ड्रॉपआउट दरें भी घटीं: उच्च प्राथमिक 6.8 से 3.6 और माध्यमिक 11.1 से 7.7। माध्यमिक स्तर पर अब भी सबसे अधिक ड्रॉपआउट दर है।"],"hi":"वर्ष-क्रम का उलटना सरल लेकिन प्रभावी जाल है। जाँचें कि प्रत्येक संख्या किस वर्ष की है।","hs":"अध्याय 3, पृ. 47; तालिका 3.3 और 3.5."},{"n":4,"t":"Analytical","g":"UPSC","ans":1,"q":["Rajasthan's primary-level GER fell from 95.1 (2023-24) to 88.3 (2024-25), while the primary dropout rate fell from 7.6 to 3.6. Which is the most valid interpretation?"],"o":["The fall in GER must be due to higher dropout.","The two indicators measure different things. GER compares enrolment (of any age) with the official-age population, so it can fall for reasons other than dropout.","GER cannot fall when dropout declines.","The fall in GER shows that retention has improved."],"e":["GER's numerator counts all enrolled children irrespective of age, and its denominator is the official-age population. So changes in over-age or under-age enrolment, or in population estimates, can move GER without any change in dropout.","The Review notes the GER fall but does not explain it. A dropout rate measures whether enrolled children leave school the next year; it does not measure how many children of the age-group are enrolled."],"i":"UPSC likes interpretation questions where two indicators seem to conflict. Go back to the definitions.","s":"Chapter 3, pp. 46-47; Tables 3.1, 3.5.","hq":["राजस्थान का प्राथमिक स्तर का GER 95.1 (2023-24) से घटकर 88.3 (2024-25) हो गया, जबकि प्राथमिक ड्रॉपआउट दर 7.6 से घटकर 3.6 हो गई। सबसे उपयुक्त व्याख्या कौन-सी है?"],"ho":["GER में गिरावट अधिक ड्रॉपआउट के कारण ही होगी।","दोनों संकेतक अलग-अलग चीज़ें मापते हैं। GER आधिकारिक आयु की जनसंख्या की तुलना में (किसी भी आयु के) नामांकन की तुलना करता है, इसलिए यह ड्रॉपआउट के अलावा अन्य कारणों से भी गिर सकता है।","ड्रॉपआउट घटने पर GER नहीं गिर सकता।","GER में गिरावट दर्शाती है कि प्रतिधारण में सुधार हुआ है।"],"he":["GER के अंश में आयु की परवाह किए बिना सभी नामांकित बच्चे गिने जाते हैं और हर में आधिकारिक आयु की जनसंख्या होती है। इसलिए अधिक/कम आयु के नामांकन या जनसंख्या अनुमानों में बदलाव से ड्रॉपआउट में बिना किसी बदलाव के भी GER हिल सकता है।","समीक्षा GER की गिरावट का उल्लेख करती है पर उसकी व्याख्या नहीं करती। ड्रॉपआउट दर मापती है कि नामांकित बच्चे अगले वर्ष स्कूल छोड़ते हैं या नहीं; यह नहीं मापती कि आयु-वर्ग के कितने बच्चे नामांकित हैं।"],"hi":"UPSC ऐसे व्याख्यात्मक प्रश्न पसंद करता है जहाँ दो संकेतक विरोधाभासी लगते हैं। परिभाषाओं की ओर लौटें।","hs":"अध्याय 3, पृ. 46-47; तालिका 3.1, 3.5."},{"n":5,"t":"Multi-statement","g":"RAS","ans":0,"q":["Consider the following statements regarding school education in Rajasthan:","1. There are 44,934 government primary/upper primary schools and 19,950 government senior secondary schools; total government school enrolment is 72.93 lakh.","2. Of the 19,950 government senior secondary schools, 1,364 run for girls.","3. Of the 8,373 Utkrisht Vidyalayas, 6,798 are primary and 1,575 are upper primary schools.","4. Under the Utkrisht Vidyalaya Yojana, one primary/upper primary school in each Gram Panchayat is selected and developed.","Which of the statements given above is/are correct?"],"o":["1, 2 and 4 only","1 and 2 only","2 and 3 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The 8,373 Utkrisht Vidyalayas comprise 1,575 primary and 6,798 upper primary schools (the numbers are reversed in the statement).","Statements 1, 2 and 4: Correct. There are 44,934 government primary/upper primary schools and 19,950 senior secondary schools, with 72.93 lakh students. Of the senior secondary schools, 1,364 are girls' schools."],"i":"Reversed pairs of numbers (primary versus upper primary) are a standard trap.","s":"Chapter 3, pp. 44-45.","hq":["राजस्थान में विद्यालयी शिक्षा के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. 44,934 सरकारी प्राथमिक/उच्च प्राथमिक विद्यालय और 19,950 सरकारी वरिष्ठ माध्यमिक विद्यालय हैं; कुल सरकारी विद्यालय नामांकन 72.93 लाख है।","2. 19,950 सरकारी वरिष्ठ माध्यमिक विद्यालयों में से 1,364 बालिकाओं के लिए संचालित हैं।","3. 8,373 उत्कृष्ट विद्यालयों में से 6,798 प्राथमिक और 1,575 उच्च प्राथमिक विद्यालय हैं।","4. उत्कृष्ट विद्यालय योजना के अंतर्गत प्रत्येक ग्राम पंचायत में एक प्राथमिक/उच्च प्राथमिक विद्यालय चुनकर विकसित किया जाता है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 4","केवल 1 और 2","केवल 2 और 3","1, 2, 3 और 4"],"he":["कथन 3: गलत। 8,373 उत्कृष्ट विद्यालयों में 1,575 प्राथमिक और 6,798 उच्च प्राथमिक विद्यालय हैं (कथन में संख्याएँ उलटी हैं)।","कथन 1, 2 और 4: सही। 44,934 सरकारी प्राथमिक/उच्च प्राथमिक विद्यालय और 19,950 वरिष्ठ माध्यमिक विद्यालय हैं, जिनमें 72.93 लाख विद्यार्थी हैं। वरिष्ठ माध्यमिक विद्यालयों में से 1,364 बालिका विद्यालय हैं।"],"hi":"संख्याओं के उलटे युग्म (प्राथमिक बनाम उच्च प्राथमिक) एक मानक जाल हैं।","hs":"अध्याय 3, पृ. 44-45."},{"n":6,"t":"Data-based","g":"RAS + UPSC","ans":2,"q":["In 2025-26, government secondary education in Rajasthan has 50.22 lakh students and 2.82 lakh teachers. The student-teacher ratio is closest to:"],"o":["11:1","15:1","18:1","30:1"],"e":["50.22 ÷ 2.82 ≈ 17.8, which the Review reports as 18:1. For primary, 22.72 lakh ÷ 1.69 lakh ≈ 13:1.","The Review notes both are better than the NEP 2020 recommendation of less than 30:1. Table 3.2 (UDISE+, 2024-25) uses a different basis: PTR 18 at primary and 11 at secondary (classes 9-10)."],"i":"Do not mix the government-school ratios (13:1, 18:1) with the UDISE+ PTR table (18, 12, 11, 15). They use different bases.","s":"Chapter 3, p. 46; Table 3.2.","hq":["2025-26 में राजस्थान की सरकारी माध्यमिक शिक्षा में 50.22 लाख विद्यार्थी और 2.82 लाख शिक्षक हैं। विद्यार्थी-शिक्षक अनुपात लगभग कितना है?"],"ho":["11:1","15:1","18:1","30:1"],"he":["50.22 ÷ 2.82 ≈ 17.8, जिसे समीक्षा 18:1 बताती है। प्राथमिक के लिए 22.72 लाख ÷ 1.69 लाख ≈ 13:1।","समीक्षा ध्यान दिलाती है कि दोनों NEP 2020 की 30:1 से कम की अनुशंसा से बेहतर हैं। तालिका 3.2 (UDISE+, 2024-25) भिन्न आधार का उपयोग करती है: प्राथमिक पर PTR 18 और माध्यमिक (कक्षा 9-10) पर 11।"],"hi":"सरकारी विद्यालयों के अनुपात (13:1, 18:1) को UDISE+ PTR तालिका (18, 12, 11, 15) से न मिलाएँ। उनके आधार भिन्न हैं।","hs":"अध्याय 3, पृ. 46; तालिका 3.2."},{"n":7,"t":"Multi-statement","g":"RAS + UPSC","ans":3,"q":["Consider the following statements regarding the Samagra Shiksha scheme in Rajasthan:","1. It integrates Sarva Shiksha Abhiyan, Rashtriya Madhyamik Shiksha Abhiyan and Teacher Education.","2. It is a Centrally Sponsored Scheme with a fund-sharing pattern of 60:40 between the Centre and the State.","3. In Rajasthan it is implemented through the Rajasthan Council of School Education as a single State Implementation Society.","4. It covers school education only from pre-primary to Class 10.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 3 and 4 only","1, 2 and 3 only"],"e":["Statement 4: Incorrect. Samagra Shiksha covers school education from pre-school to Class 12 (senior secondary), not just up to Class 10.","Statements 1-3: Correct. It integrates Sarva Shiksha Abhiyan, Rashtriya Madhyamik Shiksha Abhiyan and Teacher Education; it is a Centrally Sponsored Scheme with 60:40 Centre-State funding; in Rajasthan it runs through the Rajasthan Council of School Education as the single State Implementation Society."],"i":"Know which earlier schemes were merged (SSA, RMSA, Teacher Education) and the funding ratio.","s":"Chapter 3, p. 48.","hq":["राजस्थान में समग्र शिक्षा योजना के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. यह सर्व शिक्षा अभियान, राष्ट्रीय माध्यमिक शिक्षा अभियान और शिक्षक शिक्षा को एकीकृत करती है।","2. यह केंद्र प्रायोजित योजना है, जिसमें केंद्र और राज्य के बीच वित्तपोषण 60:40 का है।","3. राजस्थान में यह राजस्थान स्कूल शिक्षा परिषद के माध्यम से एकल राज्य कार्यान्वयन समिति के रूप में लागू है।","4. यह विद्यालयी शिक्षा को केवल पूर्व-प्राथमिक से कक्षा 10 तक कवर करती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","केवल 1, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 4: गलत। समग्र शिक्षा विद्यालयी शिक्षा को पूर्व-विद्यालय से कक्षा 12 (वरिष्ठ माध्यमिक) तक कवर करती है, केवल कक्षा 10 तक नहीं।","कथन 1-3: सही। यह सर्व शिक्षा अभियान, राष्ट्रीय माध्यमिक शिक्षा अभियान और शिक्षक शिक्षा को एकीकृत करती है; यह 60:40 केंद्र-राज्य वित्तपोषण वाली केंद्र प्रायोजित योजना है; राजस्थान में यह राजस्थान स्कूल शिक्षा परिषद के माध्यम से एकल राज्य कार्यान्वयन समिति के रूप में चलती है।"],"hi":"जानिए कि कौन-सी पूर्ववर्ती योजनाएँ मिलाई गईं (SSA, RMSA, शिक्षक शिक्षा) और वित्तपोषण अनुपात क्या है।","hs":"अध्याय 3, पृ. 48."},{"n":8,"t":"Single best answer","g":"RAS","ans":1,"q":["Which one of the following statements regarding Early Childhood Care and Education (ECCE) in Rajasthan is correct?"],"o":["Functionally integrated Anganwadi Centres lie within 1 km of a government school.","42,554 of the 62,000 Anganwadi Centres are integrated with government schools.","11.90 lakh children aged 3-6 years attend pre-school in the 42,554 integrated Anganwadi Centres.","962 Balvatikas operate in PM SHRI schools."],"e":["Of 62,000 AWCs, 42,554 are integrated: 22,746 physically integrated (on school premises) and 19,808 functionally integrated (within a 700 metre radius).","(c) The 11.90 lakh children attend pre-school in all 62,000 AWCs. (d) 962 Balvatikas are in Mahatma Gandhi (English Medium) schools; PM SHRI schools have 629."],"i":"The 700 metre radius and the physical versus functional distinction are the examiner's favourites here.","s":"Chapter 3, p. 48.","hq":["राजस्थान में प्रारंभिक बाल्यावस्था देखभाल एवं शिक्षा (ECCE) के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["कार्यात्मक रूप से एकीकृत आँगनवाड़ी केंद्र सरकारी विद्यालय से 1 किमी के भीतर स्थित हैं।","62,000 आँगनवाड़ी केंद्रों में से 42,554 सरकारी विद्यालयों से एकीकृत हैं।","42,554 एकीकृत आँगनवाड़ी केंद्रों में 3-6 वर्ष आयु के 11.90 लाख बच्चे पूर्व-विद्यालय में आते हैं।","PM SHRI विद्यालयों में 962 बालवाटिकाएँ संचालित हैं।"],"he":["62,000 AWC में से 42,554 एकीकृत हैं: 22,746 भौतिक रूप से एकीकृत (विद्यालय परिसर में) और 19,808 कार्यात्मक रूप से एकीकृत (700 मीटर की त्रिज्या के भीतर)।","(c) 11.90 लाख बच्चे सभी 62,000 AWC में पूर्व-विद्यालय में आते हैं। (d) 962 बालवाटिकाएँ महात्मा गांधी (अंग्रेज़ी माध्यम) विद्यालयों में हैं; PM SHRI विद्यालयों में 629 हैं।"],"hi":"700 मीटर की त्रिज्या और भौतिक बनाम कार्यात्मक एकीकरण का भेद परीक्षक का पसंदीदा है।","hs":"अध्याय 3, पृ. 48."},{"n":9,"t":"Match the following","g":"RAS","ans":2,"q":["Match the school scheme (List I) with its feature (List II) and select the correct answer using the code below.","A. Utkrisht Vidyalaya Yojana","B. Mahatma Gandhi Government Schools (English Medium)","C. Swami Vivekananda Government Model Schools","D. Netaji Subhash Chandra Bose Residential Schools","1. CBSE-affiliated; at least 55% of seats reserved for girls; in educationally backward blocks","2. One primary/upper primary school in each Gram Panchayat developed as a model","3. English-medium government schools (3,737 schools, 6.84 lakh students)","4. Includes Mewat Balika residential schools and schools/hostels for Beghar Besahara and orphan children"],"o":["A-3, B-2, C-1, D-4","A-2, B-1, C-3, D-4","A-2, B-3, C-1, D-4","A-1, B-3, C-2, D-4"],"e":["Utkrisht Vidyalaya Yojana: one primary/upper primary school in each Gram Panchayat is developed (8,373 operating).","Mahatma Gandhi Government Schools (English Medium): 3,737 schools with 6.84 lakh students in 2025-26.","Swami Vivekananda Government Model Schools: CBSE-affiliated, NCERT curriculum, at least 55% seats for girls; 134 schools in 134 educationally backward blocks across 27 districts.","Netaji Subhash Chandra Bose Residential Schools: 41 institutions (10 Mewat Balika Residential Schools, 20 Girls Hostels, 11 for Beghar Besahara and orphan children)."],"i":"Learn each school type with its defining feature (board, medium, target group).","s":"Chapter 3, pp. 45, 49.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (विद्यालय योजना) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. उत्कृष्ट विद्यालय योजना","B. महात्मा गांधी राजकीय विद्यालय (अंग्रेज़ी माध्यम)","C. स्वामी विवेकानंद राजकीय मॉडल विद्यालय","D. नेताजी सुभाष चंद्र बोस आवासीय विद्यालय","1. CBSE से संबद्ध; कम से कम 55% सीटें बालिकाओं के लिए आरक्षित; शैक्षणिक रूप से पिछड़े ब्लॉकों में","2. प्रत्येक ग्राम पंचायत में एक प्राथमिक/उच्च प्राथमिक विद्यालय मॉडल के रूप में विकसित","3. अंग्रेज़ी माध्यम के सरकारी विद्यालय (3,737 विद्यालय, 6.84 लाख विद्यार्थी)","4. मेवात बालिका आवासीय विद्यालय और बेघर बेसहारा तथा अनाथ बच्चों के लिए विद्यालय/छात्रावास शामिल"],"ho":["A-3, B-2, C-1, D-4","A-2, B-1, C-3, D-4","A-2, B-3, C-1, D-4","A-1, B-3, C-2, D-4"],"he":["उत्कृष्ट विद्यालय योजना: प्रत्येक ग्राम पंचायत में एक प्राथमिक/उच्च प्राथमिक विद्यालय विकसित किया जाता है (8,373 संचालित)।","महात्मा गांधी राजकीय विद्यालय (अंग्रेज़ी माध्यम): 2025-26 में 3,737 विद्यालय और 6.84 लाख विद्यार्थी।","स्वामी विवेकानंद राजकीय मॉडल विद्यालय: CBSE से संबद्ध, NCERT पाठ्यक्रम, कम से कम 55% सीटें बालिकाओं के लिए; 27 जिलों के 134 शैक्षणिक रूप से पिछड़े ब्लॉकों में 134 विद्यालय।","नेताजी सुभाष चंद्र बोस आवासीय विद्यालय: 41 संस्थाएँ (10 मेवात बालिका आवासीय विद्यालय, 20 बालिका छात्रावास, 11 बेघर बेसहारा और अनाथ बच्चों के लिए)।"],"hi":"प्रत्येक प्रकार के विद्यालय को उसकी परिभाषित विशेषता (बोर्ड, माध्यम, लक्षित समूह) के साथ सीखें।","hs":"अध्याय 3, पृ. 45, 49."},{"n":10,"t":"Assertion and Reason","g":"UPSC","ans":0,"q":["Assertion (A): Rajasthan's student-teacher ratios in government schools meet the benchmark recommended by the National Education Policy 2020.","Reason (R): The NEP 2020 recommends a ratio of less than 30:1, whereas Rajasthan's government school ratios are 13:1 (primary) and 18:1 (secondary)."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["The Review states that both ratios are better than the NEP's recommended ratio of less than 30:1.","R supplies the benchmark and the state's figures, which is exactly why A holds."],"i":"Policy benchmarks (here, 30:1) are useful for statement-based and assertion questions.","s":"Chapter 3, p. 46.","hq":["अभिकथन (A): राजस्थान के सरकारी विद्यालयों में विद्यार्थी-शिक्षक अनुपात राष्ट्रीय शिक्षा नीति 2020 द्वारा अनुशंसित मानक को पूरा करते हैं।","कारण (R): NEP 2020 30:1 से कम के अनुपात की अनुशंसा करती है, जबकि राजस्थान के सरकारी विद्यालयों के अनुपात 13:1 (प्राथमिक) और 18:1 (माध्यमिक) हैं।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["समीक्षा कहती है कि दोनों अनुपात NEP के अनुशंसित 30:1 से कम के अनुपात से बेहतर हैं।","R मानक और राज्य के आँकड़े देता है, और ठीक इसी कारण A सही है।"],"hi":"नीतिगत मानक (यहाँ 30:1) कथन-आधारित और अभिकथन प्रश्नों के लिए उपयोगी हैं।","hs":"अध्याय 3, पृ. 46."},{"n":11,"t":"Single best answer","g":"RAS","ans":3,"q":["Which one of the following statements regarding free provisions for school students in Rajasthan is correct?"],"o":["Free bicycles are given to all school girls of Class 11.","4.05 crore books were distributed free of cost to 8 lakh students in 2025-26.","Free textbooks are given only to students whose parents pay income tax.","Free textbooks are given to all students of classes 1 to 8 in government schools and all girls of classes 9 to 12."],"e":["Free textbooks also go to SC/ST students and students whose parents do not pay income tax. In 2025-26, 4.05 crore books reached 80 lakh students through the Rajasthan State Text Book Board.","Free bicycles are for girls of Class 9 in government schools (3.25 lakh in 2024-25; order for 3.34 lakh in 2025-26)."],"i":"Eligibility conditions (class, gender, category, income-tax status) are classic fact-picks.","s":"Chapter 3, p. 45.","hq":["राजस्थान में विद्यालयी विद्यार्थियों के लिए निःशुल्क प्रावधानों के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["कक्षा 11 की सभी विद्यालयी बालिकाओं को निःशुल्क साइकिलें दी जाती हैं।","2025-26 में 8 लाख विद्यार्थियों को 4.05 करोड़ पुस्तकें निःशुल्क वितरित की गईं।","निःशुल्क पाठ्यपुस्तकें केवल उन विद्यार्थियों को दी जाती हैं जिनके अभिभावक आयकर देते हैं।","सरकारी विद्यालयों में कक्षा 1 से 8 के सभी विद्यार्थियों और कक्षा 9 से 12 की सभी बालिकाओं को निःशुल्क पाठ्यपुस्तकें दी जाती हैं।"],"he":["निःशुल्क पाठ्यपुस्तकें SC/ST विद्यार्थियों और उन विद्यार्थियों को भी मिलती हैं जिनके अभिभावक आयकर नहीं देते। 2025-26 में राजस्थान राज्य पाठ्यपुस्तक मंडल के माध्यम से 80 लाख विद्यार्थियों तक 4.05 करोड़ पुस्तकें पहुँचीं।","निःशुल्क साइकिलें सरकारी विद्यालयों की कक्षा 9 की बालिकाओं के लिए हैं (2024-25 में 3.25 लाख; 2025-26 में 3.34 लाख का ऑर्डर)।"],"hi":"पात्रता की शर्तें (कक्षा, लिंग, श्रेणी, आयकर स्थिति) क्लासिक तथ्य-चयन प्रश्न हैं।","hs":"अध्याय 3, पृ. 45."},{"n":12,"t":"Direct factual","g":"RAS","ans":1,"q":["Under the Lado Protsahan Scheme, up to ₹1.50 lakh is given to the parents/guardians of each beneficiary girl in seven instalments. The 7th instalment is given by the:"],"o":["Department of Women and Child Development","Higher Education Department","School Education Department","Social Justice and Empowerment Department"],"e":["The Review states that the 3rd to 6th instalments are given by the School Education Department and the 7th by the Higher Education Department.","The Executive Summary reports 3.27 lakh girl children and ₹217.63 crore for the whole scheme, whereas the chapter's ₹18.09 crore relates to the School Education component (see data flags)."],"i":"Know which department pays which stage of a multi-instalment scheme.","s":"Chapter 3, p. 45; Executive Summary, p. xvi.","hq":["लाडो प्रोत्साहन योजना के अंतर्गत प्रत्येक लाभार्थी बालिका के माता-पिता/अभिभावकों को सात किस्तों में ₹1.50 लाख तक दिए जाते हैं। 7वीं किस्त किसके द्वारा दी जाती है?"],"ho":["महिला एवं बाल विकास विभाग","उच्च शिक्षा विभाग","स्कूल शिक्षा विभाग","सामाजिक न्याय एवं अधिकारिता विभाग"],"he":["समीक्षा के अनुसार 3 से 6 किस्तें स्कूल शिक्षा विभाग देता है और 7वीं किस्त उच्च शिक्षा विभाग देता है।","कार्यकारी सारांश पूरी योजना के लिए 3.27 लाख बालिकाएँ और ₹217.63 करोड़ बताता है, जबकि अध्याय का ₹18.09 करोड़ स्कूल शिक्षा घटक से संबंधित है (डेटा फ्लैग देखें)।"],"hi":"जानिए कि बहु-किस्त योजना के किस चरण का भुगतान कौन-सा विभाग करता है।","hs":"अध्याय 3, पृ. 45; कार्यकारी सारांश, पृ. xvi."},{"n":13,"t":"Incorrect statement","g":"RAS","ans":0,"q":["Which of the following statements regarding the Mukhya Mantri Madarsa Aadhunikikaran Scheme is NOT correct?"],"o":["The cost is shared equally between the State and Central Governments.","It provides up to ₹15 lakh for primary level Madarsas.","It provides up to ₹25 lakh for upper primary level Madarsas.","90 per cent of the cost is covered by the State Government and 10 per cent by the Madarsa Management Committee."],"e":["The scheme is funded 90:10 by the State and the Madarsa Management Committee. There is no 50:50 Centre-State sharing.","It provides computers, smart classrooms, furniture and e-learning equipment. 305 Madarsas were benefited up to December 2025. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 3: Education and the Knowledge Economy"],"i":"Funding-pattern questions are common. Compare each scheme's sharing ratio (60:40, 90:10, 90:10).","s":"Chapter 3, p. 46.","hq":["मुख्यमंत्री मदरसा आधुनिकीकरण योजना के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["लागत राज्य और केंद्र सरकारों द्वारा समान रूप से साझा की जाती है।","यह प्राथमिक स्तर के मदरसों के लिए ₹15 लाख तक प्रदान करती है।","यह उच्च प्राथमिक स्तर के मदरसों के लिए ₹25 लाख तक प्रदान करती है।","90 प्रतिशत लागत राज्य सरकार और 10 प्रतिशत मदरसा प्रबंधन समिति वहन करती है।"],"he":["योजना का वित्तपोषण राज्य और मदरसा प्रबंधन समिति द्वारा 90:10 में होता है। केंद्र-राज्य 50:50 का कोई बँटवारा नहीं है।","यह कंप्यूटर, स्मार्ट कक्षाएँ, फर्नीचर और ई-लर्निंग उपकरण उपलब्ध कराती है। दिसंबर 2025 तक 305 मदरसे लाभान्वित हुए।"],"hi":"वित्तपोषण-पैटर्न के प्रश्न आम हैं। प्रत्येक योजना के साझाकरण अनुपात की तुलना करें (60:40, 90:10, 90:10)।","hs":"अध्याय 3, पृ. 46."},{"n":14,"t":"Multi-statement","g":"RAS + UPSC","ans":2,"q":["Consider the following statements regarding the Right to Education Act implementation in Rajasthan:","1. The Right of Children to Free and Compulsory Education Act has been implemented in the State since 1 April 2010.","2. It mandates 25 per cent reservation in private schools for children from weaker and disadvantaged groups.","3. The income eligibility limit was raised from ₹2.50 lakh to ₹5 lakh in 2020-21.","4. ₹546.13 crore was approved under the annual work plan for 2024-25 for fee reimbursement to private schools.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 3 only","1, 2 and 4 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The income eligibility limit was raised from ₹1 lakh to ₹2.50 lakh in 2020-21.","Statements 1, 2 and 4: Correct. RTE has been implemented in the State since 1 April 2010. It mandates 25% reservation in private schools for weaker and disadvantaged groups. ₹546.13 crore was approved for fee reimbursement for 2024-25."],"i":"Dates, percentages and ceilings in RTE questions are frequently altered.","s":"Chapter 3, p. 50.","hq":["राजस्थान में शिक्षा का अधिकार अधिनियम के क्रियान्वयन के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. बच्चों का निःशुल्क और अनिवार्य शिक्षा का अधिकार अधिनियम राज्य में 1 अप्रैल 2010 से लागू है।","2. यह निजी विद्यालयों में कमज़ोर और वंचित वर्गों के बच्चों के लिए 25 प्रतिशत आरक्षण अनिवार्य करता है।","3. आय पात्रता सीमा 2020-21 में ₹2.50 लाख से बढ़ाकर ₹5 लाख की गई।","4. निजी विद्यालयों को शुल्क प्रतिपूर्ति हेतु वार्षिक कार्य योजना 2024-25 के अंतर्गत ₹546.13 करोड़ स्वीकृत किए गए।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 3","केवल 1, 2 और 4","1, 2, 3 और 4"],"he":["कथन 3: गलत। आय पात्रता सीमा 2020-21 में ₹1 लाख से बढ़ाकर ₹2.50 लाख की गई।","कथन 1, 2 और 4: सही। RTE राज्य में 1 अप्रैल 2010 से लागू है। यह निजी विद्यालयों में कमज़ोर और वंचित समूहों के लिए 25% आरक्षण अनिवार्य करता है। 2024-25 में शुल्क प्रतिपूर्ति हेतु ₹546.13 करोड़ स्वीकृत हुए।"],"hi":"RTE प्रश्नों में तिथियाँ, प्रतिशत और सीमाएँ प्रायः बदल दी जाती हैं।","hs":"अध्याय 3, पृ. 50."},{"n":15,"t":"Direct factual","g":"RAS","ans":3,"q":["Under the transport voucher scheme in rural areas, vouchers are given to students of classes 1-5 who live at a distance of 1 km from the school, classes 6-8 at 2 km, and girls of classes 9-10 at more than:"],"o":["2 km","3 km","4 km","5 km"],"e":["Girls of classes 9-10 in rural areas living more than 5 km from the secondary/senior secondary school get vouchers. The same applies to girls studying in urban schools more than 5 km from their home where transport is unavailable.","In 2025-26 (up to December), ₹187.72 crore was allocated and ₹11.62 crore incurred; School Management Committees issue the vouchers."],"i":"Distance thresholds (1 km, 2 km, 5 km) are easy numeric questions.","s":"Chapter 3, pp. 49-50.","hq":["ग्रामीण क्षेत्रों में परिवहन वाउचर योजना के अंतर्गत वाउचर कक्षा 1-5 के उन विद्यार्थियों को दिए जाते हैं जो विद्यालय से 1 किमी की दूरी पर रहते हैं, कक्षा 6-8 के 2 किमी पर, और कक्षा 9-10 की बालिकाओं को जो कितने से अधिक दूरी पर रहती हैं?"],"ho":["2 किमी","3 किमी","4 किमी","5 किमी"],"he":["ग्रामीण क्षेत्रों में कक्षा 9-10 की जो बालिकाएँ माध्यमिक/वरिष्ठ माध्यमिक विद्यालय से 5 किमी से अधिक दूर रहती हैं, उन्हें वाउचर मिलते हैं। यही शहरी विद्यालयों में पढ़ने वाली उन बालिकाओं पर लागू होता है जिनका घर विद्यालय से 5 किमी से अधिक दूर है और जहाँ परिवहन उपलब्ध नहीं है।","2025-26 (दिसंबर तक) में ₹187.72 करोड़ आवंटित हुए और ₹11.62 करोड़ व्यय हुए; वाउचर विद्यालय प्रबंधन समितियाँ जारी करती हैं।"],"hi":"दूरी की सीमाएँ (1 किमी, 2 किमी, 5 किमी) सरल संख्यात्मक प्रश्न हैं।","hs":"अध्याय 3, पृ. 49-50."},{"n":16,"t":"Data-based","g":"RAS + UPSC","ans":1,"q":["In 2025-26, ₹600 per student was transferred through DBT for uniforms to 24.8 lakh students of classes 1-8 up to December 2025. Assuming every student received ₹600, the approximate amount transferred is:"],"o":["₹14.88 crore","₹148.8 crore","₹198.4 crore","₹330.06 crore"],"e":["24.8 lakh × ₹600 = ₹1,488 million = ₹148.8 crore.","₹198.4 crore would result from using the older ₹800 rate. In 2024-25, ₹800 per student (uniforms and school bags) reached 41.26 lakh students at a cost of ₹330.06 crore (41.26 lakh × ₹800 ≈ ₹330.08 crore, a consistency check)."],"i":"Watch lakh-crore conversions: 1 crore = 100 lakh. A rate change between years is the usual trap.","s":"Chapter 3, p. 50.","hq":["2025-26 में कक्षा 1-8 के 24.8 लाख विद्यार्थियों को दिसंबर 2025 तक DBT के माध्यम से गणवेश हेतु ₹600 प्रति विद्यार्थी हस्तांतरित किए गए। यह मानते हुए कि प्रत्येक विद्यार्थी को ₹600 मिले, हस्तांतरित राशि लगभग कितनी है?"],"ho":["₹14.88 करोड़","₹148.8 करोड़","₹198.4 करोड़","₹330.06 करोड़"],"he":["24.8 लाख × ₹600 = ₹1,488 मिलियन = ₹148.8 करोड़।","₹198.4 करोड़ पुरानी ₹800 की दर के उपयोग से आता। 2024-25 में ₹800 प्रति विद्यार्थी (गणवेश और स्कूल बैग) 41.26 लाख विद्यार्थियों तक ₹330.06 करोड़ की लागत से पहुँचा (41.26 लाख × ₹800 ≈ ₹330.08 करोड़, संगति जाँच)।"],"hi":"लाख-करोड़ रूपांतरण पर ध्यान दें: 1 करोड़ = 100 लाख। वर्षों के बीच दर में बदलाव सामान्य जाल है।","hs":"अध्याय 3, पृ. 50."},{"n":17,"t":"Single best answer","g":"RAS + UPSC","ans":0,"q":["Which one of the following statements regarding the PM SHRI (Pradhan Mantri Schools for Rising India) scheme in Rajasthan is correct?"],"o":["The scheme was initiated in 2022 and is implemented in 639 schools of the State.","About 2.96 crore students study in these schools.","Three schools are selected from each block/ULB.","All PM SHRI schools in Rajasthan are secondary schools."],"e":["PM SHRI was initiated in 2022. Two schools (one elementary, one secondary) are selected from each block/ULB through an online portal. About 2.96 lakh students study in these schools.","These schools are developed as green schools (solar panels, LED lighting, nutrition gardens with natural farming, waste management, water conservation). ₹51.81 crore was spent against ₹434.65 crore provision (2025-26, up to December)."],"i":"Lakh versus crore, and two versus three schools per block, are the usual distractors.","s":"Chapter 3, pp. 50-51.","hq":["राजस्थान में PM SHRI (प्रधानमंत्री स्कूल्स फॉर राइजिंग इंडिया) योजना के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["योजना 2022 में शुरू हुई और राज्य के 639 विद्यालयों में लागू है।","इन विद्यालयों में लगभग 2.96 करोड़ विद्यार्थी पढ़ते हैं।","प्रत्येक ब्लॉक/ULB से तीन विद्यालय चुने जाते हैं।","राजस्थान में सभी PM SHRI विद्यालय माध्यमिक विद्यालय हैं।"],"he":["PM SHRI 2022 में शुरू हुई। प्रत्येक ब्लॉक/ULB से ऑनलाइन पोर्टल के माध्यम से दो विद्यालय (एक प्रारंभिक, एक माध्यमिक) चुने जाते हैं। इन विद्यालयों में लगभग 2.96 लाख विद्यार्थी पढ़ते हैं।","इन विद्यालयों को हरित विद्यालयों के रूप में विकसित किया जाता है (सोलर पैनल, LED प्रकाश, प्राकृतिक खेती के साथ पोषण उद्यान, अपशिष्ट प्रबंधन, जल संरक्षण)। 2025-26 (दिसंबर तक) ₹434.65 करोड़ के प्रावधान के विरुद्ध ₹51.81 करोड़ व्यय हुए।"],"hi":"लाख बनाम करोड़ और प्रति ब्लॉक दो बनाम तीन विद्यालय सामान्य भ्रामक विकल्प हैं।","hs":"अध्याय 3, पृ. 50-51."},{"n":18,"t":"Multi-statement","g":"UPSC","ans":1,"q":["Consider the following statements regarding the implementation of the National Education Policy (NEP) 2020 in Rajasthan:","1. NEP 2020 was launched on 29 July 2020.","2. SARTHAQ outlines 297 tasks across 27 chapters.","3. Of these, 202 tasks are assigned to the States.","4. Rajasthan had completed all 202 tasks assigned to States by December 2025.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","1, 2 and 3 only","2 and 4 only","1, 2, 3 and 4"],"e":["Statement 4: Incorrect. Rajasthan had completed 73 of the tasks by December 2025, not all 202.","Statements 1-3: Correct. NEP 2020 was launched on 29 July 2020. The Ministry of Education's SARTHAQ outlines 297 tasks across 27 chapters, of which 202 tasks are assigned to states. Rajasthan coordinates the tasks through six committees, with district committees chaired by District Collectors."],"i":"Know the numbers 297, 27, 202 and 73 as a set.","s":"Chapter 3, p. 51.","hq":["राजस्थान में राष्ट्रीय शिक्षा नीति (NEP) 2020 के क्रियान्वयन के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. NEP 2020 को 29 जुलाई 2020 को शुरू किया गया।","2. SARTHAQ 27 अध्यायों में 297 कार्यों की रूपरेखा देता है।","3. इनमें से 202 कार्य राज्यों को सौंपे गए हैं।","4. राजस्थान ने दिसंबर 2025 तक राज्यों को सौंपे गए सभी 202 कार्य पूरे कर लिए थे।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 1, 2 और 3","केवल 2 और 4","1, 2, 3 और 4"],"he":["कथन 4: गलत। राजस्थान ने दिसंबर 2025 तक 73 कार्य पूरे किए थे, सभी 202 नहीं।","कथन 1-3: सही। NEP 2020 29 जुलाई 2020 को शुरू हुई। शिक्षा मंत्रालय का SARTHAQ 27 अध्यायों में 297 कार्यों की रूपरेखा देता है, जिनमें से 202 कार्य राज्यों को सौंपे गए हैं। राजस्थान छह समितियों के माध्यम से कार्यों का समन्वय करता है, जिनमें जिला समितियों की अध्यक्षता जिला कलेक्टर करते हैं।"],"hi":"संख्याओं 297, 27, 202 और 73 को एक समूह के रूप में याद रखें।","hs":"अध्याय 3, पृ. 51."},{"n":19,"t":"Match the following","g":"RAS + UPSC","ans":3,"q":["Match the programme (List I) with its description (List II) and select the correct answer using the code below.","A. Prakhar Rajasthan 2.0","B. PRABAL","C. Nipun Rajasthan Abhiyan","D. Mega PTM","1. Foundational literacy and numeracy initiative for classes 1 and 2, launched on 30 October 2025","2. Life skills and leadership programme for classes 9-12 in government higher secondary schools","3. Reading-skills programme under MSRA","4. Parent-teacher meeting held on National Unity Day"],"o":["A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4","A-1, B-2, C-3, D-4","A-3, B-2, C-1, D-4"],"e":["Prakhar Rajasthan 2.0: reading-skills programme launched under the Mukhya Mantri Shikshit Rajasthan Abhiyan (MSRA).","PRABAL: Program to Recognize Abilities and Build up Adaptive Life Skills, for classes 9-12 in government higher secondary schools.","Nipun Rajasthan Abhiyan: initiated on 30 October 2025 to strengthen foundational literacy and numeracy in classes 1 and 2.","Mega PTM: held in all schools on 31 October 2025, National Unity Day, to share academic progress and reading status with parents."],"i":"Recent programme names and dates are likely RAS fodder; 30 and 31 October 2025 are the dates to remember. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 3: Education and the Knowledge Economy","s":"Chapter 3, p. 49.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (कार्यक्रम) का सूची II (विवरण) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. प्रखर राजस्थान 2.0","B. प्रबल (PRABAL)","C. निपुण राजस्थान अभियान","D. मेगा PTM","1. कक्षा 1 और 2 के लिए आधारभूत साक्षरता एवं संख्या-ज्ञान की पहल, 30 अक्टूबर 2025 को शुरू","2. सरकारी उच्चतर माध्यमिक विद्यालयों में कक्षा 9-12 के लिए जीवन कौशल और नेतृत्व कार्यक्रम","3. MSRA के अंतर्गत पठन कौशल कार्यक्रम","4. राष्ट्रीय एकता दिवस पर आयोजित अभिभावक-शिक्षक बैठक"],"ho":["A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4","A-1, B-2, C-3, D-4","A-3, B-2, C-1, D-4"],"he":["प्रखर राजस्थान 2.0: मुख्यमंत्री शिक्षित राजस्थान अभियान (MSRA) के अंतर्गत शुरू पठन कौशल कार्यक्रम।","प्रबल (PRABAL): Program to Recognize Abilities and Build up Adaptive Life Skills, सरकारी उच्चतर माध्यमिक विद्यालयों में कक्षा 9-12 के लिए।","निपुण राजस्थान अभियान: कक्षा 1 और 2 में आधारभूत साक्षरता और संख्या-ज्ञान को सुदृढ़ करने हेतु 30 अक्टूबर 2025 को शुरू।","मेगा PTM: 31 अक्टूबर 2025 को, राष्ट्रीय एकता दिवस पर, सभी विद्यालयों में अभिभावकों के साथ शैक्षणिक प्रगति और पठन स्थिति साझा करने हेतु आयोजित।"],"hi":"हाल के कार्यक्रमों के नाम और तिथियाँ RAS के संभावित प्रश्न हैं; 30 और 31 अक्टूबर 2025 की तिथियाँ याद रखें।","hs":"अध्याय 3, पृ. 49."},{"n":20,"t":"Classification","g":"RAS","ans":2,"q":["Which of the following was NOT among the activities initiated from 29 April 2025 under the Chief Minister's Educated Rajasthan Campaign (MSRA)?"],"o":["State AI-based Oral Reading Fluency (ORF) assessment","Student Attendance App","Kala Utsav art competitions","On-demand examinations (ODE) for NIOS"],"e":["The four activities started from 29 April 2025 were: AI-based ORF assessment, Student Attendance App, on-demand examinations for NIOS and digital initiatives. ORF and digital initiatives are implemented at the district level.","Kala Utsav is a separate arts festival for classes 9-12 held at district, State and national levels in 6 disciplines. MSRA aims to implement NEP 2020 (NEP Child, NEP Teacher and NEP School)."],"i":"Learn the list of MSRA activities. Items from the same chapter but a different scheme are used as distractors.","s":"Chapter 3, pp. 50-51.","hq":["29 अप्रैल 2025 से मुख्यमंत्री शिक्षित राजस्थान अभियान (MSRA) के अंतर्गत शुरू की गई गतिविधियों में निम्नलिखित में से कौन-सी शामिल नहीं थी?"],"ho":["राज्य AI-आधारित मौखिक पठन प्रवाह (ORF) आकलन","विद्यार्थी उपस्थिति ऐप","कला उत्सव कला प्रतियोगिताएँ","NIOS के लिए ऑन-डिमांड परीक्षाएँ (ODE)"],"he":["29 अप्रैल 2025 से शुरू हुई चार गतिविधियाँ थीं: AI-आधारित ORF आकलन, विद्यार्थी उपस्थिति ऐप, NIOS के लिए ऑन-डिमांड परीक्षाएँ और डिजिटल पहलें। ORF और डिजिटल पहलें जिला स्तर पर लागू हैं।","कला उत्सव एक अलग कला महोत्सव है, जो कक्षा 9-12 के लिए जिला, राज्य और राष्ट्रीय स्तर पर 6 विधाओं में होता है। MSRA का उद्देश्य NEP 2020 (NEP बाल, NEP शिक्षक और NEP विद्यालय) को लागू करना है।"],"hi":"MSRA की गतिविधियों की सूची सीखें। उसी अध्याय की, परंतु भिन्न योजना की चीज़ें भ्रामक विकल्प के रूप में प्रयुक्त होती हैं।","hs":"अध्याय 3, पृ. 50-51."},{"n":21,"t":"Direct factual","g":"RAS","ans":0,"q":["In 2025-26, Rajasthan has 364 functional Kasturba Gandhi Balika Vidyalayas (KGBVs), where priority is given to never-enrolled and dropout girls. What is the enrolment in these KGBVs?"],"o":["44,040 girls","62,433 students","3,458 girls","4.70 lakh students"],"e":["KGBVs enrol 44,040 girls.","The other options are figures from different schemes: 62,433 (Swami Vivekananda Model Schools), 3,458 (girls enrolled in Netaji Subhash Chandra Bose hostels) and 4.70 lakh (vocational education schools)."],"i":"Pick the figure for the right scheme: the chapter has several similar enrolment numbers.","s":"Chapter 3, pp. 49, 51-52.","hq":["2025-26 में राजस्थान में 364 क्रियाशील कस्तूरबा गांधी बालिका विद्यालय (KGBV) हैं, जहाँ कभी नामांकित न हुई और ड्रॉपआउट बालिकाओं को प्राथमिकता दी जाती है। इन KGBV में नामांकन कितना है?"],"ho":["44,040 बालिकाएँ","62,433 विद्यार्थी","3,458 बालिकाएँ","4.70 लाख विद्यार्थी"],"he":["KGBV में 44,040 बालिकाएँ नामांकित हैं।","अन्य विकल्प भिन्न योजनाओं के आँकड़े हैं: 62,433 (स्वामी विवेकानंद मॉडल विद्यालय), 3,458 (नेताजी सुभाष चंद्र बोस छात्रावासों में नामांकित बालिकाएँ) और 4.70 लाख (व्यावसायिक शिक्षा विद्यालय)।"],"hi":"सही योजना का आँकड़ा चुनें: अध्याय में कई मिलते-जुलते नामांकन आँकड़े हैं।","hs":"अध्याय 3, पृ. 49, 51-52."},{"n":22,"t":"Single best answer","g":"RAS + UPSC","ans":1,"q":["Which one of the following statements regarding vocational education in Rajasthan (2025-26) is correct?"],"o":["3,263 vocational schools are operated under the PM SHRI scheme.","4,019 vocational education schools operate across 16 sectors, all approved by the Ministry of Education.","207 vocational schools operate under Samagra Shiksha.","4.70 crore students are enrolled in vocational schools."],"e":["Composition: 3,263 under Samagra Shiksha (937 double-sector + 2,326 single-sector) + 549 under PM SHRI + 207 under STARS = 4,019. Enrolment is 4.70 lakh.","Expenditure was ₹205.33 crore against an allocation of ₹616.88 crore (2025-26, up to December)."],"i":"Quick sum checks (3,263 + 549 + 207 = 4,019) help spot swapped numbers.","s":"Chapter 3, p. 52.","hq":["2025-26 में राजस्थान में व्यावसायिक शिक्षा के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["PM SHRI योजना के अंतर्गत 3,263 व्यावसायिक विद्यालय संचालित हैं।","4,019 व्यावसायिक शिक्षा विद्यालय 16 क्षेत्रों में संचालित हैं, जो सभी शिक्षा मंत्रालय द्वारा अनुमोदित हैं।","समग्र शिक्षा के अंतर्गत 207 व्यावसायिक विद्यालय संचालित हैं।","व्यावसायिक विद्यालयों में 4.70 करोड़ विद्यार्थी नामांकित हैं।"],"he":["संरचना: समग्र शिक्षा के अंतर्गत 3,263 (937 द्वि-क्षेत्र + 2,326 एकल-क्षेत्र) + PM SHRI के अंतर्गत 549 + STARS के अंतर्गत 207 = 4,019। नामांकन 4.70 लाख है।","2025-26 (दिसंबर तक) ₹616.88 करोड़ के आवंटन के विरुद्ध व्यय ₹205.33 करोड़ रहा।"],"hi":"त्वरित योग-जाँच (3,263 + 549 + 207 = 4,019) बदली हुई संख्याओं को पहचानने में मदद करती है।","hs":"अध्याय 3, पृ. 52."},{"n":23,"t":"Incorrect statement","g":"RAS + UPSC","ans":3,"q":["Which of the following statements regarding ICT and digital initiatives in school education is NOT correct?"],"o":["13,976 ICT lab-enabled government schools and 13,018 smart classrooms are operational.","The DIKSHA portal is created under the aegis of the Ministry of Education, with e-content uploaded by RSCERT (ET Cell, Ajmer).","Under Mission Start, students of classes 9 to 12 can access digital content when subject teachers are unavailable.","Shala Darpan is a database portal meant only for private schools."],"e":["Shala Darpan is a live database portal of the School Education Department for all government schools and education offices. Scholarships, free cycles, free textbooks, uniforms, transport vouchers, Hamari Betiyan, Palanhar and Lado Protsahan are monitored through it.","(a), (b) and (c) are correct as stated in the Review."],"i":"\"Only\" and \"meant only for\" qualifiers often flag a wrong option.","s":"Chapter 3, p. 52.","hq":["विद्यालयी शिक्षा में ICT और डिजिटल पहलों के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["13,976 ICT लैब-युक्त सरकारी विद्यालय और 13,018 स्मार्ट कक्षाएँ संचालित हैं।","DIKSHA पोर्टल शिक्षा मंत्रालय के तत्वावधान में बना है, जिस पर RSCERT (ET सेल, अजमेर) द्वारा ई-सामग्री अपलोड की जाती है।","मिशन स्टार्ट के अंतर्गत विषय शिक्षक उपलब्ध न होने पर कक्षा 9 से 12 के विद्यार्थी डिजिटल सामग्री तक पहुँच सकते हैं।","शाला दर्पण केवल निजी विद्यालयों के लिए बनाया गया डेटाबेस पोर्टल है।"],"he":["शाला दर्पण स्कूल शिक्षा विभाग का सभी सरकारी विद्यालयों और शिक्षा कार्यालयों के लिए लाइव डेटाबेस पोर्टल है। छात्रवृत्तियाँ, निःशुल्क साइकिलें, निःशुल्क पाठ्यपुस्तकें, गणवेश, परिवहन वाउचर, हमारी बेटियाँ, पालनहार और लाडो प्रोत्साहन की निगरानी इसी के माध्यम से होती है।","(a), (b) और (c) समीक्षा में बताए अनुसार सही हैं।"],"hi":"\"केवल\" और \"केवल ... के लिए\" जैसे विशेषक अक्सर गलत विकल्प का संकेत देते हैं।","hs":"अध्याय 3, पृ. 52."},{"n":24,"t":"Multi-statement","g":"RAS","ans":2,"q":["Consider the following statements regarding adult literacy programmes in Rajasthan:","1. Nav Bharat Saaksharta Karyakram has been implemented in the State since 1 April 2022 for illiterate persons aged 15 years and above.","2. The survey of learners and volunteer teachers is done online through the ULLAS App.","3. The survey of illiterate persons exceeded the target of 30 lakh.","4. Each Mahatma Gandhi Library and Reading Room receives ₹5,000 per month as recurring expenditure.","Which of the statements given above is/are correct?"],"o":["2 and 3 only","1, 2 and 4 only","1 and 2 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The survey of 25.72 lakh illiterate persons was below the target of 30 lakh.","Statement 4: Incorrect. The recurring grant is ₹500 per month per library.","Statements 1 and 2: Correct. Nav Bharat Saaksharta Karyakram has been implemented since 1 April 2022 for illiterates aged 15 and above. The ULLAS App is used for surveys of learners and volunteer teachers; 1.49 lakh volunteer teachers were surveyed."],"i":"Compare achievement with target before accepting a statement.","s":"Chapter 3, p. 53.","hq":["राजस्थान में प्रौढ़ साक्षरता कार्यक्रमों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. नव भारत साक्षरता कार्यक्रम राज्य में 1 अप्रैल 2022 से 15 वर्ष और उससे अधिक आयु के निरक्षर व्यक्तियों के लिए लागू है।","2. शिक्षार्थियों और स्वयंसेवी शिक्षकों का सर्वेक्षण ULLAS ऐप के माध्यम से ऑनलाइन किया जाता है।","3. निरक्षर व्यक्तियों का सर्वेक्षण 30 लाख के लक्ष्य से अधिक रहा।","4. प्रत्येक महात्मा गांधी पुस्तकालय एवं वाचनालय को आवर्ती व्यय के रूप में ₹5,000 प्रति माह मिलते हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 2 और 3","केवल 1, 2 और 4","केवल 1 और 2","1, 2, 3 और 4"],"he":["कथन 3: गलत। 25.72 लाख निरक्षर व्यक्तियों का सर्वेक्षण 30 लाख के लक्ष्य से कम था।","कथन 4: गलत। आवर्ती अनुदान प्रति पुस्तकालय ₹500 प्रति माह है।","कथन 1 और 2: सही। नव भारत साक्षरता कार्यक्रम 1 अप्रैल 2022 से 15 वर्ष और उससे अधिक आयु के निरक्षरों के लिए लागू है। शिक्षार्थियों और स्वयंसेवी शिक्षकों के सर्वेक्षण हेतु ULLAS ऐप का उपयोग होता है; 1.49 लाख स्वयंसेवी शिक्षकों का सर्वेक्षण हुआ।"],"hi":"कथन स्वीकार करने से पहले उपलब्धि की लक्ष्य से तुलना करें।","hs":"अध्याय 3, पृ. 53."},{"n":25,"t":"Match the following","g":"RAS","ans":1,"q":["Match the literacy initiative (List I) with its feature (List II) and select the correct answer using the code below.","A. E-Saksharta","B. ULLAS Rajasthan","C. Mahila Shikshan Vihar","D. FLNAT","1. Residential school for women aged 15-30 at Jhalawar","2. Foundational Literacy and Numeracy Assessment Test through NIOS","3. YouTube channel with 73 videos and about 27,000 subscribers","4. YouTube channel with 18 videos"],"o":["A-3, B-2, C-1, D-4","A-3, B-4, C-1, D-2","A-4, B-3, C-1, D-2","A-3, B-4, C-2, D-1"],"e":["E-Saksharta: YouTube channel with 73 videos and about 27,000 subscribers. ULLAS Rajasthan: YouTube channel with 18 videos. Both were launched with Mission Gyan on International Literacy Day (8 September 2023).","Mahila Shikshan Vihar: residential school at Jhalawar (100 women enrolled) offering education up to class 10 and vocational training for women aged 15-30.","FLNAT: first test of 2025-26 conducted on 21 September 2025 through NIOS, with 14.78 lakh learners appearing."],"i":"Do not confuse E-Saksharta (73 videos) with ULLAS Rajasthan (18 videos).","s":"Chapter 3, p. 53.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (साक्षरता पहल) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. ई-साक्षरता","B. उल्लास राजस्थान","C. महिला शिक्षण विहार","D. FLNAT","1. झालावाड़ में 15-30 वर्ष की महिलाओं के लिए आवासीय विद्यालय","2. NIOS के माध्यम से आधारभूत साक्षरता एवं संख्या-ज्ञान आकलन परीक्षा","3. 73 वीडियो और लगभग 27,000 सब्सक्राइबर वाला YouTube चैनल","4. 18 वीडियो वाला YouTube चैनल"],"ho":["A-3, B-2, C-1, D-4","A-3, B-4, C-1, D-2","A-4, B-3, C-1, D-2","A-3, B-4, C-2, D-1"],"he":["ई-साक्षरता: 73 वीडियो और लगभग 27,000 सब्सक्राइबर वाला YouTube चैनल। उल्लास राजस्थान: 18 वीडियो वाला YouTube चैनल। दोनों अंतर्राष्ट्रीय साक्षरता दिवस (8 सितंबर 2023) पर मिशन ज्ञान के साथ शुरू हुए।","महिला शिक्षण विहार: झालावाड़ में आवासीय विद्यालय (100 महिलाएँ नामांकित), जो 15-30 वर्ष की महिलाओं को कक्षा 10 तक शिक्षा और व्यावसायिक प्रशिक्षण देता है।","FLNAT: 2025-26 की पहली परीक्षा 21 सितंबर 2025 को NIOS के माध्यम से हुई, जिसमें 14.78 लाख शिक्षार्थी शामिल हुए।"],"hi":"ई-साक्षरता (73 वीडियो) को उल्लास राजस्थान (18 वीडियो) से न मिलाएँ।","hs":"अध्याय 3, पृ. 53."},{"n":26,"t":"Single best answer","g":"RAS","ans":3,"q":["Which one of the following statements regarding general higher education in Rajasthan is correct?"],"o":["At the time of independence there were 17 general education colleges in the State.","There are 1,589 government colleges in the State.","There are 48 government law colleges.","Rajasthan has 3,218 general education colleges, including 596 government colleges."],"e":["There were only 7 colleges at independence. The 3,218 colleges include 596 government, 20 government law, 48 government agriculture, 1,589 private, 957 B.Ed., 2 self-financing and 6 privately aided colleges (they add up to 3,218).","In 2025-26, 28 new government colleges, 5 agriculture colleges and 1 law college were opened."],"i":"Check categories carefully: government law (20) versus agriculture (48), government (596) versus private (1,589).","s":"Chapter 3, p. 54.","hq":["राजस्थान में सामान्य उच्च शिक्षा के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["स्वतंत्रता के समय राज्य में 17 सामान्य शिक्षा महाविद्यालय थे।","राज्य में 1,589 सरकारी महाविद्यालय हैं।","48 सरकारी विधि महाविद्यालय हैं।","राजस्थान में 3,218 सामान्य शिक्षा महाविद्यालय हैं, जिनमें 596 सरकारी महाविद्यालय हैं।"],"he":["स्वतंत्रता के समय केवल 7 महाविद्यालय थे। 3,218 महाविद्यालयों में 596 सरकारी, 20 सरकारी विधि, 48 सरकारी कृषि, 1,589 निजी, 957 B.Ed., 2 स्व-वित्तपोषित और 6 निजी सहायता प्राप्त महाविद्यालय हैं (योग 3,218)।","2025-26 में 28 नए सरकारी महाविद्यालय, 5 कृषि महाविद्यालय और 1 विधि महाविद्यालय खोले गए।"],"hi":"श्रेणियों को ध्यान से जाँचें: सरकारी विधि (20) बनाम कृषि (48), सरकारी (596) बनाम निजी (1,589)।","hs":"अध्याय 3, पृ. 54."},{"n":27,"t":"Match the following","g":"RAS + UPSC","ans":0,"q":["Match the scheme for girls' education (List I) with its feature (List II) and select the correct answer using the code below.","A. Kalibai Bhil Medhavi Chhatra Scooty Yojana","B. Devnarayan Girls Scooty Distribution and Incentive Scheme","C. Chief Minister (B.Ed.) Sambal Yojana","D. Chief Minister Hamari Betiyan Yojana","1. Fee reimbursement for B.Ed. to widowed/abandoned women","2. Scooty for meritorious girls enrolled in first-year higher education","3. Launched in 2023","4. Financial assistance to meritorious girls"],"o":["A-2, B-3, C-1, D-4","A-2, B-1, C-3, D-4","A-1, B-3, C-2, D-4","A-3, B-2, C-1, D-4"],"e":["Kalibai Bhil Medhavi Chhatra Scooty Yojana: scooty for meritorious girls who passed Class 12 and are in the first year of higher education.","Devnarayan Girls Scooty Distribution and Incentive Scheme: launched in 2023.","Chief Minister (B.Ed.) Sambal Yojana: fee reimbursement for widowed/abandoned women pursuing B.Ed.","Chief Minister Hamari Betiyan Yojana: financial assistance to meritorious girls."],"i":"Learn the target group of each girls' scheme. Similar names are a common cause of errors.","s":"Chapter 3, pp. 54-55.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (बालिका शिक्षा योजना) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. कालीबाई भील मेधावी छात्रा स्कूटी योजना","B. देवनारायण बालिका स्कूटी वितरण एवं प्रोत्साहन योजना","C. मुख्यमंत्री (B.Ed.) सम्बल योजना","D. मुख्यमंत्री हमारी बेटियाँ योजना","1. विधवा/परित्यक्ता महिलाओं को B.Ed. हेतु शुल्क प्रतिपूर्ति","2. उच्च शिक्षा के प्रथम वर्ष में नामांकित मेधावी बालिकाओं के लिए स्कूटी","3. 2023 में शुरू","4. मेधावी बालिकाओं को वित्तीय सहायता"],"ho":["A-2, B-3, C-1, D-4","A-2, B-1, C-3, D-4","A-1, B-3, C-2, D-4","A-3, B-2, C-1, D-4"],"he":["कालीबाई भील मेधावी छात्रा स्कूटी योजना: कक्षा 12 उत्तीर्ण कर उच्च शिक्षा के प्रथम वर्ष में अध्ययनरत मेधावी बालिकाओं के लिए स्कूटी।","देवनारायण बालिका स्कूटी वितरण एवं प्रोत्साहन योजना: 2023 में शुरू।","मुख्यमंत्री (B.Ed.) सम्बल योजना: B.Ed. करने वाली विधवा/परित्यक्ता महिलाओं के लिए शुल्क प्रतिपूर्ति।","मुख्यमंत्री हमारी बेटियाँ योजना: मेधावी बालिकाओं को वित्तीय सहायता।"],"hi":"प्रत्येक बालिका योजना का लक्षित समूह सीखें। मिलते-जुलते नाम त्रुटियों का सामान्य कारण हैं।","hs":"अध्याय 3, पृ. 54-55."},{"n":28,"t":"Multi-statement","g":"UPSC","ans":3,"q":["Consider the following statements regarding higher education schemes in Rajasthan:","1. The Swami Vivekananda Scholarship for Academic Excellence supports study at foreign universities listed in the THE ranking or at institutes ranked 1 to 50 in NIRF.","2. PM-USHA is a Centrally Sponsored Scheme with a 60:40 funding pattern.","3. Project completion is highest under RUSA 1.0 (94.40 per cent) and lowest under PM-USHA (27 per cent).","4. RUSA 2.0 benefited 110 institutions in Rajasthan.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 3 and 4 only","1, 2 and 3 only"],"e":["Statement 4: Incorrect. RUSA 1.0 covers 110 institutions; RUSA 2.0 covers 20 and PM-USHA 34.","Statements 1-3: Correct. The Swami Vivekananda Scholarship supports study in foreign universities in the THE list or institutes with NIRF rank 1 to 50 in India (₹145 crore spent of ₹150 crore). PM-USHA is a 60:40 Centrally Sponsored Scheme. Project completion is 94.40% (RUSA 1.0), 73.82% (RUSA 2.0) and 27% (PM-USHA); grants were ₹390 crore, ₹221 crore and ₹330 crore."],"i":"RUSA versus PM-USHA numbers are easily mixed. Remember 110, 20 and 34 institutions.","s":"Chapter 3, p. 55.","hq":["राजस्थान में उच्च शिक्षा योजनाओं के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. शैक्षणिक उत्कृष्टता हेतु स्वामी विवेकानंद छात्रवृत्ति THE रैंकिंग में सूचीबद्ध विदेशी विश्वविद्यालयों या NIRF में 1 से 50 रैंक वाले संस्थानों में अध्ययन हेतु सहायता देती है।","2. PM-USHA 60:40 वित्तपोषण पैटर्न वाली केंद्र प्रायोजित योजना है।","3. परियोजना पूर्णता RUSA 1.0 में सर्वाधिक (94.40 प्रतिशत) और PM-USHA में न्यूनतम (27 प्रतिशत) है।","4. RUSA 2.0 से राजस्थान में 110 संस्थान लाभान्वित हुए।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","केवल 1, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 4: गलत। RUSA 1.0 में 110 संस्थान हैं; RUSA 2.0 में 20 और PM-USHA में 34।","कथन 1-3: सही। स्वामी विवेकानंद छात्रवृत्ति THE सूची के विदेशी विश्वविद्यालयों या भारत में NIRF रैंक 1 से 50 वाले संस्थानों में अध्ययन हेतु सहायता देती है (₹150 करोड़ में से ₹145 करोड़ व्यय)। PM-USHA 60:40 की केंद्र प्रायोजित योजना है। परियोजना पूर्णता 94.40% (RUSA 1.0), 73.82% (RUSA 2.0) और 27% (PM-USHA) है; अनुदान क्रमशः ₹390 करोड़, ₹221 करोड़ और ₹330 करोड़ रहे।"],"hi":"RUSA और PM-USHA की संख्याएँ आसानी से मिल जाती हैं। 110, 20 और 34 संस्थान याद रखें।","hs":"अध्याय 3, पृ. 55."},{"n":29,"t":"Data-based","g":"RAS + UPSC","ans":1,"q":["In 2025-26, Rajasthan's 73 engineering colleges have a total intake capacity of about 27,753 students per year, and 16,355 students enrolled. About what percentage of the intake capacity was filled?"],"o":["41 per cent","59 per cent","73 per cent","95 per cent"],"e":["16,355 ÷ 27,753 ≈ 58.9%, about 59%.","For MBA institutions (52 institutions, intake about 4,474), 1,800 enrolled, which is about 40%. The 73 engineering colleges comprise 19 government and 54 private ones; the 52 MBA institutions comprise 7 government and 45 private."],"i":"Capacity-utilisation percentages are a standard data question. Remember that intake capacity is not the same as enrolment.","s":"Chapter 3, p. 56.","hq":["2025-26 में राजस्थान के 73 इंजीनियरिंग महाविद्यालयों की कुल प्रवेश क्षमता लगभग 27,753 विद्यार्थी प्रति वर्ष है और 16,355 विद्यार्थी नामांकित हुए। प्रवेश क्षमता का लगभग कितना प्रतिशत भरा?"],"ho":["41 प्रतिशत","59 प्रतिशत","73 प्रतिशत","95 प्रतिशत"],"he":["16,355 ÷ 27,753 ≈ 58.9%, यानी लगभग 59%।","MBA संस्थानों (52 संस्थान, प्रवेश क्षमता लगभग 4,474) में 1,800 नामांकित हुए, जो लगभग 40% है। 73 इंजीनियरिंग महाविद्यालयों में 19 सरकारी और 54 निजी हैं; 52 MBA संस्थानों में 7 सरकारी और 45 निजी हैं।"],"hi":"क्षमता-उपयोग प्रतिशत मानक डेटा प्रश्न है। याद रखें कि प्रवेश क्षमता और नामांकन एक नहीं हैं।","hs":"अध्याय 3, पृ. 56."},{"n":30,"t":"Single best answer","g":"RAS","ans":2,"q":["Which one of the following statements regarding polytechnic colleges and ITIs in Rajasthan is correct?"],"o":["Private polytechnic colleges rose from 48 to 68 between 2024-25 and 2025-26.","There are 1,385 government ITIs and 314 private ITIs.","137 polytechnic colleges with intake of 25,802 function in 2025-26; government polytechnics rose from 48 to 69.","Craftsman Training Scheme trades are 44 non-engineering and 35 engineering."],"e":["Table 3.6: government polytechnics rose from 48 to 69 (intake 7,565 to 10,994) while private colleges stayed at 68 (intake 14,673 to 14,808). Total colleges rose from 116 to 137.","ITIs: 314 government (63,960 seats) and 1,385 private (2,12,624 seats). CTS covers 44 engineering and 35 non-engineering trades of one to two years. 12 government ITIs are women ITIs."],"i":"Swapping government and private numbers is the usual trap in institution counts.","s":"Chapter 3, p. 57; Table 3.6.","hq":["राजस्थान में पॉलिटेक्निक महाविद्यालयों और ITI के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["निजी पॉलिटेक्निक महाविद्यालय 2024-25 और 2025-26 के बीच 48 से बढ़कर 68 हो गए।","1,385 सरकारी ITI और 314 निजी ITI हैं।","2025-26 में 25,802 प्रवेश क्षमता वाले 137 पॉलिटेक्निक महाविद्यालय संचालित हैं; सरकारी पॉलिटेक्निक 48 से बढ़कर 69 हो गए।","शिल्पकार प्रशिक्षण योजना के ट्रेड 44 गैर-इंजीनियरिंग और 35 इंजीनियरिंग हैं।"],"he":["तालिका 3.6: सरकारी पॉलिटेक्निक 48 से बढ़कर 69 हो गए (प्रवेश क्षमता 7,565 से 10,994), जबकि निजी महाविद्यालय 68 पर स्थिर रहे (प्रवेश क्षमता 14,673 से 14,808)। कुल महाविद्यालय 116 से बढ़कर 137 हुए।","ITI: 314 सरकारी (63,960 सीटें) और 1,385 निजी (2,12,624 सीटें)। CTS में एक से दो वर्ष के 44 इंजीनियरिंग और 35 गैर-इंजीनियरिंग ट्रेड हैं। 12 सरकारी ITI महिला ITI हैं।"],"hi":"सरकारी और निजी संख्याओं की अदला-बदली संस्थान-गणना में सामान्य जाल है।","hs":"अध्याय 3, पृ. 57; तालिका 3.6."},{"n":31,"t":"Chronology","g":"RAS","ans":3,"q":["Arrange the following government medical colleges in the chronological order of the academic session in which they commenced operations (earliest first):","A. Dholpur","B. Karauli","C. Banswara","D. Tonk","Select the correct chronological order (earliest to latest)."],"o":["B-A-C-D","A-C-B-D","A-B-D-C","A-B-C-D"],"e":["Dholpur (second phase) commenced in 2022-23 along with Sri Ganganagar, Chittorgarh and Sirohi; Karauli in 2023-24 (with Alwar, Dausa, Bundi, Hanumangarh); Banswara in 2024-25 (with Baran, Nagaur, Jhunjhunu, Sawai Madhopur); Tonk in 2025-26 (with Jaisalmer, 50 MBBS seats each)."],"i":"The Review groups medical colleges by session; learn one example per year.","s":"Chapter 3, p. 58.","hq":["निम्नलिखित सरकारी मेडिकल कॉलेजों को उनके संचालन आरंभ होने के शैक्षणिक सत्र के कालक्रम (प्राचीनतम पहले) में व्यवस्थित कीजिए:","A. धौलपुर","B. करौली","C. बाँसवाड़ा","D. टोंक","सही कालक्रम (प्राचीनतम से नवीनतम) चुनिए।"],"ho":["B-A-C-D","A-C-B-D","A-B-D-C","A-B-C-D"],"he":["धौलपुर (द्वितीय चरण) 2022-23 में श्रीगंगानगर, चित्तौड़गढ़ और सिरोही के साथ शुरू हुआ; करौली 2023-24 में (अलवर, दौसा, बूंदी, हनुमानगढ़ के साथ); बाँसवाड़ा 2024-25 में (बारां, नागौर, झुंझुनूं, सवाई माधोपुर के साथ); टोंक 2025-26 में (जैसलमेर के साथ, प्रत्येक में 50 MBBS सीटें)।"],"hi":"समीक्षा मेडिकल कॉलेजों को सत्र के अनुसार समूहित करती है; प्रत्येक वर्ष का एक उदाहरण सीखें।","hs":"अध्याय 3, पृ. 58."},{"n":32,"t":"Multi-statement","g":"RAS","ans":0,"q":["Consider the following statements regarding medical education in Rajasthan:","1. There are 49 medical colleges in the State as on December 2025.","2. Of these, 24 are in the private sector and 15 are RajMES colleges.","3. For the 15 new medical colleges of the third phase, the Central share is 40 per cent and the State share is 60 per cent.","4. Medical colleges at Tonk and Jaisalmer commenced in 2025-26 with 50 MBBS seats each.","Which of the statements given above is/are correct?"],"o":["1 and 4 only","2 and 3 only","1, 2 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Correct. There are 49 medical colleges (December 2025).","Statement 2: Incorrect. The numbers are swapped: 24 are RajMES colleges and 15 are private (the 49 also include 6 government colleges, one RUHS constituent college, 2 ESI colleges and AIIMS Jodhpur).","Statement 3: Incorrect. For the 15 colleges sanctioned in the third phase (₹325 crore each), the Central share is 60% and State share 40%.","Statement 4: Correct. Tonk and Jaisalmer started in 2025-26 with 50 MBBS seats each (earlier colleges: 100 seats)."],"i":"Central-State sharing is repeatedly 60:40; do not reverse it.","s":"Chapter 3, pp. 57-58.","hq":["राजस्थान में चिकित्सा शिक्षा के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. दिसंबर 2025 तक राज्य में 49 मेडिकल कॉलेज हैं।","2. इनमें से 24 निजी क्षेत्र में हैं और 15 RajMES के कॉलेज हैं।","3. तृतीय चरण के 15 नए मेडिकल कॉलेजों के लिए केंद्रीय हिस्सा 40 प्रतिशत और राज्य हिस्सा 60 प्रतिशत है।","4. टोंक और जैसलमेर के मेडिकल कॉलेज 2025-26 में प्रत्येक 50 MBBS सीटों के साथ शुरू हुए।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 4","केवल 2 और 3","केवल 1, 2 और 4","1, 2, 3 और 4"],"he":["कथन 1: सही। 49 मेडिकल कॉलेज हैं (दिसंबर 2025)।","कथन 2: गलत। संख्याएँ उलटी हैं: 24 RajMES कॉलेज हैं और 15 निजी हैं (49 में 6 सरकारी कॉलेज, एक RUHS घटक कॉलेज, 2 ESI कॉलेज और AIIMS जोधपुर भी शामिल हैं)।","कथन 3: गलत। तृतीय चरण में स्वीकृत 15 कॉलेजों (प्रत
