95 lakh kg/day), so (d) is the incorrect statement. In Table 1.11, achievements fall short of targets for marketing (22.60 against 26.63 lakh litres/day) and new societies (627 against 1,467).","Other data: about 10 lakh milk producers are in the cooperative programme and ₹4,304.91 crore was disbursed to them up to December 2025. The Sambal Yojana disbursed ₹519 crore against a ₹650 crore provision."],"i":"Always compare \"target\" and \"achievement\" columns before choosing. The Review warns that these are part-year (up to December 2025) figures.","s":"Chapter 1, p. 23; Table 1.11.","hq":["राजस्थान में डेयरी विकास के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["19,643 दुग्ध सहकारी समितियाँ 24 जिला दुग्ध उत्पादक सहकारी संघों और शीर्ष संस्था RCDF से संबद्ध हैं।","जिला दुग्ध संघ संयंत्रों की स्थापित दुग्ध प्रसंस्करण क्षमता 51.40 लाख लीटर प्रतिदिन पहुँच गई है।","मुख्यमंत्री दुग्ध उत्पादक संबल योजना के अंतर्गत अनुदान 2022-23 में ₹2 प्रति लीटर से बढ़ाकर ₹5 प्रति लीटर किया गया।","औसत दुग्ध संकलन 30.29 लाख किग्रा प्रतिदिन, 36.95 लाख किग्रा प्रतिदिन के लक्ष्य से अधिक रहा।"],"he":["उपलब्धि (30.29 लाख किग्रा/दिन) लक्ष्य (36.95 लाख किग्रा/दिन) से कम थी, अतः (d) गलत कथन है। तालिका 1.11 में विपणन (26.63 के विरुद्ध 22.60 लाख लीटर/दिन) और नई समितियों (1,467 के विरुद्ध 627) में भी उपलब्धियाँ लक्ष्य से कम हैं।","अन्य आँकड़े: सहकारी कार्यक्रम में लगभग 10 लाख दुग्ध उत्पादक हैं और दिसंबर 2025 तक उन्हें ₹4,304.91 करोड़ वितरित हुए। संबल योजना में ₹650 करोड़ के प्रावधान के विरुद्ध ₹519 करोड़ वितरित हुए।"],"hi":"उत्तर चुनने से पहले हमेशा \"लक्ष्य\" और \"उपलब्धि\" के स्तंभों की तुलना करें। समीक्षा चेतावनी देती है कि ये आंशिक वर्ष (दिसंबर 2025 तक) के आँकड़े हैं।","hs":"अध्याय 1, पृ. 23; तालिका 1.11."},{"n":32,"t":"Multi-statement","g":"RAS","ans":2,"q":["Consider the following statements regarding cattle conservation (Gopalan) schemes in Rajasthan:","1. Gaushala Vikas Yojana provides financial assistance of a maximum ₹10 lakh on a 90:10 (Government:Public) basis for basic infrastructure in registered Gaushalas.","2. The grant-in-aid for registered Gaushalas is payable for 365 days a year at ₹50 per head per day for large cattle.","3. The Panchayat Samiti level Nandishala scheme addresses stray male cattle, with funding in the ratio 90:10.","4. The Gram Gaushala/Pashu Ashraya Sthal scheme operates at the Gram Panchayat level with an estimated setup cost of ₹1 crore.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 2: Incorrect. The enhanced rates (from 1 April 2025: ₹44 to ₹50 per head per day for large cattle, ₹22 to ₹25 for small cattle) apply for 270 days, not 365.","Statements 1, 3 and 4: Correct. Gaushala Vikas Yojana (max ₹10 lakh at 90:10). Nandishalas are set up at Panchayat Samiti level to address stray male cattle (about ₹1.57 crore per unit). Gram Gaushala/Pashu Ashraya Sthal units work at Gram Panchayat level (about ₹1 crore, 90:10).","Up to December 2025, ₹1,204.90 crore was allocated to 3,043 Gaushalas."],"i":"The administrative level (Panchayat Samiti versus Gram Panchayat) and funding ratio (90:10) are standard distinctions.","s":"Chapter 1, p. 22.","hq":["राजस्थान में गोपालन (गोवंश संरक्षण) योजनाओं के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. गौशाला विकास योजना पंजीकृत गौशालाओं में बुनियादी ढाँचे के लिए 90:10 (सरकार:जनता) के आधार पर अधिकतम ₹10 लाख की वित्तीय सहायता देती है।","2. पंजीकृत गौशालाओं के लिए अनुदान वर्ष के 365 दिन बड़े पशु के लिए ₹50 प्रति पशु प्रतिदिन की दर से देय है।","3. पंचायत समिति स्तर की नंदीशाला योजना आवारा नर पशुओं की समस्या का समाधान करती है, जिसका वित्तपोषण 90:10 के अनुपात में है।","4. ग्राम गौशाला/पशु आश्रय स्थल योजना ग्राम पंचायत स्तर पर संचालित होती है, जिसकी अनुमानित स्थापना लागत ₹1 करोड़ है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2, 3 और 4","केवल 1, 3 और 4","1, 2, 3 और 4"],"he":["कथन 2: गलत। संवर्धित दरें (1 अप्रैल 2025 से: बड़े पशु के लिए ₹44 से ₹50 और छोटे पशु के लिए ₹22 से ₹25 प्रति पशु प्रतिदिन) 365 दिन नहीं, बल्कि 270 दिन के लिए लागू हैं।","कथन 1, 3 और 4: सही। गौशाला विकास योजना (अधिकतम ₹10 लाख, 90:10)। नंदीशालाएँ आवारा नर पशुओं के लिए पंचायत समिति स्तर पर स्थापित की जाती हैं (लगभग ₹1.57 करोड़ प्रति इकाई)। ग्राम गौशाला/पशु आश्रय स्थल इकाइयाँ ग्राम पंचायत स्तर पर चलती हैं (लगभग ₹1 करोड़, 90:10)।","दिसंबर 2025 तक 3,043 गौशालाओं को ₹1,204.90 करोड़ आवंटित किए गए।"],"hi":"प्रशासनिक स्तर (पंचायत समिति बनाम ग्राम पंचायत) और वित्तपोषण अनुपात (90:10) मानक भेद हैं।","hs":"अध्याय 1, पृ. 22."},{"n":33,"t":"Data interpretation","g":"UPSC","ans":1,"q":["Table 1.12 shows fish production of 1,13,647.21 MT in 2024-25 and 78,013.03 MT in 2025-26 (up to December). How should the apparent fall be interpreted?"],"o":["A real decline of about 31 per cent in fish output","Not directly comparable, because the 2025-26 figure covers only part of the year","Evidence that the Pradhan Mantri Matsya Sampada Yojana has failed","Evidence that fish seed stocking has collapsed"],"e":["The 2025-26 column is labelled \"Upto December\". A part-year figure cannot be compared with a full-year figure. The Review does not claim a decline.","Fish seed stocking in 2025-26 (up to December) was 1,335.90 million fry against 1,382.39 million in 2024-25, so seed activity is almost at the full-year level.","Context: Rajasthan has about 4.30 lakh ha of water bodies (3.36 lakh ha reservoirs, 0.94 lakh ha ponds and tanks). Under PMMSY, ₹467.72 lakh was transferred to 41 beneficiaries via Jan Aadhaar DBT."],"i":"Examiners love part-year versus full-year traps. Read table footnotes and column headers first.","s":"Chapter 1, p. 24; Table 1.12.","hq":["तालिका 1.12 में मत्स्य उत्पादन 2024-25 में 1,13,647.21 मीट्रिक टन और 2025-26 (दिसंबर तक) में 78,013.03 मीट्रिक टन दर्शाया गया है। इस प्रत्यक्ष गिरावट की व्याख्या कैसे की जानी चाहिए?"],"ho":["मत्स्य उत्पादन में लगभग 31 प्रतिशत की वास्तविक गिरावट","सीधे तुलनीय नहीं, क्योंकि 2025-26 का आँकड़ा केवल आंशिक वर्ष का है","इस बात का प्रमाण कि प्रधानमंत्री मत्स्य संपदा योजना विफल रही है","इस बात का प्रमाण कि मत्स्य बीज संचयन ध्वस्त हो गया है"],"he":["2025-26 का स्तंभ \"दिसंबर तक\" के रूप में अंकित है। आंशिक वर्ष के आँकड़े की तुलना पूरे वर्ष के आँकड़े से नहीं की जा सकती। समीक्षा गिरावट का दावा नहीं करती।","2025-26 (दिसंबर तक) में मत्स्य बीज संचयन 2024-25 के 1,382.39 मिलियन फ्राई के मुकाबले 1,335.90 मिलियन फ्राई रहा, यानी बीज गतिविधि लगभग पूरे वर्ष के स्तर पर है।","संदर्भ: राजस्थान में लगभग 4.30 लाख हेक्टेयर जल निकाय हैं (3.36 लाख हेक्टेयर जलाशय, 0.94 लाख हेक्टेयर तालाब और टैंक)। PMMSY के अंतर्गत जन आधार DBT के माध्यम से 41 लाभार्थियों को ₹467.72 लाख हस्तांतरित किए गए।"],"hi":"परीक्षक आंशिक वर्ष बनाम पूर्ण वर्ष के जाल पसंद करते हैं। पहले तालिका की पाद-टिप्पणियाँ और स्तंभ शीर्षक पढ़ें।","hs":"अध्याय 1, पृ. 24; तालिका 1.12."},{"n":34,"t":"Direct factual","g":"RAS","ans":0,"q":["A Brackish Water Aquaculture Laboratory to support shrimp farming in arid and semi-arid areas has been completed under a budget initiative at:"],"o":["Churu","Bikaner","Sri Ganganagar","Jaisalmer"],"e":["The laboratory at Churu provides shrimp farmers with brackish water testing services, useful where freshwater is scarce.","Related: PMMSY sanctioned 12 cage-culture units (18 cages per unit) in 2025-26, and 5,501 active fishermen were covered under the Group Accident Insurance through the National Fisheries Development Board, Hyderabad."],"i":"Location-of-facility questions are a standard RAS direct-fact format.","s":"Chapter 1, p. 24.","hq":["शुष्क और अर्ध-शुष्क क्षेत्रों में झींगा पालन में सहायता हेतु खारा जल जलकृषि प्रयोगशाला एक बजट घोषणा के अंतर्गत कहाँ पूरी हो चुकी है?"],"ho":["चूरू","बीकानेर","श्रीगंगानगर","जैसलमेर"],"he":["चूरू की प्रयोगशाला झींगा किसानों को खारे जल की जाँच सेवाएँ देती है, जो मीठे पानी की कमी वाले स्थानों पर उपयोगी है।","संबंधित: 2025-26 में PMMSY के अंतर्गत 12 केज-कल्चर इकाइयाँ (प्रति इकाई 18 केज) स्वीकृत हुईं, और राष्ट्रीय मत्स्य विकास बोर्ड, हैदराबाद के माध्यम से समूह दुर्घटना बीमा में 5,501 सक्रिय मछुआरे शामिल किए गए।"],"hi":"सुविधा के स्थान वाले प्रश्न RAS का मानक प्रत्यक्ष-तथ्य प्रारूप हैं।","hs":"अध्याय 1, पृ. 24."},{"n":35,"t":"Multi-statement","g":"RAS + UPSC","ans":0,"q":["Consider the following statements regarding direct support to farmers in Rajasthan:","1. Annual assistance under the Chief Minister Kisan Samman Nidhi Yojana was enhanced from ₹2,000 to ₹3,000 in Budget 2025-26.","2. The 4th instalment under it transferred ₹717.96 crore to 71.79 lakh farmers through DBT.","3. Rajasthan ranks 5th in India in the number of PM-KISAN beneficiaries.","4. The State transfers ₹2,000 per farmer per instalment under the Chief Minister Kisan Samman Nidhi.","Which of the statements given above is/are correct?"],"o":["1, 2 and 3 only","2 and 4 only","1 and 4 only","1, 2, 3 and 4"],"e":["Statement 4: Incorrect. The transfer is ₹1,000 per farmer per instalment (checked: ₹717.96 crore ÷ 71.79 lakh farmers ≈ ₹1,000).","Statements 1-3: Correct. Annual assistance under the Chief Minister Kisan Samman Nidhi was raised from ₹2,000 to ₹3,000 in Budget 2025-26. Under PM-KISAN, the 21st instalment transferred ₹1,305.80 crore to 65.29 lakh farmers, and Rajasthan ranks 5th in India in the number of beneficiaries."],"i":"The Review stresses Aadhaar seeding and e-KYC (69.42 lakh farmers completed) as the basis for DBT.","s":"Chapter 1, p. 25 (Figure 1.11).","hq":["राजस्थान में किसानों को प्रत्यक्ष सहायता के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. बजट 2025-26 में मुख्यमंत्री किसान सम्मान निधि योजना के अंतर्गत वार्षिक सहायता ₹2,000 से बढ़ाकर ₹3,000 की गई।","2. इसकी चौथी किस्त में DBT के माध्यम से 71.79 लाख किसानों को ₹717.96 करोड़ हस्तांतरित किए गए।","3. PM-KISAN लाभार्थियों की संख्या में राजस्थान भारत में 5वें स्थान पर है।","4. राज्य मुख्यमंत्री किसान सम्मान निधि के अंतर्गत प्रति किस्त प्रति किसान ₹2,000 हस्तांतरित करता है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 3","केवल 2 और 4","केवल 1 और 4","1, 2, 3 और 4"],"he":["कथन 4: गलत। हस्तांतरण प्रति किस्त प्रति किसान ₹1,000 है (जाँच: ₹717.96 करोड़ ÷ 71.79 लाख किसान ≈ ₹1,000)।","कथन 1-3: सही। बजट 2025-26 में मुख्यमंत्री किसान सम्मान निधि के अंतर्गत वार्षिक सहायता ₹2,000 से बढ़ाकर ₹3,000 की गई। PM-KISAN के अंतर्गत 21वीं किस्त में 65.29 लाख किसानों को ₹1,305.80 करोड़ हस्तांतरित हुए और लाभार्थियों की संख्या में राजस्थान भारत में 5वें स्थान पर है।"],"hi":"समीक्षा DBT के आधार के रूप में आधार सीडिंग और e-KYC (69.42 लाख किसानों ने पूरा किया) पर ज़ोर देती है।","hs":"अध्याय 1, पृ. 25 (चित्र 1.11)."},{"n":36,"t":"Match the following","g":"RAS","ans":2,"q":["Match the farmer welfare scheme (List I) with its feature (List II) and select the correct answer using the code below.","A. Rajasthan Krishak Samarthan Yojana","B. Rajasthan Krishak Loan Waiver Scheme","C. Small and Marginal Older Farmer's Samman Pension Scheme","D. Kisan Kaleva Yojana","1. Waiver of short-term crop loans outstanding as on 30 November 2018","2. Monthly pension of ₹1,250 (women 55+, men 58+)","3. Bonus of ₹150 per quintal over MSP","4. Quality food at subsidised rates in mandis"],"o":["A-1, B-3, C-2, D-4","A-3, B-1, C-4, D-2","A-3, B-1, C-2, D-4","A-2, B-1, C-3, D-4"],"e":["Rajasthan Krishak Samarthan Yojana: bonus of ₹150 per quintal over MSP (₹320.50 crore paid by the State). Rabi Marketing Season 2025-26: 21.37 lakh MT of wheat procured from 1.73 lakh farmers through 327 centres at an MSP of ₹2,425 per quintal.","Rajasthan Krishak Loan Waiver Scheme: short-term crop loans outstanding on 30 November 2018; 20.92 lakh farmers benefited; relief of ₹7,881.89 crore (up to March 2025).","Small and Marginal Older Farmer's Samman Pension: ₹1,250 per month; 1.97 lakh beneficiaries.","Kisan Kaleva Yojana: quality food at subsidised rates in Krishi Upaj Mandi Samitis; 18.26 lakh farmers and labourers benefited. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 1: Transforming Agri-Food Systems"],"i":"Pair each scheme with its single distinguishing number (₹150 bonus, 30 Nov 2018 cut-off, ₹1,250 pension).","s":"Chapter 1, pp. 25-26 (Figure 1.11).","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (किसान कल्याण योजना) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. राजस्थान कृषक समर्थन योजना","B. राजस्थान कृषक ऋण माफी योजना","C. लघु एवं सीमांत वृद्ध कृषक सम्मान पेंशन योजना","D. किसान कलेवा योजना","1. 30 नवंबर 2018 तक बकाया अल्पकालिक फसली ऋणों की माफी","2. ₹1,250 की मासिक पेंशन (महिलाएँ 55+, पुरुष 58+)","3. MSP के ऊपर ₹150 प्रति क्विंटल का बोनस","4. मंडियों में रियायती दरों पर गुणवत्तापूर्ण भोजन"],"ho":["A-1, B-3, C-2, D-4","A-3, B-1, C-4, D-2","A-3, B-1, C-2, D-4","A-2, B-1, C-3, D-4"],"he":["राजस्थान कृषक समर्थन योजना: MSP के ऊपर ₹150 प्रति क्विंटल का बोनस (राज्य द्वारा ₹320.50 करोड़ का भुगतान)। रबी विपणन सीज़न 2025-26: ₹2,425 प्रति क्विंटल के MSP पर 327 केंद्रों के माध्यम से 1.73 लाख किसानों से 21.37 लाख मीट्रिक टन गेहूँ की खरीद।","राजस्थान कृषक ऋण माफी योजना: 30 नवंबर 2018 को बकाया अल्पकालिक फसली ऋण; 20.92 लाख किसान लाभान्वित; ₹7,881.89 करोड़ की राहत (मार्च 2025 तक)।","लघु एवं सीमांत वृद्ध कृषक सम्मान पेंशन: ₹1,250 प्रति माह; 1.97 लाख लाभार्थी।","किसान कलेवा योजना: कृषि उपज मंडी समितियों में रियायती दरों पर गुणवत्तापूर्ण भोजन; 18.26 लाख किसान और श्रमिक लाभान्वित।"],"hi":"प्रत्येक योजना को उसकी विशिष्ट संख्या से जोड़ें (₹150 बोनस, 30 नवंबर 2018 की सीमा, ₹1,250 पेंशन)।","hs":"अध्याय 1, पृ. 25-26 (चित्र 1.11)."},{"n":37,"t":"Multi-statement","g":"UPSC","ans":3,"q":["Consider the following statements regarding the Mahatma Jyotiba Phule Mandi Shramik Kalyan Scheme and related welfare support:","1. The scheme was launched in 2015 for the welfare of labourers of agricultural produce markets.","2. Marriage assistance of ₹75,000 is given for the labourer's own marriage or the marriage of up to two daughters.","3. Pregnancy assistance is the wage equivalent of 15 days for women labourers and 45 days for the father.","4. Medical assistance of ₹20,000 is provided for treatment of serious diseases in government or authorised hospitals.","Which of the statements given above is/are correct?"],"o":["1 and 3 only","2 and 3 only","1, 2, 3 and 4","1, 2 and 4 only"],"e":["Statement 3: Incorrect. The pregnancy benefit is the reverse: wage equivalent of 45 days for licensed women labourers (up to two pregnancies) and 15 days for the father of a newborn.","Statements 1, 2 and 4: Correct. The scheme was launched in 2015. In 2025-26 (up to December), 698 labourers benefited with ₹3.51 crore. There is also a scholarship or merit award for children scoring 60% or above."],"i":"Welfare schemes for mandi labour test benefit amounts and the sex-specific details; read each carefully.","s":"Chapter 1, p. 26 (Figure 1.11).","hq":["महात्मा ज्योतिबा फुले मंडी श्रमिक कल्याण योजना और संबंधित कल्याण सहायता के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. यह योजना कृषि उपज मंडियों के श्रमिकों के कल्याण हेतु 2015 में शुरू की गई।","2. श्रमिक के स्वयं के विवाह या अधिकतम दो पुत्रियों के विवाह के लिए ₹75,000 की विवाह सहायता दी जाती है।","3. प्रसूति सहायता महिला श्रमिकों के लिए 15 दिन की मज़दूरी के बराबर और पिता के लिए 45 दिन की मज़दूरी के बराबर है।","4. गंभीर रोगों के उपचार हेतु सरकारी या अधिकृत अस्पतालों में ₹20,000 की चिकित्सा सहायता दी जाती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 3","केवल 2 और 3","1, 2, 3 और 4","केवल 1, 2 और 4"],"he":["कथन 3: गलत। प्रसूति लाभ इसके उलट है: लाइसेंसधारी महिला श्रमिकों के लिए 45 दिन की मज़दूरी के बराबर (अधिकतम दो प्रसवों तक) और नवजात के पिता के लिए 15 दिन की मज़दूरी के बराबर।","कथन 1, 2 और 4: सही। योजना 2015 में शुरू हुई। 2025-26 (दिसंबर तक) में 698 श्रमिक ₹3.51 करोड़ से लाभान्वित हुए। 60% या उससे अधिक अंक पाने वाले बच्चों के लिए छात्रवृत्ति या मेधा पुरस्कार भी है।"],"hi":"मंडी श्रमिकों की कल्याण योजनाएँ लाभ राशि और लिंग-विशिष्ट विवरण की परीक्षा लेती हैं; प्रत्येक को ध्यान से पढ़ें।","hs":"अध्याय 1, पृ. 26 (चित्र 1.11)."},{"n":38,"t":"Assertion and Reason","g":"UPSC","ans":1,"q":["Assertion (A): Dairy development through cooperative institutions has emerged as a major driver of inclusive rural growth in Rajasthan.","Reason (R): Rajasthan contributed 14.51 per cent of the country's milk production in 2023-24."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["A is the Review's own statement. R is also correct (14.51%).","But R gives the state's scale, not the reason cooperatives drive inclusion. The Review explains inclusion through assured market access, regular income and strong participation of women. About 10 lakh milk producers are in the cooperative programme and ₹4,304.91 crore was disbursed to them up to December 2025."],"i":"In Assertion-Reason questions, a true statement is not automatically an explanation. Ask whether R answers \"why\".","s":"Chapter 1, pp. 1, 20, 23.","hq":["अभिकथन (A): सहकारी संस्थाओं के माध्यम से डेयरी विकास राजस्थान में समावेशी ग्रामीण विकास का प्रमुख चालक बनकर उभरा है।","कारण (R): राजस्थान ने 2023-24 में देश के दुग्ध उत्पादन में 14.51 प्रतिशत का योगदान दिया।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["A समीक्षा का अपना कथन है। R भी सही है (14.51%)।","परंतु R राज्य का पैमाना बताता है, यह नहीं कि सहकारी संस्थाएँ समावेशन क्यों बढ़ाती हैं। समीक्षा समावेशन को सुनिश्चित बाज़ार पहुँच, नियमित आय और महिलाओं की सशक्त भागीदारी से समझाती है। सहकारी कार्यक्रम में लगभग 10 लाख दुग्ध उत्पादक हैं और दिसंबर 2025 तक उन्हें ₹4,304.91 करोड़ वितरित हुए।"],"hi":"अभिकथन-कारण प्रश्नों में सही कथन अपने-आप व्याख्या नहीं होता। पूछें कि क्या R \"क्यों\" का उत्तर देता है।","hs":"अध्याय 1, पृ. 1, 20, 23."},{"n":39,"t":"Data / application","g":"RAS + UPSC","ans":2,"q":["Based on the Review's figures (expenditure up to December 2025 against provision), which scheme had the highest percentage utilisation?"],"o":["Paramparagat Krishi Vikas Yojana (₹4.20 crore against ₹42.07 crore)","Rashtriya Krishi Vikas Yojana (₹20.56 crore against ₹40.14 crore)","National Mission on Edible Oil-Oilseed (₹105.73 crore against ₹125.00 crore)","National Horticulture Mission (₹48.83 crore against ₹124.76 crore)"],"e":["Utilisation: PKVY = 9.98%, RKVY = 51.2%, Oilseed mission = 84.6%, NHM = 39.1%.","These are part-year (up to December) figures, so the comparison is only of progress to date, not final outcomes."],"i":"Percentage-of-allocation questions test arithmetic under time pressure. Quick method: compare ratios by rounding (e.g. 105.73/125 is close to 0.85).","s":"Chapter 1, pp. 14-16.","hq":["समीक्षा के आँकड़ों (प्रावधान के विरुद्ध दिसंबर 2025 तक व्यय) के आधार पर, किस योजना का प्रतिशत उपयोग सर्वाधिक रहा?"],"ho":["परंपरागत कृषि विकास योजना (₹42.07 करोड़ के विरुद्ध ₹4.20 करोड़)","राष्ट्रीय कृषि विकास योजना (₹40.14 करोड़ के विरुद्ध ₹20.56 करोड़)","राष्ट्रीय खाद्य तेल-तिलहन मिशन (₹125.00 करोड़ के विरुद्ध ₹105.73 करोड़)","राष्ट्रीय बागवानी मिशन (₹124.76 करोड़ के विरुद्ध ₹48.83 करोड़)"],"he":["उपयोग: PKVY = 9.98%, RKVY = 51.2%, तिलहन मिशन = 84.6%, NHM = 39.1%।","ये आंशिक वर्ष (दिसंबर तक) के आँकड़े हैं, इसलिए तुलना केवल अब तक की प्रगति की है, अंतिम परिणामों की नहीं।"],"hi":"आवंटन के प्रतिशत वाले प्रश्न समय के दबाव में अंकगणित की परीक्षा लेते हैं। शीघ्र विधि: अनुपातों को पूर्णांकित कर तुलना करें (जैसे 105.73/125 लगभग 0.85 के पास)।","hs":"अध्याय 1, पृ. 14-16."},{"n":40,"t":"Chronology","g":"RAS","ans":3,"q":["Arrange the following schemes or events in chronological order of their start/announcement, as stated in the Economic Review:","A. National Food Security and Nutrition Mission (launched in the State)","B. Mahatma Jyotiba Phule Mandi Shramik Kalyan Scheme","C. Pradhan Mantri Fasal Bima Yojana","D. Agriculture Infrastructure Fund announcement","Select the correct chronological order (earliest to latest)."],"o":["B-A-C-D","A-C-B-D","A-B-D-C","A-B-C-D"],"e":["NFSNM was launched in the State from Rabi 2007-08, the Mahatma Jyotiba Phule Mandi Shramik Kalyan Scheme in 2015, PMFBY from Kharif 2016, and the Agriculture Infrastructure Fund was announced on 15 May 2020.","More recent: PMDDKY, NMNF and the Mission for Aatmanirbharta in Pulses (2025-26 onwards)."],"i":"Chronology questions reward remembering one anchor year per scheme.","s":"Chapter 1, pp. 13-16, 26.","hq":["निम्नलिखित योजनाओं या घटनाओं को आर्थिक समीक्षा में उल्लिखित उनके आरंभ/घोषणा के कालक्रम में व्यवस्थित कीजिए:","A. राष्ट्रीय खाद्य सुरक्षा एवं पोषण मिशन (राज्य में शुरू)","B. महात्मा ज्योतिबा फुले मंडी श्रमिक कल्याण योजना","C. प्रधानमंत्री फसल बीमा योजना","D. कृषि अवसंरचना कोष की घोषणा","सही कालक्रम (प्राचीनतम से नवीनतम) चुनिए।"],"ho":["B-A-C-D","A-C-B-D","A-B-D-C","A-B-C-D"],"he":["NFSNM राज्य में रबी 2007-08 से शुरू हुआ, महात्मा ज्योतिबा फुले मंडी श्रमिक कल्याण योजना 2015 में, PMFBY खरीफ 2016 से, और कृषि अवसंरचना कोष की घोषणा 15 मई 2020 को हुई।","अधिक हाल की: PMDDKY, NMNF और दलहन में आत्मनिर्भरता मिशन (2025-26 से)।"],"hi":"कालक्रम प्रश्नों में प्रत्येक योजना का एक आधार वर्ष याद रखना पर्याप्त है।","hs":"अध्याय 1, पृ. 13-16, 26."}],"2":[{"n":1,"t":"Multi-statement","g":"RAS + UPSC","ans":0,"q":["Consider the following statements based on NFHS-4 (2015-16) and NFHS-5 (2019-21) data for Rajasthan:","1. The Neonatal Mortality Rate (NNMR) fell from 29.8 to 20.2 per 1,000 live births and is now lower than the national figure of 24.9.","2. The Infant Mortality Rate (IMR) fell by 11 points to 30.3, which is lower than the national figure of 35.2.","3. The Under-Five Mortality Rate (U5MR) fell by 13.1 points to 37.6, which is lower than the national figure of 41.9.","4. In NFHS-4 (2015-16), Rajasthan's NNMR was lower than the national NNMR.","Which of the statements given above is/are correct?"],"o":["1, 2 and 3 only","1 and 2 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Correct. NNMR fell from 29.8 to 20.2 per 1,000 live births, now lower than India's 24.9.","Statement 2: Correct. IMR fell by 11 points (41.3 to 30.3), lower than India's 35.2.","Statement 3: Correct. U5MR fell by 13.1 points (50.7 to 37.6), lower than India's 41.9.","Statement 4: Incorrect. In NFHS-4 Rajasthan's NNMR (29.8) was slightly higher than India's (29.5). The state moved from slightly worse to clearly better than the national average."],"i":"Examiners ask about the position in the earlier round to test whether you know that Rajasthan has overtaken India. Always check which NFHS round a statement refers to.","s":"Chapter 2, pp. 28-29; Table 2.1.","hq":["राजस्थान के लिए NFHS-4 (2015-16) और NFHS-5 (2019-21) के आँकड़ों पर आधारित निम्नलिखित कथनों पर विचार कीजिए:","1. नवजात मृत्यु दर (NNMR) प्रति 1,000 जीवित जन्म पर 29.8 से घटकर 20.2 हो गई है और अब राष्ट्रीय आँकड़े 24.9 से कम है।","2. शिशु मृत्यु दर (IMR) 11 अंक घटकर 30.3 हो गई, जो राष्ट्रीय आँकड़े 35.2 से कम है।","3. पाँच वर्ष से कम आयु मृत्यु दर (U5MR) 13.1 अंक घटकर 37.6 हो गई, जो राष्ट्रीय आँकड़े 41.9 से कम है।","4. NFHS-4 (2015-16) में राजस्थान की NNMR राष्ट्रीय NNMR से कम थी।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 2 और 3","केवल 1 और 2","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 1: सही। NNMR प्रति 1,000 जीवित जन्म पर 29.8 से घटकर 20.2 हुई, जो अब भारत के 24.9 से कम है।","कथन 2: सही। IMR 11 अंक घटी (41.3 से 30.3), जो भारत के 35.2 से कम है।","कथन 3: सही। U5MR 13.1 अंक घटी (50.7 से 37.6), जो भारत के 41.9 से कम है।","कथन 4: गलत। NFHS-4 में राजस्थान की NNMR (29.8) भारत की (29.5) से थोड़ी अधिक थी। राज्य राष्ट्रीय औसत से थोड़ी खराब स्थिति से स्पष्ट रूप से बेहतर स्थिति में पहुँचा।"],"hi":"परीक्षक पहले चरण की स्थिति पूछकर जाँचते हैं कि क्या आप जानते हैं कि राजस्थान भारत से आगे निकल गया है। हमेशा देखें कि कथन किस NFHS चरण का है।","hs":"अध्याय 2, पृ. 28-29; तालिका 2.1."},{"n":2,"t":"Analytical","g":"UPSC","ans":3,"q":["NFHS data show anaemia among pregnant women (15-49 years) at 46.6% (NFHS-4) and 46.3% (NFHS-5) in Rajasthan, and 50.4% and 52.2% for India. Which inference is most valid?"],"o":["Rajasthan has almost eliminated anaemia among pregnant women.","Both Rajasthan and India recorded a similar decline over the period.","Rajasthan's prevalence rose while India's fell.","Rajasthan's level is lower than India's, but its own improvement has been marginal while India's prevalence rose."],"e":["Rajasthan's figure fell by only 0.3 points, while India's rose by 1.8 points. In NFHS-5 Rajasthan is 5.9 points below India's level.","So the state's relative position is good, but its absolute burden (46.3%) remains very high. The Executive Summary itself calls it \"stable\"."],"i":"UPSC often tests whether you can read 'better than the national average' separately from 'actually improved'.","s":"Chapter 2, pp. 29-30; Table 2.1.","hq":["NFHS के आँकड़े राजस्थान में गर्भवती महिलाओं (15-49 वर्ष) में एनीमिया 46.6% (NFHS-4) और 46.3% (NFHS-5) तथा भारत में 50.4% और 52.2% दर्शाते हैं। कौन-सा निष्कर्ष सबसे उपयुक्त है?"],"ho":["राजस्थान ने गर्भवती महिलाओं में एनीमिया लगभग समाप्त कर दिया है।","राजस्थान और भारत दोनों में इस अवधि में समान गिरावट दर्ज हुई।","राजस्थान में प्रसार बढ़ा जबकि भारत में घटा।","राजस्थान का स्तर भारत से कम है, परंतु उसका अपना सुधार मामूली रहा जबकि भारत में प्रसार बढ़ा।"],"he":["राजस्थान का आँकड़ा केवल 0.3 अंक घटा, जबकि भारत का 1.8 अंक बढ़ा। NFHS-5 में राजस्थान भारत के स्तर से 5.9 अंक नीचे है।","अतः राज्य की सापेक्ष स्थिति अच्छी है, परंतु उसका निरपेक्ष बोझ (46.3%) अब भी बहुत ऊँचा है। कार्यकारी सारांश इसे स्वयं \"स्थिर\" कहता है।"],"hi":"UPSC अक्सर परखता है कि क्या आप \"राष्ट्रीय औसत से बेहतर\" और \"वास्तव में सुधरा\" को अलग-अलग पढ़ सकते हैं।","hs":"अध्याय 2, पृ. 29-30; तालिका 2.1."},{"n":3,"t":"Incorrect statement","g":"RAS","ans":1,"q":["Which of the following statements regarding child nutrition in Rajasthan (NFHS-5, 2019-21) is NOT correct?"],"o":["Stunting among children under five fell by 7.3 points to 31.8 per cent.","Rajasthan's stunting prevalence (31.8 per cent) is higher than the national figure (35.5 per cent).","Wasting among children under five fell by 6.2 points to 16.8 per cent.","Underweight among children under five fell by 9.1 points to 27.6 per cent."],"e":["Rajasthan's stunting (31.8%) is lower than India's (35.5%), so (d) is wrong.","(a), (b) and (c) are correct: 39.1 to 31.8, 23.0 to 16.8 and 36.7 to 27.6.","In NFHS-4 Rajasthan was worse than India on all three (39.1 vs 38.4; 23.0 vs 21.0; 36.7 vs 35.8). It is better on all three in NFHS-5 (India: 35.5, 19.3, 32.1)."],"i":"The direction of comparison (higher/lower than India) is the classic one-word trap.","s":"Chapter 2, p. 30; Table 2.1.","hq":["राजस्थान में बाल पोषण (NFHS-5, 2019-21) के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["पाँच वर्ष से कम आयु के बच्चों में बौनापन 7.3 अंक घटकर 31.8 प्रतिशत हो गया।","राजस्थान में बौनेपन का प्रसार (31.8 प्रतिशत) राष्ट्रीय आँकड़े (35.5 प्रतिशत) से अधिक है।","पाँच वर्ष से कम आयु के बच्चों में दुबलापन 6.2 अंक घटकर 16.8 प्रतिशत हो गया।","पाँच वर्ष से कम आयु के बच्चों में कम वज़न 9.1 अंक घटकर 27.6 प्रतिशत हो गया।"],"he":["राजस्थान का बौनापन (31.8%) भारत के (35.5%) से कम है, इसलिए (b) गलत है।","(a), (c) और (d) सही हैं: 39.1 से 31.8, 23.0 से 16.8 और 36.7 से 27.6।","NFHS-4 में राजस्थान तीनों में भारत से खराब था (39.1 बनाम 38.4; 23.0 बनाम 21.0; 36.7 बनाम 35.8)। NFHS-5 में यह तीनों में बेहतर है (भारत: 35.5, 19.3, 32.1)।"],"hi":"तुलना की दिशा (भारत से अधिक/कम) क्लासिक एक-शब्द का जाल है।","hs":"अध्याय 2, पृ. 30; तालिका 2.1."},{"n":4,"t":"Data-based","g":"RAS + UPSC","ans":1,"q":["As per SRS data, Rajasthan's Maternal Mortality Ratio fell from 113 (2018-20) to 86 (2021-23) per lakh live births. The approximate percentage decline is:"],"o":["15 per cent","24 per cent","27 per cent","31 per cent"],"e":["Decline = (113 − 86) ÷ 113 = 27 ÷ 113 ≈ 23.9%, about 24%.","27 is the absolute fall (a distractor). Rajasthan's MMR (86) is now below India's (88), whereas in 2018-20 it was above it (113 vs 97). India's own fall was about 9%."],"i":"Percentage-fall versus point-fall is a common numerical trap. The MMR figures come from SRS (September 2025), not NFHS.","s":"Chapter 2, pp. 30-31; Table 2.2.","hq":["SRS आँकड़ों के अनुसार, राजस्थान का मातृ मृत्यु अनुपात प्रति लाख जीवित जन्म पर 113 (2018-20) से घटकर 86 (2021-23) हो गया। लगभग प्रतिशत गिरावट कितनी है?"],"ho":["15 प्रतिशत","24 प्रतिशत","27 प्रतिशत","31 प्रतिशत"],"he":["गिरावट = (113 − 86) ÷ 113 = 27 ÷ 113 ≈ 23.9%, यानी लगभग 24%।","27 निरपेक्ष गिरावट है (भ्रामक विकल्प)। राजस्थान का MMR (86) अब भारत के (88) से नीचे है, जबकि 2018-20 में यह ऊपर था (113 बनाम 97)। भारत की अपनी गिरावट लगभग 9% रही।"],"hi":"प्रतिशत गिरावट बनाम अंकों की गिरावट एक सामान्य संख्यात्मक जाल है। MMR के आँकड़े SRS (सितंबर 2025) से हैं, NFHS से नहीं।","hs":"अध्याय 2, पृ. 30-31; तालिका 2.2."},{"n":5,"t":"Multi-statement","g":"RAS + UPSC","ans":3,"q":["Consider the following statements regarding digital health initiatives:","1. The Ayushman Bharat Health Account (ABHA) is a digital health ID introduced under the Ayushman Bharat Digital Mission.","2. Up to December 2025, over 6.52 crore ABHA IDs have been generated in Rajasthan.","3. More than 2.38 crore health records have been linked to these IDs.","4. The Ayushman Bharat Digital Mission was launched by the Government of Rajasthan.","Which of the statements given above is/are correct?"],"o":["1 and 2 only","2 and 4 only","1, 2, 3 and 4","1, 2 and 3 only"],"e":["Statement 4: Incorrect. The Ayushman Bharat Digital Mission is a Government of India initiative of the Ministry of Health and Family Welfare. Rajasthan's own initiative is the Rajasthan Digital Health Mission.","Statements 1-3: Correct. ABHA is a digital health ID. Up to December 2025, over 6.52 crore ABHA IDs were generated in Rajasthan and more than 2.38 crore health records were linked."],"i":"Centre versus State ownership of a mission is a standard examiner's trap.","s":"Chapter 2, p. 27.","hq":["डिजिटल स्वास्थ्य पहलों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. आयुष्मान भारत स्वास्थ्य खाता (ABHA) आयुष्मान भारत डिजिटल मिशन के अंतर्गत शुरू की गई डिजिटल स्वास्थ्य आईडी है।","2. दिसंबर 2025 तक राजस्थान में 6.52 करोड़ से अधिक ABHA आईडी बनाई जा चुकी हैं।","3. इन आईडी से 2.38 करोड़ से अधिक स्वास्थ्य रिकॉर्ड जोड़े गए हैं।","4. आयुष्मान भारत डिजिटल मिशन राजस्थान सरकार द्वारा शुरू किया गया था।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 2","केवल 2 और 4","1, 2, 3 और 4","केवल 1, 2 और 3"],"he":["कथन 4: गलत। आयुष्मान भारत डिजिटल मिशन स्वास्थ्य एवं परिवार कल्याण मंत्रालय की भारत सरकार की पहल है। राजस्थान की अपनी पहल राजस्थान डिजिटल हेल्थ मिशन है।","कथन 1-3: सही। ABHA एक डिजिटल स्वास्थ्य आईडी है। दिसंबर 2025 तक राजस्थान में 6.52 करोड़ से अधिक ABHA आईडी बनीं और 2.38 करोड़ से अधिक स्वास्थ्य रिकॉर्ड जोड़े गए।"],"hi":"किसी मिशन का स्वामित्व केंद्र का है या राज्य का, यह परीक्षक का मानक जाल है।","hs":"अध्याय 2, पृ. 27."},{"n":6,"t":"Multi-statement","g":"UPSC","ans":0,"q":["Consider the following statements regarding primary healthcare policy as described in the Economic Review:","1. The National Health Policy 2017 recommended Health & Wellness Centres as the platform for Comprehensive Primary Healthcare.","2. It recommended allocating one-third of the health budget to primary healthcare.","3. In November 2023, MoHFW renamed Health & Wellness Centres as Ayushman Arogya Mandir.","4. Comprehensive Primary Healthcare covers preventive, promotive, curative, palliative and rehabilitative care.","Which of the statements given above is/are correct?"],"o":["1, 3 and 4 only","1 and 2 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 2: Incorrect. The National Health Policy 2017 recommended allocating two-thirds of the health budget to primary healthcare, not one-third.","Statements 1, 3 and 4: Correct. Health & Wellness Centres were the platform for Comprehensive Primary Healthcare (CPHC) and were renamed Ayushman Arogya Mandir (AAM) by MoHFW in November 2023. CPHC spans preventive, promotive, curative, palliative and rehabilitative care."],"i":"A numeric fraction swap (two-thirds versus one-third) is typical of UPSC policy questions.","s":"Chapter 2, p. 32.","hq":["आर्थिक समीक्षा में वर्णित प्राथमिक स्वास्थ्य देखभाल नीति के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राष्ट्रीय स्वास्थ्य नीति 2017 ने व्यापक प्राथमिक स्वास्थ्य देखभाल के मंच के रूप में स्वास्थ्य एवं आरोग्य केंद्रों की अनुशंसा की।","2. इसने स्वास्थ्य बजट का एक-तिहाई प्राथमिक स्वास्थ्य देखभाल को आवंटित करने की अनुशंसा की।","3. नवंबर 2023 में MoHFW ने स्वास्थ्य एवं आरोग्य केंद्रों का नाम बदलकर आयुष्मान आरोग्य मंदिर कर दिया।","4. व्यापक प्राथमिक स्वास्थ्य देखभाल में निवारक, प्रोत्साहक, उपचारात्मक, उपशामक और पुनर्वास देखभाल शामिल हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 3 और 4","केवल 1 और 2","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 2: गलत। राष्ट्रीय स्वास्थ्य नीति 2017 ने स्वास्थ्य बजट का एक-तिहाई नहीं, बल्कि दो-तिहाई प्राथमिक स्वास्थ्य देखभाल को आवंटित करने की अनुशंसा की।","कथन 1, 3 और 4: सही। स्वास्थ्य एवं आरोग्य केंद्र व्यापक प्राथमिक स्वास्थ्य देखभाल (CPHC) के मंच थे और नवंबर 2023 में MoHFW ने इनका नाम आयुष्मान आरोग्य मंदिर (AAM) कर दिया। CPHC निवारक, प्रोत्साहक, उपचारात्मक, उपशामक और पुनर्वास देखभाल तक फैली है।"],"hi":"संख्यात्मक भिन्न की अदला-बदली (दो-तिहाई बनाम एक-तिहाई) UPSC के नीति प्रश्नों की विशेषता है।","hs":"अध्याय 2, पृ. 32."},{"n":7,"t":"Data-based","g":"RAS + UPSC","ans":2,"q":["Table 2.3 gives the number of functional Ayushman Arogya Mandirs (AAM) and those where the expanded package of services has been rolled out. Which facility type has rolled out the expanded package in 100 per cent of its functional AAMs?"],"o":["Primary Health Centres (2,485 functional; 2,113 rolled out)","Sub Health Centres (14,742 functional; 6,854 rolled out)","Ayush Ayushman Arogya Mandirs (2,019 functional; 2,019 rolled out)","Urban Primary Health Centres (299 functional; 292 rolled out)"],"e":["Ayush AAMs: 2,019 ÷ 2,019 = 100%.","Others: PHC 85.0%, SHC 46.5% (the lowest), UPHC 97.7%, Urban AAM 88.3%. Overall 11,571 of 19,877 (58.2%)."],"i":"Sub Health Centres form the bulk of AAMs, so their lower roll-out (46.5%) pulls down the state average. Know the total (19,877) and roll-out (11,571) figures.","s":"Chapter 2, p. 32; Table 2.3.","hq":["तालिका 2.3 में क्रियाशील आयुष्मान आरोग्य मंदिरों (AAM) की संख्या और उनमें से जहाँ विस्तारित सेवा पैकेज लागू हो चुका है, दी गई है। किस सुविधा प्रकार ने अपने 100 प्रतिशत क्रियाशील AAM में विस्तारित पैकेज लागू किया है?"],"ho":["प्राथमिक स्वास्थ्य केंद्र (2,485 क्रियाशील; 2,113 में लागू)","उप स्वास्थ्य केंद्र (14,742 क्रियाशील; 6,854 में लागू)","आयुष आयुष्मान आरोग्य मंदिर (2,019 क्रियाशील; 2,019 में लागू)","शहरी प्राथमिक स्वास्थ्य केंद्र (299 क्रियाशील; 292 में लागू)"],"he":["आयुष AAM: 2,019 ÷ 2,019 = 100%।","अन्य: PHC 85.0%, SHC 46.5% (सबसे कम), UPHC 97.7%, शहरी AAM 88.3%। कुल 19,877 में से 11,571 (58.2%)।"],"hi":"उप स्वास्थ्य केंद्र AAM का बड़ा हिस्सा हैं, इसलिए उनका कम क्रियान्वयन (46.5%) राज्य औसत को नीचे खींचता है। कुल संख्या (19,877) और क्रियान्वयन (11,571) याद रखें।","hs":"अध्याय 2, पृ. 32; तालिका 2.3."},{"n":8,"t":"Classification","g":"UPSC","ans":3,"q":["Which one of the following is NOT among the 12 services provided under Comprehensive Primary Healthcare at Ayushman Arogya Mandirs?"],"o":["Care for common ophthalmic and ENT problems","Basic oral healthcare","Emergency medical services including care for burns and trauma","Organ transplantation and specialised surgical care"],"e":["The 12 services include: care in pregnancy and child-birth; neonatal and infant care; childhood and adolescent care; family planning; communicable disease management; general OPD for minor ailments; NCD screening and management; ophthalmic and ENT care; basic oral healthcare; elderly and palliative care; emergency medical services; and screening and basic management of mental health ailments.","Organ transplantation is a tertiary-care service (it appears under MAAY packages, not primary care)."],"i":"Classification of primary versus secondary and tertiary care is a recurring UPSC concept.","s":"Chapter 2, p. 32.","hq":["आयुष्मान आरोग्य मंदिरों में व्यापक प्राथमिक स्वास्थ्य देखभाल के अंतर्गत दी जाने वाली 12 सेवाओं में निम्नलिखित में से कौन-सी शामिल नहीं है?"],"ho":["सामान्य नेत्र और ENT समस्याओं की देखभाल","बुनियादी मुख स्वास्थ्य देखभाल","जलने और आघात की देखभाल सहित आपातकालीन चिकित्सा सेवाएँ","अंग प्रत्यारोपण और विशिष्ट शल्य चिकित्सा देखभाल"],"he":["12 सेवाओं में शामिल हैं: गर्भावस्था और प्रसव की देखभाल; नवजात और शिशु देखभाल; बाल्यावस्था और किशोर देखभाल; परिवार नियोजन; संचारी रोग प्रबंधन; मामूली बीमारियों हेतु सामान्य OPD; NCD जाँच और प्रबंधन; नेत्र और ENT देखभाल; बुनियादी मुख स्वास्थ्य देखभाल; वृद्ध और उपशामक देखभाल; आपातकालीन चिकित्सा सेवाएँ; तथा मानसिक स्वास्थ्य संबंधी बीमारियों की जाँच और बुनियादी प्रबंधन।","अंग प्रत्यारोपण तृतीयक देखभाल सेवा है (यह प्राथमिक देखभाल में नहीं, MAAY पैकेजों में आती है)।"],"hi":"प्राथमिक बनाम द्वितीयक और तृतीयक देखभाल का वर्गीकरण UPSC की बार-बार आने वाली अवधारणा है।","hs":"अध्याय 2, पृ. 32."},{"n":9,"t":"Pairs (count correct)","g":"RAS","ans":2,"q":["Consider the following pairs of institutions with their numbers in Rajasthan (up to December 2025). How many of the pairs are correctly matched?","1. Ayurvedic Hospitals: 127","2. Ayurveda Dispensaries: 3,575","3. Unani Hospitals: 12","4. Homoeopathic Hospitals: 189"],"o":["Only one","Only two","Only three","All four"],"e":["Pairs 1-3 are correct: 127 Ayurvedic Hospitals, 3,575 Ayurveda Dispensaries and 12 Unani hospitals.","Pair 4: Incorrect. Homoeopathy has 7 hospitals and 189 dispensaries. The number 189 refers to dispensaries."],"i":"Hospital versus dispensary counts are routinely swapped. The Executive Summary loosely calls the 127 Ayurvedic institutions \"district hospitals\" (see data flags).","s":"Chapter 2, p. 33; Table 2.4.","hq":["राजस्थान में संस्थाओं और उनकी संख्या (दिसंबर 2025 तक) के निम्नलिखित युग्मों पर विचार कीजिए। कितने युग्म सही सुमेलित हैं?","1. आयुर्वेदिक अस्पताल: 127","2. आयुर्वेद औषधालय: 3,575","3. यूनानी अस्पताल: 12","4. होम्योपैथिक अस्पताल: 189"],"ho":["केवल एक","केवल दो","केवल तीन","सभी चार"],"he":["युग्म 1-3 सही हैं: 127 आयुर्वेदिक अस्पताल, 3,575 आयुर्वेद औषधालय और 12 यूनानी अस्पताल।","युग्म 4: गलत। होम्योपैथी में 7 अस्पताल और 189 औषधालय हैं। संख्या 189 औषधालयों की है।"],"hi":"अस्पताल और औषधालय की संख्याएँ अक्सर आपस में बदल दी जाती हैं। कार्यकारी सारांश 127 आयुर्वेदिक संस्थाओं को ढीले ढंग से \"जिला अस्पताल\" कहता है (डेटा फ्लैग देखें)।","hs":"अध्याय 2, पृ. 33; तालिका 2.4."},{"n":10,"t":"Multi-statement","g":"RAS + UPSC","ans":0,"q":["Consider the following statements regarding the Mukhyamantri Ayushman Arogya Yojana (MAAY):","1. The scheme offers cashless treatment up to ₹25 lakh per family per year entirely under insurance mode.","2. The new phase has a premium of ₹2,370 per family and covers 2,179 packages (2,002 in insurance mode and 177 in trust mode).","3. Families not in the covered categories can enrol by paying an annual premium of ₹850 per family, the rest being paid by the State.","4. About 1.36 crore families are registered under the scheme.","Which of the statements given above is/are correct?"],"o":["2, 3 and 4 only","1 and 2 only","1, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 1: Incorrect. The ₹25 lakh limit is split: ₹5 lakh in insurance mode and ₹20 lakh in trust mode, with special packages (organ transplants, cochlear implants).","Statement 2: Correct. 2,002 + 177 = 2,179 packages; premium ₹2,370 per family.","Statement 3: Correct. Families outside the covered categories pay ₹850 per year; the State pays the rest.","Statement 4: Correct. About 1.36 crore families are registered."],"i":"The insurance-mode versus trust-mode split is a favourite detail. Covered categories include NFSA, SECC, contractual workers, small and marginal farmers, EWS, senior citizens and COVID-19 ex-gratia beneficiaries.","s":"Chapter 2, pp. 33-34.","hq":["मुख्यमंत्री आयुष्मान आरोग्य योजना (MAAY) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. योजना प्रति परिवार प्रति वर्ष ₹25 लाख तक का कैशलेस उपचार पूर्णतः बीमा मोड में देती है।","2. नए चरण में प्रति परिवार प्रीमियम ₹2,370 है और 2,179 पैकेज शामिल हैं (2,002 बीमा मोड में और 177 ट्रस्ट मोड में)।","3. कवर की गई श्रेणियों से बाहर के परिवार ₹850 प्रति परिवार वार्षिक प्रीमियम देकर नामांकन कर सकते हैं, शेष राज्य द्वारा चुकाया जाता है।","4. योजना के अंतर्गत लगभग 1.36 करोड़ परिवार पंजीकृत हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 2, 3 और 4","केवल 1 और 2","केवल 1, 3 और 4","1, 2, 3 और 4"],"he":["कथन 1: गलत। ₹25 लाख की सीमा बँटी हुई है: ₹5 लाख बीमा मोड में और ₹20 लाख ट्रस्ट मोड में, साथ में विशेष पैकेज (अंग प्रत्यारोपण, कॉक्लियर इम्प्लांट)।","कथन 2: सही। 2,002 + 177 = 2,179 पैकेज; प्रीमियम ₹2,370 प्रति परिवार।","कथन 3: सही। कवर की गई श्रेणियों से बाहर के परिवार प्रति वर्ष ₹850 देते हैं; शेष राज्य देता है।","कथन 4: सही। लगभग 1.36 करोड़ परिवार पंजीकृत हैं।"],"hi":"बीमा मोड बनाम ट्रस्ट मोड का विभाजन एक पसंदीदा विवरण है। कवर की गई श्रेणियों में NFSA, SECC, संविदा कर्मी, लघु और सीमांत किसान, EWS, वरिष्ठ नागरिक और COVID-19 अनुग्रह राशि लाभार्थी शामिल हैं।","hs":"अध्याय 2, पृ. 33-34."},{"n":11,"t":"Multi-statement","g":"RAS + UPSC","ans":3,"q":["Consider the following statements regarding portability and progress under MAAY:","1. From April 2025, beneficiaries from other States receive cashless treatment in Rajasthan (inbound portability).","2. Outbound portability for Rajasthan's beneficiaries also began in April 2025 along with inbound portability.","3. e-KYC has been completed for 2.29 crore individuals against a target of 2.86 crore.","4. During 2025-26 (up to December), expenditure was ₹2,080 crore against a provision of ₹2,800 crore.","Which of the statements given above is/are correct?"],"o":["2 and 3 only","1 and 2 only","1, 2, 3 and 4","1, 3 and 4 only"],"e":["Statement 2: Incorrect. Outbound portability began in December 2025, whereas inbound portability began in April 2025.","Statements 1, 3 and 4: Correct. e-KYC was completed for 2.29 crore individuals (target 2.86 crore). Expenditure was ₹2,080 crore against a provision of ₹2,800 crore (2025-26, up to December)."],"i":"Inbound (others coming into the state) versus outbound (state residents going out) is a classic confusion.","s":"Chapter 2, p. 34.","hq":["MAAY के अंतर्गत पोर्टेबिलिटी और प्रगति के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. अप्रैल 2025 से अन्य राज्यों के लाभार्थियों को राजस्थान में कैशलेस उपचार मिलता है (इनबाउंड पोर्टेबिलिटी)।","2. राजस्थान के लाभार्थियों के लिए आउटबाउंड पोर्टेबिलिटी भी इनबाउंड पोर्टेबिलिटी के साथ अप्रैल 2025 में शुरू हुई।","3. 2.86 करोड़ के लक्ष्य के विरुद्ध 2.29 करोड़ व्यक्तियों का e-KYC पूरा हो चुका है।","4. 2025-26 (दिसंबर तक) में ₹2,800 करोड़ के प्रावधान के विरुद्ध ₹2,080 करोड़ व्यय हुआ।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 2 और 3","केवल 1 और 2","1, 2, 3 और 4","केवल 1, 3 और 4"],"he":["कथन 2: गलत। आउटबाउंड पोर्टेबिलिटी दिसंबर 2025 में शुरू हुई, जबकि इनबाउंड पोर्टेबिलिटी अप्रैल 2025 में शुरू हुई थी।","कथन 1, 3 और 4: सही। e-KYC 2.29 करोड़ व्यक्तियों का पूरा हुआ (लक्ष्य 2.86 करोड़)। व्यय ₹2,800 करोड़ के प्रावधान के विरुद्ध ₹2,080 करोड़ रहा (2025-26, दिसंबर तक)।"],"hi":"इनबाउंड (अन्य राज्यों से आने वाले) बनाम आउटबाउंड (राज्य के निवासियों का बाहर जाना) एक क्लासिक भ्रम है।","hs":"अध्याय 2, पृ. 34."},{"n":12,"t":"Single best answer","g":"RAS","ans":1,"q":["Which one of the following statements regarding free medicine and diagnostics schemes in Rajasthan is correct?"],"o":["The DAWA scheme list has 156 medicines, 428 surgical items and 1,238 sutures.","The DAWA scheme list comprises 1,238 medicines, 428 surgical items and 156 sutures.","Under the DAWA scheme, 3.90 crore patients benefited in 2025-26 (up to December).","The Free Diagnostic Scheme conducted 101.17 crore tests during 2025-26 alone."],"e":["The Mukhyamantri Nishulk Nirogi Rajasthan (DAWA) Yojana lists 1,238 medicines, 428 surgical items and 156 sutures. In 2025-26 (up to December), 15.73 crore patients benefited with ₹1,312.19 crore spent.","(b) 3.90 crore is the number of persons who got free diagnostics in 2025-26. (d) 101.17 crore is the cumulative first-phase total up to December 2025; the 2025-26 figure is 13.55 crore tests (₹531.56 crore)."],"i":"Cumulative versus current-year figures are one of the most common traps in Economic Survey data.","s":"Chapter 2, pp. 34, 36.","hq":["राजस्थान में निःशुल्क दवा और जाँच योजनाओं के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["DAWA योजना की सूची में 156 दवाइयाँ, 428 शल्य सामग्री और 1,238 सीवनें (सूचर) हैं।","DAWA योजना की सूची में 1,238 दवाइयाँ, 428 शल्य सामग्री और 156 सीवनें (सूचर) शामिल हैं।","DAWA योजना के अंतर्गत 2025-26 (दिसंबर तक) में 3.90 करोड़ रोगी लाभान्वित हुए।","निःशुल्क जाँच योजना में अकेले 2025-26 के दौरान 101.17 करोड़ जाँचें की गईं।"],"he":["मुख्यमंत्री निःशुल्क निरोगी राजस्थान (DAWA) योजना में 1,238 दवाइयाँ, 428 शल्य सामग्री और 156 सीवनें सूचीबद्ध हैं। 2025-26 (दिसंबर तक) में 15.73 करोड़ रोगी लाभान्वित हुए और ₹1,312.19 करोड़ व्यय हुआ।","(c) 3.90 करोड़ वह संख्या है जिन्होंने 2025-26 में निःशुल्क जाँच करवाई। (d) 101.17 करोड़ दिसंबर 2025 तक पहले चरण का संचयी कुल है; 2025-26 का आँकड़ा 13.55 करोड़ जाँचें (₹531.56 करोड़) है।"],"hi":"संचयी बनाम चालू वर्ष के आँकड़े आर्थिक सर्वेक्षण के डेटा में सबसे आम जालों में से हैं।","hs":"अध्याय 2, पृ. 34, 36."},{"n":13,"t":"Match the following","g":"RAS","ans":0,"q":["Match the health scheme (List I) with its description (List II) and select the correct answer using the code below.","A. Mukhyamantri Nishulk Nirogi Rajasthan (DAWA) Yojana","B. Mukhyamantri Bal Sambal Yojana","C. Rajasthan Government Health Scheme (RGHS)","D. Ayushman Vay Vandan Scheme","1. Relief to children suffering from rare diseases","2. Cashless treatment for senior citizens aged 70 and above","3. Free essential medicines for indoor and outdoor patients at public facilities","4. Cashless OPD/IPD for government employees, pensioners and dependents"],"o":["A-3, B-1, C-4, D-2","A-1, B-3, C-4, D-2","A-3, B-1, C-2, D-4","A-4, B-1, C-3, D-2"],"e":["DAWA Yojana: free essential medicines at medical colleges, district hospitals, CHCs, PHCs, sub-centres and AAMs.","Bal Sambal Yojana: relief for children with rare diseases (224 children certified, ₹65 lakh spent).","RGHS: about 13.65 lakh families; registration via Jan Aadhaar; more than 741 empanelled private hospitals in the State.","Ayushman Vay Vandan: launched on 29 October 2024 for cashless treatment of senior citizens aged 70 and above."],"i":"Scheme-to-beneficiary matching is the staple RAS scheme question.","s":"Chapter 2, p. 34.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (स्वास्थ्य योजना) का सूची II (विवरण) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. मुख्यमंत्री निःशुल्क निरोगी राजस्थान (DAWA) योजना","B. मुख्यमंत्री बाल संबल योजना","C. राजस्थान गवर्नमेंट हेल्थ स्कीम (RGHS)","D. आयुष्मान वय वंदन योजना","1. दुर्लभ रोगों से पीड़ित बच्चों को राहत","2. 70 वर्ष और उससे अधिक आयु के वरिष्ठ नागरिकों के लिए कैशलेस उपचार","3. सार्वजनिक सुविधाओं में भर्ती और बाह्य रोगियों के लिए निःशुल्क आवश्यक दवाइयाँ","4. सरकारी कर्मचारियों, पेंशनरों और आश्रितों के लिए कैशलेस OPD/IPD"],"ho":["A-3, B-1, C-4, D-2","A-1, B-3, C-4, D-2","A-3, B-1, C-2, D-4","A-4, B-1, C-3, D-2"],"he":["DAWA योजना: मेडिकल कॉलेजों, जिला अस्पतालों, CHC, PHC, उप-केंद्रों और AAM में निःशुल्क आवश्यक दवाइयाँ।","बाल संबल योजना: दुर्लभ रोगों से पीड़ित बच्चों को राहत (224 बच्चे प्रमाणित, ₹65 लाख व्यय)।","RGHS: लगभग 13.65 लाख परिवार; जन आधार के माध्यम से पंजीकरण; राज्य में 741 से अधिक सूचीबद्ध निजी अस्पताल।","आयुष्मान वय वंदन: 29 अक्टूबर 2024 को 70 वर्ष और उससे अधिक आयु के वरिष्ठ नागरिकों के कैशलेस उपचार हेतु शुरू हुई।"],"hi":"योजना को लाभार्थी से मिलाना RAS का मुख्य योजना प्रश्न है।","hs":"अध्याय 2, पृ. 34."},{"n":14,"t":"Assertion and Reason","g":"UPSC","ans":0,"q":["Assertion (A): The Mukhyamantri Ayushman Arogya Yojana contributes to Universal Health Coverage in Rajasthan.","Reason (R): It gives cashless treatment at government and empanelled private hospitals, protecting families from high out-of-pocket expenditure."],"o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"e":["The Review says the scheme aims to ensure quality services without financial hardship, protecting families against higher Out-of-Pocket Expenditure (OOPE) through cashless treatment at government and private empanelled hospitals.","Reducing financial barriers is the very mechanism of UHC, so R explains A."],"i":"UHC = access to quality services without financial hardship. OOPE is a key term.","s":"Chapter 2, pp. 27, 33.","hq":["अभिकथन (A): मुख्यमंत्री आयुष्मान आरोग्य योजना राजस्थान में सार्वभौमिक स्वास्थ्य कवरेज में योगदान देती है।","कारण (R): यह सरकारी और सूचीबद्ध निजी अस्पतालों में कैशलेस उपचार देती है, जिससे परिवार जेब से भारी खर्च से सुरक्षित रहते हैं।"],"ho":["A और R दोनों सत्य हैं, और R, A की सही व्याख्या है।","A और R दोनों सत्य हैं, परंतु R, A की सही व्याख्या नहीं है।","A सत्य है, परंतु R असत्य है।","A असत्य है, परंतु R सत्य है।"],"he":["समीक्षा के अनुसार योजना का उद्देश्य वित्तीय कठिनाई के बिना गुणवत्तापूर्ण सेवाएँ सुनिश्चित करना है, जो सरकारी और निजी सूचीबद्ध अस्पतालों में कैशलेस उपचार के माध्यम से परिवारों को उच्च जेब-खर्च (OOPE) से बचाती है।","वित्तीय बाधाएँ घटाना ही UHC की क्रियाविधि है, इसलिए R, A की व्याख्या करता है।"],"hi":"UHC = वित्तीय कठिनाई के बिना गुणवत्तापूर्ण सेवाओं की पहुँच। OOPE एक प्रमुख शब्द है।","hs":"अध्याय 2, पृ. 27, 33."},{"n":15,"t":"Direct factual","g":"RAS","ans":3,"q":["Mission Madhuhari, which provides free insulin, glucometers and strips to patients with Type 1 diabetes, was launched on 29 November 2024 at the District Hospital of:"],"o":["Pali","Karauli","Jalore","Nagaur"],"e":["Mission Madhuhari was launched at District Hospital, Nagaur. Training was given to paediatric specialists and doctors from 70 district and sub-district hospitals. More than 1,700 patients are registered (December 2025).","Pali, Karauli and Jalore are Mission Madhunetra sites (AI-based diabetic retinopathy screening), together with Beawar and CHC Deshnok (Bikaner)."],"i":"Distinguish Madhuhari (Type 1 diabetes) from Madhunetra (retinopathy screening).","s":"Chapter 2, p. 36.","hq":["मिशन मधुहारी, जो टाइप 1 मधुमेह के रोगियों को निःशुल्क इंसुलिन, ग्लूकोमीटर और स्ट्रिप्स देता है, 29 नवंबर 2024 को किस जिला अस्पताल में शुरू किया गया?"],"ho":["पाली","करौली","जालोर","नागौर"],"he":["मिशन मधुहारी जिला अस्पताल, नागौर में शुरू हुआ। 70 जिला और उप-जिला अस्पतालों के बाल रोग विशेषज्ञों और चिकित्सकों को प्रशिक्षण दिया गया। 1,700 से अधिक रोगी पंजीकृत हैं (दिसंबर 2025)।","पाली, करौली और जालोर मिशन मधुनेत्र (AI-आधारित मधुमेह रेटिनोपैथी जाँच) के स्थल हैं, साथ में बेवर और CHC देशनोक (बीकानेर)।"],"hi":"मधुहारी (टाइप 1 मधुमेह) को मधुनेत्र (रेटिनोपैथी जाँच) से अलग पहचानें।","hs":"अध्याय 2, पृ. 36."},{"n":16,"t":"Multi-statement","g":"RAS + UPSC","ans":0,"q":["Consider the following statements regarding diabetes and kidney care programmes in Rajasthan:","1. Mission Madhuhari has registered more than 1,700 Type 1 diabetes patients for free insulin, glucometers and glucose strips.","2. Mission Madhunetra provides AI-based diabetic retinopathy screening in all district hospitals of the State.","3. Under the PM National Dialysis Programme, haemodialysis is available in 61 district hospitals across 41 districts, with 145 machines.","4. During 2025-26 (up to December), 640 AI-based screenings for diabetic retinopathy were conducted, with 96 patients found positive.","Which of the statements given above is/are correct?"],"o":["1, 3 and 4 only","1 and 3 only","2 and 4 only","1, 2 and 3 only"],"e":["Statement 2: Incorrect. Mission Madhunetra started in an initial phase at 5 institutions (DH Pali, Beawar, Karauli, Jalore and CHC Deshnok), not in all district hospitals.","Statements 1, 3 and 4: Correct. Madhunetra: 640 AI-based screenings with 96 positives. Dialysis: 145 machines; 51,088 sessions for 6,653 registered patients in 2025-26 (up to December)."],"i":"AI-driven diagnostics link to the Review's digital-health theme. Note the phrase \"initial phase\".","s":"Chapter 2, p. 36.","hq":["राजस्थान में मधुमेह और गुर्दा देखभाल कार्यक्रमों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. मिशन मधुहारी में निःशुल्क इंसुलिन, ग्लूकोमीटर और ग्लूकोज़ स्ट्रिप्स के लिए 1,700 से अधिक टाइप 1 मधुमेह रोगी पंजीकृत हुए हैं।","2. मिशन मधुनेत्र राज्य के सभी जिला अस्पतालों में AI-आधारित मधुमेह रेटिनोपैथी जाँच उपलब्ध कराता है।","3. PM राष्ट्रीय डायलिसिस कार्यक्रम के अंतर्गत 41 जिलों के 61 जिला अस्पतालों में 145 मशीनों के साथ हीमोडायलिसिस उपलब्ध है।","4. 2025-26 (दिसंबर तक) में मधुमेह रेटिनोपैथी की 640 AI-आधारित जाँचें की गईं, जिनमें 96 रोगी पॉज़िटिव पाए गए।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1, 3 और 4","केवल 1 और 3","केवल 2 और 4","केवल 1, 2 और 3"],"he":["कथन 2: गलत। मिशन मधुनेत्र प्रारंभिक चरण में 5 संस्थाओं (DH पाली, बेवर, करौली, जालोर और CHC देशनोक) में शुरू हुआ, सभी जिला अस्पतालों में नहीं।","कथन 1, 3 और 4: सही। मधुनेत्र: 640 AI-आधारित जाँचें, 96 पॉज़िटिव। डायलिसिस: 145 मशीनें; 2025-26 (दिसंबर तक) 6,653 पंजीकृत रोगियों के लिए 51,088 सत्र।"],"hi":"AI-आधारित निदान समीक्षा के डिजिटल स्वास्थ्य विषय से जुड़ता है। \"प्रारंभिक चरण\" वाक्यांश पर ध्यान दें।","hs":"अध्याय 2, पृ. 36."},{"n":17,"t":"Multi-statement","g":"RAS + UPSC","ans":1,"q":["Consider the following statements regarding the Silicosis Policy-2019 of Rajasthan:","1. On certification of silicosis, ₹3 lakh is provided for rehabilitation.","2. A social security pension of ₹1,500 per month is given to the victim.","3. ₹5 lakh is given to the dependents of the family on death of the victim.","4. ₹10,000 is given to the family of the victim for funeral expenses.","Which of the statements given above is/are correct?"],"o":["1 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"],"e":["Statement 3: Incorrect. The family of a deceased victim gets ₹2 lakh, not ₹5 lakh.","Statements 1, 2 and 4: Correct. ₹3 lakh for rehabilitation on certification, ₹1,500 per month pension and ₹10,000 for funeral expenses. Widow pension is ₹1,250 to ₹1,500 by age group.","Up to December, 20,478 silicosis victims/families received ₹614.86 crore, through central online payment at DSAP."],"i":"Silicosis is an occupational disease from dust exposure (mines, stone cutting). Rajasthan's package, including Palanhar and Aastha Card benefits, is a frequent social-security question.","s":"Chapter 2, p. 35.","hq":["राजस्थान की सिलिकोसिस नीति-2019 के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. सिलिकोसिस प्रमाणित होने पर पुनर्वास हेतु ₹3 लाख दिए जाते हैं।","2. पीड़ित को ₹1,500 प्रति माह की सामाजिक सुरक्षा पेंशन दी जाती है।","3. पीड़ित की मृत्यु पर परिवार के आश्रितों को ₹5 लाख दिए जाते हैं।","4. पीड़ित के परिवार को अंतिम संस्कार के खर्च हेतु ₹10,000 दिए जाते हैं।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 3","केवल 1, 2 और 4","केवल 2, 3 और 4","1, 2, 3 और 4"],"he":["कथन 3: गलत। मृतक पीड़ित के परिवार को ₹5 लाख नहीं, ₹2 लाख मिलते हैं।","कथन 1, 2 और 4: सही। प्रमाणन पर पुनर्वास हेतु ₹3 लाख, ₹1,500 मासिक पेंशन और अंतिम संस्कार हेतु ₹10,000। विधवा पेंशन आयु वर्ग के अनुसार ₹1,250 से ₹1,500 है।","दिसंबर तक 20,478 सिलिकोसिस पीड़ितों/परिवारों को DSAP पर केंद्रीय ऑनलाइन भुगतान के माध्यम से ₹614.86 करोड़ मिले।"],"hi":"सिलिकोसिस धूल के संपर्क (खदानें, पत्थर कटाई) से होने वाला व्यावसायिक रोग है। राजस्थान का पैकेज, पालनहार और आस्था कार्ड लाभ सहित, एक बार-बार पूछा जाने वाला सामाजिक सुरक्षा प्रश्न है।","hs":"अध्याय 2, पृ. 35."},{"n":18,"t":"Match the following","g":"RAS + UPSC","ans":3,"q":["Match the national health programme (List I) with the feature reported for Rajasthan (List II) and select the correct answer using the code below.","A. National Programme for Prevention and Control of Fluorosis (NPPCF)","B. National Viral Hepatitis Control Programme (NVHCP)","C. National Tobacco Control Programme (NTCP)","D. National Oral Health Programme (NOHP)","1. Tobacco-Free Youth Campaign 3.0 of 60 days","2. Implemented in 30 selected districts","3. 6,095 camps organised; 2.38 lakh patients examined","4. Four Model Treatment Centres at medical colleges"],"o":["A-1, B-4, C-2, D-3","A-2, B-3, C-1, D-4","A-4, B-2, C-3, D-1","A-2, B-4, C-1, D-3"],"e":["NPPCF (fluorosis): implemented in 30 selected districts; 1,020 villages identified as fluoride-affected.","NVHCP: launched in 2019; goal of eliminating Hepatitis C by 2030; four Model Treatment Centres at medical colleges of Jaipur, Jodhpur, Udaipur and Ajmer.","NTCP: the 60-day Tobacco-Free Youth Campaign 3.0.","NOHP: 6,095 camps; 2.38 lakh patients examined (2025-26, up to December)."],"i":"Programme-to-feature matches draw on distinct identifiers. Learn one identifier per programme.","s":"Chapter 2, pp. 35-36.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (राष्ट्रीय स्वास्थ्य कार्यक्रम) का सूची II (राजस्थान के लिए उल्लिखित विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. राष्ट्रीय फ्लोरोसिस रोकथाम एवं नियंत्रण कार्यक्रम (NPPCF)","B. राष्ट्रीय वायरल हेपेटाइटिस नियंत्रण कार्यक्रम (NVHCP)","C. राष्ट्रीय तंबाकू नियंत्रण कार्यक्रम (NTCP)","D. राष्ट्रीय मुख स्वास्थ्य कार्यक्रम (NOHP)","1. 60 दिन का तंबाकू-मुक्त युवा अभियान 3.0","2. 30 चयनित जिलों में क्रियान्वित","3. 6,095 शिविर आयोजित; 2.38 लाख रोगियों की जाँच","4. मेडिकल कॉलेजों में चार मॉडल उपचार केंद्र"],"ho":["A-1, B-4, C-2, D-3","A-2, B-3, C-1, D-4","A-4, B-2, C-3, D-1","A-2, B-4, C-1, D-3"],"he":["NPPCF (फ्लोरोसिस): 30 चयनित जिलों में क्रियान्वित; 1,020 गाँव फ्लोराइड-प्रभावित चिह्नित।","NVHCP: 2019 में शुरू; 2030 तक हेपेटाइटिस C उन्मूलन का लक्ष्य; जयपुर, जोधपुर, उदयपुर और अजमेर के मेडिकल कॉलेजों में चार मॉडल उपचार केंद्र।","NTCP: 60 दिन का तंबाकू-मुक्त युवा अभियान 3.0।","NOHP: 6,095 शिविर; 2.38 लाख रोगियों की जाँच (2025-26, दिसंबर तक)।"],"hi":"कार्यक्रम-विशेषता मिलान अलग-अलग पहचानकर्ताओं पर आधारित होता है। प्रत्येक कार्यक्रम के लिए एक पहचानकर्ता याद रखें।","hs":"अध्याय 2, पृ. 35-36."},{"n":19,"t":"Incorrect statement","g":"RAS","ans":2,"q":["Which of the following statements regarding the National Viral Hepatitis Control Programme (NVHCP) in Rajasthan is NOT correct?"],"o":["The programme was launched in the State in 2019 with the aim of eliminating Hepatitis C by 2030.","Four Model Treatment Centres operate at medical colleges in Jaipur, Jodhpur, Udaipur and Ajmer.","Of the 3,580 patients who tested positive for Hepatitis C in 2025-26 (up to December), all were provided treatment.","8.81 lakh patients were screened for Hepatitis B, of whom 10,555 were positive and 1,597 received treatment."],"e":["Only 1,026 of the 3,580 Hepatitis C positives received treatment, so (b) is incorrect.","Hepatitis B positivity was about 1.2% (10,555 of 8.81 lakh) and Hepatitis C about 0.5% (3,580 of 6.65 lakh). 50 NVHCP centres are operational. Expenditure was ₹2.18 crore against a provision of ₹12.59 crore."],"i":"\"All\" or \"only\" qualifiers often signal a wrong option.","s":"Chapter 2, pp. 35-36.","hq":["राजस्थान में राष्ट्रीय वायरल हेपेटाइटिस नियंत्रण कार्यक्रम (NVHCP) के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["कार्यक्रम राज्य में 2019 में 2030 तक हेपेटाइटिस C के उन्मूलन के उद्देश्य से शुरू किया गया था।","जयपुर, जोधपुर, उदयपुर और अजमेर के मेडिकल कॉलेजों में चार मॉडल उपचार केंद्र संचालित हैं।","2025-26 (दिसंबर तक) में हेपेटाइटिस C पॉज़िटिव पाए गए 3,580 रोगियों में से सभी को उपचार दिया गया।","8.81 लाख रोगियों की हेपेटाइटिस B जाँच हुई, जिनमें से 10,555 पॉज़िटिव थे और 1,597 को उपचार मिला।"],"he":["3,580 में से केवल 1,026 हेपेटाइटिस C पॉज़िटिव रोगियों को उपचार मिला, इसलिए (c) गलत है।","हेपेटाइटिस B पॉज़िटिविटी लगभग 1.2% (8.81 लाख में 10,555) और हेपेटाइटिस C लगभग 0.5% (6.65 लाख में 3,580) थी। 50 NVHCP केंद्र संचालित हैं। प्रावधान ₹12.59 करोड़ के विरुद्ध व्यय ₹2.18 करोड़ रहा।"],"hi":"\"सभी\" या \"केवल\" जैसे विशेषक अक्सर गलत विकल्प का संकेत देते हैं।","hs":"अध्याय 2, पृ. 35-36."},{"n":20,"t":"Data-based","g":"RAS + UPSC","ans":2,"q":["Under the \"Shudh Aahar Milavat Par War\" campaign, 38,647 food samples were collected through 14,998 inspections. Of these, 2,764 were sub-standard, 129 misbranded and 653 unsafe. Treating the three categories as mutually exclusive, the share of samples that failed in any way is closest to:"],"o":["3.5 per cent","7.2 per cent","9.2 per cent","12.5 per cent"],"e":["Failed samples = 2,764 + 129 + 653 = 3,546. Share = 3,546 ÷ 38,647 ≈ 9.2%.","7.2% is the sub-standard share alone (2,764 ÷ 38,647). The campaign began on 15 February 2024; expenditure in 2025-26 (up to December) was ₹13.61 crore."],"i":"Adding categories before dividing is the usual step that separates a right from a wrong answer.","s":"Chapter 2, p. 35.","hq":["\"शुद्ध आहार मिलावट पर वार\" अभियान के अंतर्गत 14,998 निरीक्षणों के माध्यम से 38,647 खाद्य नमूने एकत्र किए गए। इनमें से 2,764 अधो-मानक, 129 मिथ्या-ब्रांडेड और 653 असुरक्षित थे। तीनों श्रेणियों को परस्पर अपवर्जी मानते हुए, किसी भी प्रकार से अनुत्तीर्ण नमूनों का हिस्सा लगभग कितना है?"],"ho":["3.5 प्रतिशत","7.2 प्रतिशत","9.2 प्रतिशत","12.5 प्रतिशत"],"he":["अनुत्तीर्ण नमूने = 2,764 + 129 + 653 = 3,546। हिस्सा = 3,546 ÷ 38,647 ≈ 9.2%।","7.2% केवल अधो-मानक नमूनों का हिस्सा है (2,764 ÷ 38,647)। अभियान 15 फरवरी 2024 को शुरू हुआ; 2025-26 (दिसंबर तक) में व्यय ₹13.61 करोड़ रहा।"],"hi":"विभाजन से पहले श्रेणियों को जोड़ना वही चरण है जो सही उत्तर को गलत से अलग करता है।","hs":"अध्याय 2, पृ. 35."},{"n":21,"t":"Direct factual","g":"RAS","ans":0,"q":["The National Programme for Prevention and Control of Fluorosis (NPPCF) in Rajasthan is implemented in how many selected districts, and how many villages were identified as fluoride-affected in 2025-26 (as per the Ministry of Jal Shakti)?"],"o":["30 districts and 1,020 villages","41 districts and 1,020 villages","30 districts and 10,200 villages","33 districts and 1,200 villages"],"e":["The programme covers 30 selected districts. In 2025-26 (up to December), 19,805 suspected fluorosis patients were identified, with 7,260 confirmed.","The programme is important because high fluoride in drinking water is a major arid-zone issue (links to Chapter 8 on water security)."],"i":"Pair the programme with its geography. A 30 versus 41 district swap is typical.","s":"Chapter 2, p. 35.","hq":["राजस्थान में राष्ट्रीय फ्लोरोसिस रोकथाम एवं नियंत्रण कार्यक्रम (NPPCF) कितने चयनित जिलों में क्रियान्वित है, और 2025-26 में (जल शक्ति मंत्रालय के अनुसार) कितने गाँव फ्लोराइड-प्रभावित चिह्नित किए गए?"],"ho":["30 जिले और 1,020 गाँव","41 जिले और 1,020 गाँव","30 जिले और 10,200 गाँव","33 जिले और 1,200 गाँव"],"he":["कार्यक्रम 30 चयनित जिलों में है। 2025-26 (दिसंबर तक) में 19,805 संदिग्ध फ्लोरोसिस रोगी चिह्नित हुए, जिनमें 7,260 की पुष्टि हुई।","यह कार्यक्रम महत्वपूर्ण है क्योंकि पेयजल में उच्च फ्लोराइड शुष्क क्षेत्र की एक प्रमुख समस्या है (अध्याय 8, जल सुरक्षा से संबंध)।"],"hi":"कार्यक्रम को उसके भूगोल से जोड़ें। 30 बनाम 41 जिलों की अदला-बदली विशिष्ट जाल है।","hs":"अध्याय 2, पृ. 35."},{"n":22,"t":"Data interpretation","g":"RAS + UPSC","ans":3,"q":["The Executive Summary reports 2,875 PHCs, 849 CHCs and 76,720 beds, whereas Figure 2.3 (allopathic institutions, excluding medical colleges) shows 2,589 PHCs, 832 CHCs and 76,210 beds. The most likely reason for the difference is that the Executive Summary:"],"o":["is based on outdated data from an earlier year","excludes urban primary health centres","counts Ayurvedic institutions along with allopathic ones","adds the facilities functioning under the National Urban Health Mission (286 UPHCs, 17 UCHCs and 510 beds)"],"e":["2,589 + 286 = 2,875 PHCs; 832 + 17 = 849 CHCs; 76,210 + 510 = 76,720 beds. The totals match exactly once NUHM facilities are added.","Figure 2.3 also shows 267 hospitals (63 district, 125 sub-district, 32 satellite and 47 others), 15,292 sub-centres, 118 MCH centres and 183 dispensaries."],"i":"Reconciling two totals is excellent exam practice. Always check what the headline number includes.","s":"Chapter 2, p. 31 (Figure 2.3); Executive Summary, p. xiii.","hq":["कार्यकारी सारांश में 2,875 PHC, 849 CHC और 76,720 बिस्तर बताए गए हैं, जबकि चित्र 2.3 (मेडिकल कॉलेजों को छोड़कर एलोपैथिक संस्थाएँ) में 2,589 PHC, 832 CHC और 76,210 बिस्तर दिखाए गए हैं। अंतर का सबसे संभावित कारण यह है कि कार्यकारी सारांश:"],"ho":["पूर्व वर्ष के पुराने डेटा पर आधारित है","शहरी प्राथमिक स्वास्थ्य केंद्रों को शामिल नहीं करता","एलोपैथिक के साथ आयुर्वेदिक संस्थाओं को भी गिनता है","राष्ट्रीय शहरी स्वास्थ्य मिशन के अंतर्गत कार्यरत सुविधाओं (286 UPHC, 17 UCHC और 510 बिस्तर) को जोड़ता है"],"he":["2,589 + 286 = 2,875 PHC; 832 + 17 = 849 CHC; 76,210 + 510 = 76,720 बिस्तर। NUHM सुविधाएँ जोड़ने पर कुल बिल्कुल मेल खाते हैं।","चित्र 2.3 में 267 अस्पताल (63 जिला, 125 उप-जिला, 32 सैटेलाइट और 47 अन्य), 15,292 उप-केंद्र, 118 MCH केंद्र और 183 औषधालय भी दिखाए गए हैं।"],"hi":"दो कुल योगों का मिलान करना उत्कृष्ट परीक्षा अभ्यास है। हमेशा जाँचें कि शीर्ष आँकड़े में क्या शामिल है।","hs":"अध्याय 2, पृ. 31 (चित्र 2.3); कार्यकारी सारांश, पृ. xiii."},{"n":23,"t":"Incorrect statement","g":"RAS","ans":1,"q":["Which of the following statements regarding AYUSH initiatives in Rajasthan is NOT correct?"],"o":["2,019 Ayush dispensaries have been transformed into Ayushman Arogya Mandir (AYUSH).","The 11th International Yoga Day (21 June 2025) was celebrated with the theme \"Yoga for Women Empowerment\".","50 Ayushman Arogya Mandirs (AYUSH) have received NABH certification.","210 Ayushman Arogya Mandirs were selected in the first phase of the Ayushman Adarsh Gram Yojana, with 18 health indicators."],"e":["The theme was \"Yoga for One Earth, One Health\", with 138.22 lakh participants at 1.69 lakh locations in the State.","(a), (b) and (d) are as stated in the Review. Hospitals and dispensaries were also geo-tagged on Google Maps."],"i":"Event, theme and participation numbers are common Rajasthan GK crossovers.","s":"Chapter 2, pp. 37-38.","hq":["राजस्थान में आयुष पहलों के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?"],"ho":["2,019 आयुष औषधालयों को आयुष्मान आरोग्य मंदिर (आयुष) में परिवर्तित किया गया है।","11वाँ अंतर्राष्ट्रीय योग दिवस (21 जून 2025) \"महिला सशक्तिकरण के लिए योग\" विषय के साथ मनाया गया।","50 आयुष्मान आरोग्य मंदिरों (आयुष) को NABH प्रमाणन प्राप्त हुआ है।","आयुष्मान आदर्श ग्राम योजना के प्रथम चरण में 18 स्वास्थ्य संकेतकों के साथ 210 आयुष्मान आरोग्य मंदिर चुने गए।"],"he":["विषय \"एक पृथ्वी, एक स्वास्थ्य के लिए योग\" था, जिसमें राज्य के 1.69 लाख स्थानों पर 138.22 लाख प्रतिभागी शामिल हुए।","(a), (c) और (d) समीक्षा के अनुसार हैं। अस्पतालों और औषधालयों को गूगल मैप्स पर जियो-टैग भी किया गया।"],"hi":"आयोजन, विषय और भागीदारी की संख्याएँ राजस्थान GK के सामान्य क्रॉसओवर हैं।","hs":"अध्याय 2, पृ. 37-38."},{"n":24,"t":"Analytical","g":"UPSC","ans":0,"q":["Rajasthan's Total Fertility Rate (TFR) fell from 2.4 (NFHS-4) to 2.0 (NFHS-5), against a replacement level of about 2.1. What does this imply?"],"o":["Each generation is now slightly smaller than the previous one, but population can still grow for some time because of the large young age group (population momentum).","Rajasthan's population will begin to fall immediately.","Mortality has increased sharply in the State.","Fertility remains above replacement level."],"e":["Below-replacement fertility means a long-run trend toward stabilisation. The Review calls this progress toward population stabilisation, and notes TFR now equals India's (2.0).","Population momentum is a general demographic concept (not stated in the Review): a large cohort of young people entering reproductive ages keeps births high for a while."],"i":"UPSC likes concept-based demography. Do not equate \"TFR below replacement\" with \"immediate fall in population\".","s":"Chapter 2, p. 30.","hq":["राजस्थान की कुल प्रजनन दर (TFR) NFHS-4 के 2.4 से घटकर NFHS-5 में 2.0 हो गई, जबकि प्रतिस्थापन स्तर लगभग 2.1 है। इसका क्या तात्पर्य है?"],"ho":["प्रत्येक पीढ़ी अब पिछली पीढ़ी से थोड़ी छोटी है, परंतु बड़े युवा आयु वर्ग (जनसंख्या संवेग) के कारण जनसंख्या कुछ समय तक बढ़ सकती है।","राजस्थान की जनसंख्या तुरंत घटने लगेगी।","राज्य में मृत्यु दर तेज़ी से बढ़ी है।","प्रजनन दर अब भी प्रतिस्थापन स्तर से ऊपर है।"],"he":["प्रतिस्थापन से नीचे की प्रजनन दर का अर्थ दीर्घकाल में स्थिरीकरण की ओर प्रवृत्ति है। समीक्षा इसे जनसंख्या स्थिरीकरण की ओर प्रगति कहती है और ध्यान दिलाती है कि TFR अब भारत के बराबर (2.0) है।","जनसंख्या संवेग एक सामान्य जनांकिकीय अवधारणा है (समीक्षा में उल्लिखित नहीं): प्रजनन आयु में प्रवेश करता युवाओं का बड़ा समूह कुछ समय तक जन्मों की संख्या ऊँची बनाए रखता है।"],"hi":"UPSC अवधारणा-आधारित जनांकिकी पसंद करता है। \"TFR प्रतिस्थापन से नीचे\" को \"जनसंख्या में तुरंत गिरावट\" के बराबर न मानें।","hs":"अध्याय 2, पृ. 30."},{"n":25,"t":"Match the following","g":"UPSC","ans":2,"q":["Match the vaccine (List I) with the disease(s) it protects against (List II) and select the correct answer using the code below. (The vaccines are those reported in Table 2.6.)","A. BCG","B. MR-1","C. Penta-3","D. OPV-3","1. Poliomyelitis","2. Tuberculosis","3. Measles and rubella","4. Diphtheria, pertussis, tetanus, hepatitis B and Hib"],"o":["A-2, B-1, C-4, D-3","A-3, B-2, C-1, D-4","A-2, B-3, C-4, D-1","A-4, B-3, C-2, D-1"],"e":["BCG protects against tuberculosis. MR-1 is the first dose against measles and rubella. Penta-3 is the third dose of a pentavalent vaccine (diphtheria, pertussis, tetanus, hepatitis B and Hib). OPV-3 is the third dose of oral polio vaccine.","The vaccine-disease links are standard public-health facts, not from the Review. Table 2.6 (2025-26, up to December): TD 11.93 lakh, MR-1 11.73, Penta-3 11.24, OPV-3 11.16, BCG 10.98."],"i":"Immunisation questions mix static knowledge with programme data. Learn the table and the disease each vaccine covers.","s":"Chapter 2, p. 38; Table 2.6. Disease links: general knowledge.","m":[1,4,4],"h":["List I (Vaccine)","List II (Protection)"],"hq":["सूची I (टीका) का सूची II (जिन रोग/रोगों से सुरक्षा देता है) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए। (टीके वही हैं जो तालिका 2.6 में बताए गए हैं।)","A. BCG","B. MR-1","C. पेंटा-3","D. OPV-3","1. पोलियोमाइलाइटिस","2. क्षय रोग (टीबी)","3. खसरा और रूबेला","4. डिप्थीरिया, काली खाँसी, टिटनेस, हेपेटाइटिस B और हिब"],"ho":["A-2, B-1, C-4, D-3","A-3, B-2, C-1, D-4","A-2, B-3, C-4, D-1","A-4, B-3, C-2, D-1"],"he":["BCG क्षय रोग से सुरक्षा देता है। MR-1 खसरा और रूबेला के विरुद्ध पहली खुराक है। पेंटा-3 पेंटावैलेंट टीके की तीसरी खुराक है (डिप्थीरिया, काली खाँसी, टिटनेस, हेपेटाइटिस B और हिब)। OPV-3 मौखिक पोलियो टीके की तीसरी खुराक है।","टीका-रोग संबंध मानक जन-स्वास्थ्य तथ्य हैं, समीक्षा से नहीं। तालिका 2.6 (2025-26, दिसंबर तक): TD 11.93 लाख, MR-1 11.73, पेंटा-3 11.24, OPV-3 11.16, BCG 10.98।"],"hi":"टीकाकरण के प्रश्न स्थिर ज्ञान को कार्यक्रम के आँकड़ों से मिलाते हैं। तालिका और प्रत्येक टीके द्वारा कवर किया गया रोग सीखें।","hs":"अध्याय 2, पृ. 38; तालिका 2.6. रोग-संबंध: सामान्य ज्ञान."},{"n":26,"t":"Single best answer","g":"RAS + UPSC","ans":3,"q":["Which one of the following statements regarding the Mother and Child Protection Scheme (2025-26, up to December) is correct?"],"o":["Free medicines reached 10.15 lakh pregnant women.","Free blood transfusion reached 5.4 lakh pregnant women.","Free transport from home to hospital (4.43 lakh) exceeded transport from hospital to home (4.92 lakh).","Free cooked meals were provided to 7.37 lakh pregnant women."],"e":["Correct figures: free medicines 25.47 lakh; diagnostics 10.15 lakh; cooked meals 7.37 lakh; home-to-hospital 4.43 lakh; hospital-to-home 4.92 lakh; blood transfusion 54,314.","(a) swaps medicines with diagnostics; (c) misplaces the decimal (54,314 is the correct figure); (d) reverses the comparison."],"i":"Same-looking numbers attached to different services is the examiner's trap. Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 2: Health and Well-being","s":"Chapter 2, p. 39.","hq":["मातृ एवं शिशु संरक्षण योजना (2025-26, दिसंबर तक) के संबंध में निम्नलिखित में से कौन-सा कथन सही है?"],"ho":["निःशुल्क दवाइयाँ 10.15 लाख गर्भवती महिलाओं तक पहुँचीं।","निःशुल्क रक्त आधान 5.4 लाख गर्भवती महिलाओं तक पहुँचा।","घर से अस्पताल तक निःशुल्क परिवहन (4.43 लाख) अस्पताल से घर परिवहन (4.92 लाख) से अधिक रहा।","7.37 लाख गर्भवती महिलाओं को निःशुल्क पका हुआ भोजन उपलब्ध कराया गया।"],"he":["सही आँकड़े: निःशुल्क दवाइयाँ 25.47 लाख; जाँचें 10.15 लाख; पका भोजन 7.37 लाख; घर से अस्पताल 4.43 लाख; अस्पताल से घर 4.92 लाख; रक्त आधान 54,314।","(a) में दवाइयों और जाँचों की अदला-बदली है; (b) में दशमलव गलत जगह है (सही आँकड़ा 54,314 है); (c) में तुलना उलटी है।"],"hi":"अलग-अलग सेवाओं से जुड़ी एक जैसी दिखने वाली संख्याएँ परीक्षक का जाल हैं।","hs":"अध्याय 2, पृ. 39."},{"n":27,"t":"Multi-statement","g":"RAS","ans":1,"q":["Consider the following statements regarding the Employees' State Insurance Scheme (ESIS) in Rajasthan:","1. ESIS covers establishments with at least ten workers earning wages not exceeding ₹15,000 per month.","2. Funding is shared between the ESI Corporation and the State Government in the ratio 7:1.","3. Employers contribute 3.25 per cent and employees 0.75 per cent.","4. The scheme operates three 50-bedded hospitals at Jodhpur, Bhilwara and Pali and 76 dispensaries.","Which of the statements given above is/are correct?"],"o":["1 and 4 only","2, 3 and 4 only","1, 2 and 3 only","1, 2, 3 and 4"],"e":["Statement 1: Incorrect. Coverage applies to establishments with at least ten workers earning wages not exceeding ₹21,000 per month.","Statements 2, 3 and 4: Correct. Funding is shared 7:1 between the ESI Corporation and the State; employers contribute 3.25% and employees 0.75%; there are three 50-bed hospitals (Jodhpur, Bhilwara, Pali) and 76 dispensaries.","More than 67.44 lakh insured persons and dependents benefit; ₹144.77 crore was spent in 2025-26 (up to December)."],"i":"Wage ceiling and contribution rates are standard fact-picks.","s":"Chapter 2, p. 39.","hq":["राजस्थान में कर्मचारी राज्य बीमा योजना (ESIS) के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. ESIS उन प्रतिष्ठानों को कवर करती है जिनमें कम से कम दस श्रमिक हों और जिनकी मज़दूरी ₹15,000 प्रति माह से अधिक न हो।","2. वित्तपोषण ESI निगम और राज्य सरकार के बीच 7:1 के अनुपात में बँटा है।","3. नियोक्ता 3.25 प्रतिशत और कर्मचारी 0.75 प्रतिशत अंशदान देते हैं।","4. योजना जोधपुर, भीलवाड़ा और पाली में तीन 50-बिस्तर वाले अस्पताल और 76 औषधालय संचालित करती है।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 1 और 4","केवल 2, 3 और 4","केवल 1, 2 और 3","1, 2, 3 और 4"],"he":["कथन 1: गलत। कवरेज उन प्रतिष्ठानों पर लागू है जिनमें कम से कम दस श्रमिक हों और मज़दूरी ₹21,000 प्रति माह से अधिक न हो।","कथन 2, 3 और 4: सही। वित्तपोषण ESI निगम और राज्य के बीच 7:1 में बँटा है; नियोक्ता 3.25% और कर्मचारी 0.75% देते हैं; तीन 50-बिस्तर अस्पताल (जोधपुर, भीलवाड़ा, पाली) और 76 औषधालय हैं।","67.44 लाख से अधिक बीमित व्यक्ति और आश्रित लाभान्वित होते हैं; 2025-26 (दिसंबर तक) ₹144.77 करोड़ व्यय हुआ।"],"hi":"मज़दूरी की सीमा और अंशदान की दरें मानक तथ्य-प्रश्न हैं।","hs":"अध्याय 2, पृ. 39."},{"n":28,"t":"Multi-statement","g":"UPSC","ans":0,"q":["Consider the following statements regarding community health workers under the National Rural Health Mission in Rajasthan:","1. In Rajasthan, the ASHA Sahyogini is a joint worker of the Department of Medical Health and the Department of Panchayati Raj.","2. ASHA is selected through the Gram Sabha.","3. Village Health and Sanitation Committees are chaired by the Sarpanch/Wardpanch, with the ASHA Sahyogini as convener.","4. ASHAs receive a fixed monthly salary and no performance-based incentives.","Which of the statements given above is/are correct?"],"o":["2 and 3 only","1 and 4 only","1, 2 and 3 only","2, 3 and 4 only"],"e":["Statement 1: Incorrect. In Rajasthan, the ASHA Sahyogini is a joint worker of the Medical Health Department and the Women and Child Development Department.","Statement 2: Correct. ASHA is selected through the Gram Sabha.","Statement 3: Correct. 43,440 Village Health and Sanitation Committees are chaired by the Sarpanch/Wardpanch, with ASHA Sahyogini as convener.","Statement 4: Incorrect. ASHAs are paid monetary incentives for services. 54,022 ASHAs work in the State (December 2025). Rajasthan Economic Review 2025-26 | MCQ Practice Ch. 2: Health and Well-being"],"i":"ASHA is called the largest community health worker programme in the world. Know who convenes the VHSC.","s":"Chapter 2, pp. 39-41.","hq":["राजस्थान में राष्ट्रीय ग्रामीण स्वास्थ्य मिशन के अंतर्गत सामुदायिक स्वास्थ्य कार्यकर्ताओं के संबंध में निम्नलिखित कथनों पर विचार कीजिए:","1. राजस्थान में आशा सहयोगिनी चिकित्सा स्वास्थ्य विभाग और पंचायती राज विभाग की संयुक्त कार्यकर्ता है।","2. आशा का चयन ग्राम सभा के माध्यम से होता है।","3. ग्राम स्वास्थ्य एवं स्वच्छता समितियों की अध्यक्षता सरपंच/वार्डपंच करते हैं और आशा सहयोगिनी संयोजक होती है।","4. आशा को निश्चित मासिक वेतन मिलता है और कोई प्रदर्शन-आधारित प्रोत्साहन नहीं मिलता।","ऊपर दिए गए कथनों में से कौन-सा/से सही है/हैं?"],"ho":["केवल 2 और 3","केवल 1 और 4","केवल 1, 2 और 3","केवल 2, 3 और 4"],"he":["कथन 1: गलत। राजस्थान में आशा सहयोगिनी चिकित्सा स्वास्थ्य विभाग और महिला एवं बाल विकास विभाग की संयुक्त कार्यकर्ता है।","कथन 2: सही। आशा का चयन ग्राम सभा के माध्यम से होता है।","कथन 3: सही। 43,440 ग्राम स्वास्थ्य एवं स्वच्छता समितियों की अध्यक्षता सरपंच/वार्डपंच करते हैं, आशा सहयोगिनी संयोजक है।","कथन 4: गलत। आशा को सेवाओं के लिए मौद्रिक प्रोत्साहन दिए जाते हैं। राज्य में 54,022 आशा कार्यरत हैं (दिसंबर 2025)।"],"hi":"आशा को विश्व का सबसे बड़ा सामुदायिक स्वास्थ्य कार्यकर्ता कार्यक्रम कहा जाता है। जानिए कि VHSC का संयोजक कौन होता है।","hs":"अध्याय 2, पृ. 39-41."},{"n":29,"t":"Match the following","g":"RAS + UPSC","ans":2,"q":["Match the NHM programme (List I) with its feature (List II) and select the correct answer using the code below.","A. Rashtriya Bal Swasthya Karyakram (RBSK)","B. Rashtriya Kishore Swasthya Karyakram (RKSK)","C. 104 Janani Express","D. 108 Ambulance Service Yojana","1. Launched in September 2008; 1,094 ambulances","2. UJALA Clinics, outreach and weekly Iron Folic Acid supplementation","3. Mobile Health Teams screening children under 18 for 40 health issues","4. Transport of pregnant women and infants"],"o":["A-3, B-1, C-4, D-2","A-1, B-3, C-2, D-4","A-3, B-2, C-4, D-1","A-2, B-3, C-1, D-4"],"e":["RBSK: Mobile Health Teams screen children under 18 for 40 pre-identified health issues (34.10 lakh screened, 732 major surgeries).","RKSK: UJALA Clinics, outreach and weekly Iron Folic Acid supplementation for adolescents.","104 Janani Express: transport of pregnant women and infants.","108 Ambulance Service: launched in September 2008; 1,094 ambulances."],"i":"Numbers 104 and 108 are often confused. 104 = maternal and infant transport; 108 = emergency response.","s":"Chapter 2, p. 40.","m":[1,4,4],"h":["List I","List II"],"hq":["सूची I (NHM कार्यक्रम) का सूची II (विशेषता) से मिलान कीजिए और नीचे दिए गए कूट से सही उत्तर चुनिए।","A. राष्ट्रीय बाल स्वास्थ्य कार्यक्रम (RBSK)","B. राष्ट्रीय किशोर स्वास्थ्य कार्यक्रम (RKSK)","C. 104 जननी एक्सप्रेस","D. 108 एम्बुलेंस सेवा योजना","1. सितंबर 2008 में शुरू; 1,094 एम्बुलेंस","2. उजाला क्लिनिक, आउटरीच और साप्ताहिक आयरन फोलिक एसिड पूरकता","3. 40 स्वास्थ्य समस्याओं हेतु 18 वर्ष से कम आयु के बच्चों की जाँच करने वाली मोबाइल हेल्थ टीमें","4. गर्भवती महिलाओं और शिशुओं का परिवहन"],"ho":["A-3, B-1, C-4, D-2","A-1, B-3, C-2, D-4","A-3, B-2, C-4, D-1","A-2, B-3, C-1, D-4"],"he":["RBSK: मोबाइल हेल्थ टीमें 40 पूर्व-चिह्नित स्वास्थ्य समस्याओं हेतु 18 वर्ष से कम आयु के बच्चों की जाँच करती हैं (34.10 लाख की जाँच, 732 बड़ी शल्य क्रियाएँ)।","RKSK: उजाला क्लिनिक, आउटरीच और किशोरों के लिए साप्ताहिक आयरन फोलिक एसिड पूरकता।","104 जननी एक्सप्रेस: गर्भवती महिलाओं और शिशुओं का परिवहन।","108 एम्बुलेंस सेवा: सितंबर 2008 में शुरू; 1,094 एम्बुलेंस।"],"hi":"104 और 108 की संख्याएँ अक्सर भ्रमित की जाती हैं। 104 = मातृ एवं शिशु परिवहन; 108 = आपातकालीन प्रतिक्रिया।","hs":"अध्याय 2, पृ. 40."},{"n":30,"t":"Data-based","g":"RAS + UPSC","ans":3,"q":["Using the budget and expenditure figures for 2025-26 (up to December) in the Review, which of the following had the highest percentage utilisation?"],"o":["104 Janani Express (₹55.24 crore of ₹100.24 crore)","Mobile Medical Service (₹7.45 crore of ₹87.08 crore)","National Urban Health Mission (₹58.25 crore of ₹198.01 crore)","108 Ambulance Service Yojana (₹173.57 crore of ₹224.77 crore)"],"e":["108
